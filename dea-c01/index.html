<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>DEA-C01 Study Hub</title>

<style>
/* Layout: study handbook — fixed topic tree on the left (drawer on phones), one lesson per page, quiz at the end; dotted words open a definition card */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#18212e; --muted:#5a6676; --line:#dfe3ea;
  --accent:#0d6b62; --accent-soft:#e2f2ef; --tip:#8a5a00; --tip-soft:#fbf1dc;
  --warn:#a3322a; --warn-soft:#fbe9e7; --ok:#1f7a3a; --ok-soft:#e5f4e8; --code:#eef1f5;
  --simple:#3d4fa8; --simple-soft:#eceffb;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --side:290px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --panel:#171e27; --ink:#e4e9f0; --muted:#97a3b3; --line:#2a3441;
  --accent:#4cc3b4; --accent-soft:#16302d; --tip:#e7b85a; --tip-soft:#2d2514;
  --warn:#f0877d; --warn-soft:#331b19; --ok:#6fd08a; --ok-soft:#16291b; --code:#1e2732;
  --simple:#9aa9ff; --simple-soft:#1c2140; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --panel:#171e27; --ink:#e4e9f0; --muted:#97a3b3; --line:#2a3441;
  --accent:#4cc3b4; --accent-soft:#16302d; --tip:#e7b85a; --tip-soft:#2d2514;
  --warn:#f0877d; --warn-soft:#331b19; --ok:#6fd08a; --ok-soft:#16291b; --code:#1e2732;
  --simple:#9aa9ff; --simple-soft:#1c2140; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--accent)}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;font:600 15px var(--body);cursor:pointer}

.wrap{display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
.side{position:sticky;top:calc(53px + env(safe-area-inset-top,0px));height:calc(100vh - 53px - env(safe-area-inset-top,0px));overflow-y:auto;
  border-right:1px solid var(--line);background:var(--panel);padding:14px 0 40px}
.search{margin:0 14px 10px;width:calc(100% - 28px);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:15px var(--body)}
.mod{margin-top:6px}
.mod h4{margin:12px 16px 4px;font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.mod h4 small{font-weight:600;letter-spacing:.04em;text-transform:none}
.side a{display:flex;gap:8px;align-items:center;padding:6px 16px 6px 22px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.35;border-left:3px solid transparent}
.side a:hover{background:var(--accent-soft)}
.side a.on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
.side a .d{width:14px;flex:none;font-size:12px;color:var(--ok)}
.side a.soon{color:var(--muted)}

main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:760px;margin:0 auto}
.crumb{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,38px);line-height:1.15;letter-spacing:-.02em;margin:6px 0 14px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:23px;margin:34px 0 8px;text-wrap:balance}
h3{font-size:18px;margin:22px 0 6px}
p,li{max-width:68ch}
ul,ol{padding-left:22px}
li{margin:5px 0}
code{font-family:var(--mono);font-size:.86em;background:var(--code);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre{font-family:var(--mono);font-size:13.5px;line-height:1.5;background:var(--code);padding:14px;border-radius:8px;overflow-x:auto;border:1px solid var(--line)}
pre code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--panel)}
th,td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--line)}
th{background:var(--code);font-weight:700}
tr:last-child td{border-bottom:0}
.lead{font-size:19px;color:var(--muted)}
.learn{border:1px solid var(--line);border-radius:10px;padding:10px 16px;background:var(--panel);margin:16px 0}
.learn b.l{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.learn ul{margin:6px 0}
.box{border-radius:8px;padding:12px 16px;margin:18px 0;border:1px solid}
.box b.l{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.box p:first-of-type{margin-top:4px}
.box p:last-child{margin-bottom:4px}
.simple{background:var(--simple-soft);border-color:color-mix(in srgb,var(--simple) 35%,transparent)}
.simple b.l{color:var(--simple)}
.tip{background:var(--tip-soft);border-color:color-mix(in srgb,var(--tip) 35%,transparent)}
.tip b.l{color:var(--tip)}
.key{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.key b.l{color:var(--accent)}
.trap{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.trap b.l{color:var(--warn)}
.lab{background:var(--panel);border-color:var(--line);border-style:dashed}
.lab b.l{color:var(--muted)}

/* glossary terms */
.gl{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:help;border-bottom:1.5px dotted var(--accent);line-height:inherit}
.gl:hover{color:var(--accent)}
.pop{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(460px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 40px rgba(0,0,0,.25);padding:14px 16px 12px}
.pop .t{font-family:var(--display);font-weight:800;font-size:20px}
.pop .f{color:var(--accent);font-weight:700;margin-bottom:4px}
.pop p{margin:4px 0 8px;font-size:16px}
.pop .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.pop button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 12px;font:600 14px var(--body);cursor:pointer}
.gloss{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);margin-top:12px}
.gloss .g{padding:10px 14px;border-bottom:1px solid var(--line)}
.gloss .g:last-child{border-bottom:0}
.gloss .g b{font-family:var(--display);font-size:17px}
.gloss .g .f{color:var(--accent);font-weight:600;margin-left:6px}
.gloss .g p{margin:2px 0 0;font-size:15.5px}
.gloss h3{margin:0;padding:6px 14px;background:var(--code);font-size:14px;letter-spacing:.06em}

.quiz{margin-top:40px;border-top:2px solid var(--ink);padding-top:14px}
.quiz h2{margin-top:0}
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.q .stem{font-weight:600;margin:0 0 10px}
.q .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;background:var(--bg)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.qbtn{margin-top:8px;border:0;border-radius:8px;padding:8px 14px;font:600 15px var(--body);cursor:pointer;background:var(--accent);color:var(--panel)}
.qbtn:disabled{opacity:.45;cursor:default}
.why{margin-top:10px;font-size:15.5px;padding:10px 12px;border-radius:8px;background:var(--code)}
.why b{color:var(--ok)}
.why b.x{color:var(--warn)}
.score{font-weight:700;font-variant-numeric:tabular-nums}

.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:18px;border-top:1px solid var(--line)}
.nav{flex:1 1 200px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);background:var(--panel)}
.nav small{display:block;color:var(--muted);font-size:13px}
.nav.nx{text-align:right}
.done-btn{display:inline-flex;align-items:center;gap:8px;margin-top:28px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:9px 16px;font:600 15px var(--body);cursor:pointer}
.done-btn.is{background:var(--accent);color:var(--panel)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);text-decoration:none;color:var(--ink)}
.card b{font-family:var(--display);font-size:17px;display:block}
.card span{font-size:14px;color:var(--muted)}
.card.soon{opacity:.75}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;padding:1px 8px;border-radius:99px;background:var(--code);color:var(--muted);margin-left:6px;vertical-align:2px}

@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:block}
  .side{position:fixed;z-index:25;top:calc(53px + env(safe-area-inset-top,0px));left:0;width:min(86vw,320px);height:calc(100% - 53px - env(safe-area-inset-top,0px));
    transform:translateX(-102%);transition:transform .2s ease;box-shadow:0 10px 40px rgba(0,0,0,.25);padding-left:env(safe-area-inset-left,0px)}
  .side.open{transform:none}
  .bar{width:48px}
  .prog .lbl{display:none}
  .top{gap:10px}
  .brand{font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>

<header class="top">
  <button class="menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">Topics</button>
  <div class="brand">DEA-C01 <span>Study Hub</span></div>
  <div class="prog"><span class="lbl">Progress</span><div class="bar"><i id="barFill"></i></div><span id="progTxt">0/0</span></div>
</header>
<div class="wrap">
  <nav class="side" id="side" aria-label="Topics">
    <input class="search" id="search" type="search" placeholder="Search topics" aria-label="Search topics">
    <div id="tree"></div>
  </nav>
  <main><article class="page" id="page"></article></main>
</div>
<div class="pop" id="pop" role="dialog" aria-live="polite" hidden>
  <div class="t" id="popT"></div><div class="f" id="popF"></div><p id="popM"></p>
  <div class="row"><a href="#glossary" id="popAll">Open full glossary</a><button type="button" id="popX">Close</button></div>
</div>

<script>
/* ---------- glossary: every abbreviation and key term, in plain words ---------- */
const GLOSSARY=[
 ["ABAC","Attribute-Based Access Control","Giving permissions by matching labels (tags) on the person and on the resource, e.g. people tagged project=sales can use resources tagged project=sales."],
 ["ACID","Atomicity, Consistency, Isolation, Durability","Four guarantees that a database change either fully happens or doesn't happen at all, so data never ends up half-updated."],
 ["API","Application Programming Interface","A defined way for one program to ask another to do something. Every click in the AWS console calls an AWS API behind the scenes."],
 ["ARN","Amazon Resource Name","The unique 'full address' of one AWS resource, e.g. arn:aws:s3:::my-bucket. Policies use ARNs to say which resources a rule applies to."],
 ["AWS","Amazon Web Services","Amazon's cloud platform: 200+ services you rent over the internet."],
 ["AZ","Availability Zone","One or more separate data centres inside a Region, with their own power and network, so a failure in one doesn't take down the others."],
 ["BI","Business Intelligence","Dashboards and reports that help people make decisions from data."],
 ["CDC","Change Data Capture","Copying only the rows that were inserted, updated or deleted in a database, instead of copying the whole table again."],
 ["CDK","Cloud Development Kit","Write AWS infrastructure in a programming language like Python; it generates CloudFormation templates."],
 ["CI/CD","Continuous Integration / Continuous Delivery","Automatically testing and deploying code every time it changes."],
 ["CIDR","Classless Inter-Domain Routing","The way to write a range of IP addresses, e.g. 10.0.0.0/16. The number after the slash decides how big the range is: smaller number = bigger range."],
 ["CLI","Command Line Interface","Typing commands in a terminal instead of clicking, e.g. aws s3 ls."],
 ["CPU","Central Processing Unit","The 'brain' of a computer that runs instructions. A vCPU is a virtual CPU you rent in the cloud."],
 ["CRR","Cross-Region Replication","Automatically copying S3 objects from a bucket in one Region to a bucket in another Region."],
 ["CSV","Comma-Separated Values","A plain text file where each line is a row and commas separate the columns."],
 ["CTAS","CREATE TABLE AS SELECT","A SQL statement that creates a new table from the result of a query."],
 ["DAX","DynamoDB Accelerator","An in-memory cache in front of DynamoDB for microsecond reads."],
 ["DMS","Database Migration Service","AWS service that copies data from one database to another, once or continuously."],
 ["DNS","Domain Name System","The internet's phone book: turns a name like aws.amazon.com into an IP address."],
 ["DPU","Data Processing Unit","Glue's billing unit for compute: one DPU is 4 vCPUs and 16 GB of memory."],
 ["DQDL","Data Quality Definition Language","The simple rule language Glue Data Quality uses, e.g. IsComplete \"id\"."],
 ["EBS","Elastic Block Store","Virtual hard disks attached to EC2 servers."],
 ["EC2","Elastic Compute Cloud","AWS virtual servers you rent by the second."],
 ["ELT","Extract, Load, Transform","Load raw data into the warehouse first, then clean it there with SQL."],
 ["EMR","Elastic MapReduce","AWS's managed service for big-data frameworks like Apache Spark and Hive."],
 ["ENI","Elastic Network Interface","A virtual network card. Anything placed inside a VPC (a server, a Glue worker, a Lambda) gets one, with a private IP address."],
 ["ETL","Extract, Transform, Load","Take data from a source, clean or reshape it, then load it into a target."],
 ["GB","Gigabyte","About one thousand megabytes. 1,000 GB is about one TB (terabyte)."],
 ["GSI","Global Secondary Index","An extra index on a DynamoDB table with a different key, so you can look items up another way."],
 ["HNSW","Hierarchical Navigable Small World","A fast, graph-based index for finding similar vectors (used in AI search)."],
 ["HTTP","HyperText Transfer Protocol","The language browsers and web APIs use to talk to servers."],
 ["HTTPS","HTTP Secure","HTTP encrypted with TLS so nobody in between can read or change the data. Uses port 443."],
 ["IaaS","Infrastructure as a Service","You rent raw servers, storage and network; you manage the operating system and software yourself. Example: EC2."],
 ["IaC","Infrastructure as Code","Describing your AWS resources in a file so they can be created the same way every time. Examples: CloudFormation, CDK."],
 ["IAM","Identity and Access Management","The AWS service that controls who can sign in and what each person or service is allowed to do."],
 ["IGW","Internet Gateway","The 'main gate' that connects a VPC to the public internet."],
 ["IP","Internet Protocol (address)","A number that identifies a device on a network, like a postal address, e.g. 10.0.1.25."],
 ["IVF","Inverted File (index)","A vector index that groups similar vectors into clusters and searches only the nearest clusters."],
 ["JDBC","Java Database Connectivity","A standard way for programs (including Glue) to connect to relational databases."],
 ["JSON","JavaScript Object Notation","A text format of names and values in curly braces. IAM policies are written in JSON."],
 ["KMS","Key Management Service","The AWS service that creates and protects encryption keys."],
 ["LLM","Large Language Model","An AI model that reads and writes text, e.g. Claude."],
 ["LSI","Local Secondary Index","A DynamoDB index with the same partition key but a different sort key; must be created with the table."],
 ["MFA","Multi-Factor Authentication","Signing in with a password plus a second proof, like a code from an app on your phone."],
 ["MSK","Managed Streaming for Apache Kafka","AWS-run Apache Kafka clusters for streaming data."],
 ["MWAA","Managed Workflows for Apache Airflow","AWS-run Apache Airflow for scheduling and orchestrating pipelines."],
 ["NACL","Network Access Control List","A firewall for a whole subnet. Has numbered allow and deny rules and is stateless (checks traffic in both directions separately)."],
 ["NAT","Network Address Translation","A NAT Gateway lets servers in a private subnet go out to the internet and get replies, while nobody outside can start a connection to them."],
 ["OLAP","Online Analytical Processing","Big analytical queries over lots of rows, e.g. total sales per month. Data warehouses are built for this."],
 ["OLTP","Online Transaction Processing","Many small, fast reads and writes from an app, e.g. placing an order. Normal app databases are built for this."],
 ["OS","Operating System","The base software of a computer, e.g. Linux or Windows."],
 ["OU","Organizational Unit","A folder of AWS accounts inside AWS Organizations, used to apply the same rules to many accounts."],
 ["PaaS","Platform as a Service","AWS runs the servers and operating system; you use the platform. Example: RDS."],
 ["PII","Personally Identifiable Information","Data that identifies a person: name, phone number, email, ID numbers."],
 ["RAM","Resource Access Manager","AWS service for sharing resources (like Lake Formation tables) with other AWS accounts."],
 ["RBAC","Role-Based Access Control","Giving permissions by job role, e.g. everyone in the Analyst role can read the reports bucket."],
 ["RDS","Relational Database Service","AWS-managed databases like MySQL, PostgreSQL, Oracle and SQL Server."],
 ["RPU","Redshift Processing Unit","The compute unit Redshift Serverless bills by."],
 ["S3","Simple Storage Service","AWS object storage: put files (objects) in buckets. The base of every AWS data lake."],
 ["SaaS","Software as a Service","Ready-made software you just use over the internet, e.g. Gmail or Salesforce."],
 ["SAM","Serverless Application Model","A short way of writing CloudFormation for serverless apps (Lambda, API Gateway)."],
 ["SCP","Service Control Policy","A rule set in AWS Organizations that limits the maximum permissions for every user and role in an account, even admins."],
 ["SDK","Software Development Kit","A library for calling AWS from code. boto3 is the AWS SDK for Python."],
 ["SNS","Simple Notification Service","Sends a message to many subscribers at once (email, SMS, Lambda, queues). Used for alerts."],
 ["SQL","Structured Query Language","The language used to query and change data in tables."],
 ["SQS","Simple Queue Service","A message queue: one part of a system drops messages in, another picks them up later."],
 ["SSH","Secure Shell","An encrypted way to log in to a Linux server's command line. Uses port 22."],
 ["SSO","Single Sign-On","Log in once with your company account and get into many apps, including AWS."],
 ["STS","Security Token Service","The AWS service that hands out temporary credentials when someone assumes a role."],
 ["TB","Terabyte","About 1,000 GB. Athena charges per TB of data scanned."],
 ["TCP","Transmission Control Protocol","The common rule-set for reliable connections: data arrives complete and in order. Databases and HTTPS use it."],
 ["TLS","Transport Layer Security","The encryption used by HTTPS and database connections to protect data while it travels."],
 ["TTL","Time To Live","An expiry time after which something is automatically deleted, e.g. DynamoDB items."],
 ["UDP","User Datagram Protocol","A faster, no-guarantee way to send data (no delivery check). Used for things like DNS lookups and video calls."],
 ["VPC","Virtual Private Cloud","Your own private, isolated network inside an AWS Region."],
 ["VPN","Virtual Private Network","An encrypted tunnel over the internet that connects your office network to your VPC."],
 ["WLM","Workload Management","Redshift's way of splitting memory and concurrency between different groups of queries."],
 ["vCPU","virtual CPU","One virtual processor core that you rent with a cloud server or service."],
 ["AQE","Adaptive Query Execution","A Spark 3 feature that re-plans a query while it runs, for example splitting skewed partitions or switching to a broadcast join."],
 ["CTE","Common Table Expression","A named, temporary result written with WITH name AS (…) at the start of a query. Makes long SQL easier to read."],
 ["DAG","Directed Acyclic Graph","A set of tasks joined by arrows showing which runs after which, with no loops. Airflow pipelines are DAGs."],
 ["EFS","Elastic File System","A shared network file system that many servers can mount at once."],
 ["HDFS","Hadoop Distributed File System","The file system that spreads files across the disks of a Hadoop or EMR cluster. Data is lost when the cluster is deleted."],
 ["IA","Infrequent Access","S3 storage classes for data you read rarely but need back in milliseconds when you do. Cheaper storage, but you pay per GB retrieved."],
 ["KB","Kilobyte","About 1,000 bytes."],
 ["MB","Megabyte","About 1,000 KB. A typical photo is a few MB."],
 ["OOM","Out Of Memory","An error when a program needs more memory than the machine has."],
 ["ORC","Optimized Row Columnar","A columnar file format, very similar to Parquet, popular with Hive."],
 ["PB","Petabyte","About 1,000 TB."],
 ["RTC","Replication Time Control","An S3 replication option that copies 99.99% of objects within 15 minutes, with monitoring."],
 ["SCD","Slowly Changing Dimension","How a dimension table handles values that change over time, such as a customer's city. Type 1 overwrites; Type 2 keeps history."],
 ["SRR","Same-Region Replication","Automatically copying S3 objects to another bucket in the same Region."],
 ["SSE","Server-Side Encryption","AWS encrypts your data when storing it and decrypts it when you read it. SSE-S3 is the default for all new S3 objects."],
 ["WORM","Write Once, Read Many","Data that can't be changed or deleted for a set period. S3 Object Lock provides this."],
 /* concept words */
 ["stateful","—","A firewall that remembers connections. If it allowed a request, it automatically allows that request's reply back. Security groups are stateful."],
 ["stateless","—","A firewall with no memory. It checks every packet against the rules, in each direction separately, so you must allow both the request and the reply. NACLs are stateless."],
 ["security group","—","A virtual firewall attached to one resource (a server, database or Glue connection). Allow rules only, stateful."],
 ["subnet","—","A smaller slice of a VPC's IP address range that lives in exactly one Availability Zone."],
 ["route table","—","A list of rules that tells network traffic leaving a subnet where to go next."],
 ["serverless","—","A service where AWS runs and scales all the servers for you; you never see them and pay only for what you use."],
 ["principal","—","Whoever is making a request to AWS: a user, a role, an AWS service or another account."],
 ["ingress","—","Traffic coming in. Same as inbound."],
 ["egress","—","Traffic going out. Same as outbound."],
 ["ephemeral port","—","A temporary high-numbered port (1024–65535) that a computer picks for receiving the reply to a request it sent."],
 ["data sovereignty","—","Rules that data must stay inside a certain country or Region."],
 ["data lake","—","A central store (on AWS, S3) that holds raw data of any format cheaply. Structure is applied only when you read it."],
 ["data warehouse","—","A database built for analytics: structured tables, fast SQL over huge data, used by dashboards. On AWS: Redshift."],
 ["lakehouse","—","A data lake that also supports warehouse features like updates, deletes and transactions, using a table format such as Apache Iceberg."],
 ["schema-on-read","—","Data is stored as-is; its structure (columns and types) is applied only when someone queries it. How data lakes work."],
 ["schema-on-write","—","Data must match a fixed table structure before it can be stored. How databases and warehouses work."],
 ["columnar","—","Storing data column by column instead of row by row, so a query reads only the columns it needs. Parquet and Redshift are columnar."],
 ["Parquet","—","Apache Parquet: the most common columnar file format for analytics. Compressed, typed, and lets engines skip data they don't need."],
 ["Avro","—","Apache Avro: a compact row-based file format that stores its schema with the data. Good for streaming and changing schemas."],
 ["partition","—","In a data lake: a folder that holds rows with the same value of a column, e.g. date=2026-10-29, so queries can skip other folders. In Spark: one chunk of data processed by one task."],
 ["partition pruning","—","Skipping partitions (folders) that can't match a query's filter, so less data is read."],
 ["cardinality","—","How many different values a column has. Country has low cardinality; order ID has very high cardinality."],
 ["idempotent","—","Running the same job twice gives the same result as running it once: no duplicates, no double counting."],
 ["upsert","—","Update the row if it already exists, insert it if it doesn't. Done in SQL with MERGE."],
 ["backfill","—","Re-running a pipeline for past dates, for example after fixing a bug or adding a new column."],
 ["fact table","—","The central table of a star schema holding measurable events, such as each sale with its quantity and amount."],
 ["dimension table","—","A table describing the who, what, where and when of facts, such as customer, product, store and date."],
 ["grain","—","What exactly one row of a fact table represents, e.g. one product line on one order."],
 ["shuffle","—","In Spark, moving data between machines so rows with the same key end up together. Needed for joins and group-bys, and usually the slowest part of a job."],
 ["data skew","—","When one key or partition holds far more data than the others, so one worker does most of the work and the job waits for it."],
 ["prefix","—","The start of an S3 object key, such as raw/sales/. The console shows prefixes as folders, but S3 has no real folders."],
 ["delete marker","—","What S3 adds when you delete an object in a versioned bucket. The object looks deleted, but older versions are kept and can be restored."],
 ["predicate pushdown","—","Applying a query's filter while reading files, so blocks of data that can't match are skipped. Parquet's min/max statistics make this possible."]
];
const GMAP={};GLOSSARY.forEach(([t,f,m])=>GMAP[t.toLowerCase()]={t,f,m});
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&");
const TERM_RE=new RegExp("(?<![A-Za-z0-9\\-/:.])("+GLOSSARY.map(g=>g[0]).sort((a,b)=>b.length-a.length).map(escRe).join("|")+")s?(?![A-Za-z0-9\\-/])","gi");
const CASE_SENSITIVE=new Set(GLOSSARY.filter(g=>g[1]!=="—").map(g=>g[0]));

function linkTerms(root){
  const seen=new Set(),nodes=[];
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>
    n.parentElement.closest("pre,code,a,button,h1,.crumb,.why,.opt,.gloss,.pop")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const txt=n.nodeValue;let m,last=0,frag=null;TERM_RE.lastIndex=0;
    while((m=TERM_RE.exec(txt))){
      const k=m[1].toLowerCase(),g=GMAP[k];
      if(!g||seen.has(k))continue;
      if(CASE_SENSITIVE.has(g.t)&&m[1]!==g.t&&!(g.t==="vCPU"))continue; // abbreviations must match case
      seen.add(k);frag=frag||document.createDocumentFragment();
      frag.append(txt.slice(last,m.index));
      const b=document.createElement("button");b.type="button";b.className="gl";b.dataset.k=k;b.textContent=m[0];
      b.setAttribute("aria-label",m[0]+": show meaning");frag.append(b);last=m.index+m[0].length;
    }
    if(frag){frag.append(txt.slice(last));n.replaceWith(frag);}
  });
}

add("cloud","cloud-basics","What cloud computing is",`
${learn(["What a server and a data centre are","What “the cloud” means and why companies use it","The three ways of using the cloud: IaaS, PaaS and serverless","Words the exam uses: availability, durability, scalability"])}
<h2>First, what is a server?</h2>
<p>A <b>server</b> is a computer that runs all day and night and “serves” other computers. When you open a website, a server sends you the page. When a company stores sales data, it sits on a server's disks.</p>
<p>A <b>data centre</b> is a large building full of thousands of servers, with power backup, cooling and security guards.</p>
<h2>The old way vs the cloud way</h2>
<p><b>Old way:</b> a company buys its own servers, waits weeks for delivery, installs them in its own room, pays for electricity and staff, and replaces them every few years. If it buys too few, things slow down. If it buys too many, money is wasted on idle machines.</p>
<p><b>Cloud way:</b> the company rents servers, storage and ready-made services from a provider like <b>AWS</b> over the internet. It can get them in minutes, pays only for what it uses, and stops paying when it stops using them.</p>
${simple("<p>It's like the difference between <b>buying a car</b> and <b>booking a cab</b>. With your own car you pay the full price upfront, plus insurance and servicing, even on days you don't drive. With a cab you pay only for the trips you take, and someone else maintains the car.</p>")}
<h2>Why companies use the cloud</h2>
<ul>
<li><b>No big upfront cost:</b> pay monthly for what you use.</li>
<li><b>Elasticity:</b> use 100 servers for a big job tonight and zero tomorrow.</li>
<li><b>Speed:</b> create a database in minutes instead of weeks.</li>
<li><b>Global reach:</b> run your system in many countries without building anything there.</li>
<li><b>Managed services:</b> AWS can do the boring work (installing updates, taking backups, replacing broken disks) for you.</li>
</ul>
<h2>Three ways of using the cloud</h2>
<p>The difference is <b>how much of the work you do</b> and how much AWS does.</p>
${simple("<p>Think of a place to live in Hyderabad:</p><ul><li><b>IaaS</b> is renting an <b>empty flat</b>. You bring the furniture, fix the taps and pay the bills.</li><li><b>Managed / PaaS</b> is a <b>furnished flat with a maintenance team</b>. You just live there and keep your things in order.</li><li><b>Serverless</b> is a <b>hotel room</b>. You just use it and pay per night; everything else is handled.</li></ul>")}
${table(["Model","Full form","You look after","AWS looks after","Example"],[
 ["IaaS","Infrastructure as a Service","The operating system, software, updates and your data","The physical machines, network and building","EC2 (Elastic Compute Cloud) — virtual servers"],
 ["Managed / PaaS","Platform as a Service","Your data, settings and who can access them","Servers, operating system, updates, backups","RDS (Relational Database Service), EMR (Elastic MapReduce)"],
 ["Serverless","—","Only your code, SQL query or configuration","Everything else, including adding more capacity when needed","Lambda, Athena, Glue"]])}
<p>There's also <b>SaaS</b> (Software as a Service): finished software you just log in to, like Gmail or Salesforce. You don't build anything with it, but data pipelines often <i>pull data from</i> SaaS apps.</p>
<h3>What “serverless” really means</h3>
<p>Servers still exist, but you never see or manage them. You don't choose how many, you don't install anything on them, and they grow or shrink automatically. You pay only when your code or query actually runs, so a serverless service that nobody uses costs little or nothing.</p>
${tip("<p>When a question says <b>“least operational overhead”</b> (the least work to keep it running) or <b>“no infrastructure to manage”</b>, the answer is almost always the serverless or fully managed option. For example: Glue rather than running your own Spark servers, Athena rather than your own query servers.</p>")}
<h2>Five words the exam uses a lot</h2>
${table(["Word","Meaning","Everyday example"],[
 ["High availability","The system keeps working even if one part fails, perhaps with a short blip","A hospital with a backup generator that starts within seconds of a power cut"],
 ["Fault tolerance","No interruption at all when a part fails","An aeroplane with two engines; it keeps flying if one stops"],
 ["Durability","Data you saved is not lost","S3 is designed so that, on average, you'd lose one file in 10,000 every 10 million years"],
 ["Scalability","Handling more load by adding resources. <b>Vertical</b> = make one machine bigger. <b>Horizontal</b> = add more machines","Vertical: swap a small bus for a bigger bus. Horizontal: run more buses on the route"],
 ["Elasticity","Scaling up <i>and back down</i> automatically as load changes","Extra cash counters open at a supermarket on weekends and close on weekdays"]])}
`,[
 {q:"A team wants to run SQL on files stored in S3 without setting up or managing any servers. Which type of service fits best?",o:["IaaS","Serverless","Running servers in their own office","A dedicated physical server"],a:[1],e:"A serverless service such as Athena runs the query for you. There are no servers to set up, and you pay per query."},
 {q:"Which statement about Amazon EC2 is correct?",o:["AWS installs operating system updates for you","It is IaaS: you manage the operating system and software on the virtual server","It is a serverless query service","It charges per TB of data scanned"],a:[1],e:"EC2 (Elastic Compute Cloud) gives you virtual servers. AWS looks after the hardware; you look after everything from the operating system up."},
 {q:"“Adding more machines to handle more load” is called:",o:["Vertical scaling","Horizontal scaling","Durability","Fault tolerance"],a:[1],e:"Horizontal scaling (also called scaling out) adds more machines. Vertical scaling makes one machine bigger."},
 {q:"A service keeps running with no interruption at all when a disk fails. This is:",o:["Fault tolerance","Elasticity","Durability","Vertical scaling"],a:[0],e:"Fault tolerance means no interruption at all. High availability allows a short blip; durability is about not losing saved data."}
]);

add("cloud","global-infra","Regions, Availability Zones and edge locations",`
${learn(["What an AWS Region is and how to choose one","What an Availability Zone (AZ) is and why “Multi-AZ” matters","Which AWS services are global and which belong to a Region","Why this matters for keeping data inside a country"])}
<p>AWS has data centres all over the world. They are organised in three levels: <b>Regions</b>, <b>Availability Zones</b> and <b>edge locations</b>.</p>
${simple("<p>Think of AWS as a hospital chain.</p><ul><li>A <b>Region</b> is a <b>city</b> where the chain operates, like Hyderabad or Mumbai.</li><li>An <b>Availability Zone</b> is one of several <b>separate hospital buildings</b> in different parts of that city. Each has its own power backup and water supply, so if one building has a problem, the others keep working.</li><li>An <b>edge location</b> is a small <b>clinic</b> close to where people live, for quick visits.</li></ul>")}
<h2>Region</h2>
<p>A <b>Region</b> is a separate geographic area. Each one has a code: for example <code>ap-south-1</code> is Mumbai and <code>ap-south-2</code> is Hyderabad. Regions are independent of each other.</p>
<p>Most AWS services are <b>regional</b>. When you create a bucket, a Glue job or a Redshift data warehouse, you create it in one Region and it lives there.</p>
<p>How to choose a Region, in order of importance:</p>
<ol>
<li><b>Law and compliance:</b> some laws say data must stay inside the country. This is called <b>data sovereignty</b>.</li>
<li><b>Latency</b> (delay): a Region close to your users or data sources is faster.</li>
<li><b>Available services:</b> new services and features don't reach every Region on day one.</li>
<li><b>Price:</b> the same service can cost a bit more or less in different Regions.</li>
</ol>
<h2>Availability Zone (AZ)</h2>
<p>Every Region has at least three <b>Availability Zones</b>. An AZ is one or more data centres with their own power, cooling and network, located kilometres apart from the other AZs but connected to them by very fast private cables.</p>
<p>If you run copies of something in two or more AZs, it keeps working if one AZ has a fire, flood or power failure. This is called <b>Multi-AZ</b>. For example, RDS (Relational Database Service) can keep a standby copy of your database in a second AZ and switch to it automatically.</p>
<h2>Edge locations</h2>
<p>Hundreds of small sites in many cities. Services such as CloudFront (which delivers website content), Route 53 (which runs DNS, the internet's phone book) and S3 Transfer Acceleration use them to get data to and from users faster.</p>
<h2>Which services belong where</h2>
${table(["Level","Examples","What it means for you"],[
 ["Global (one for the whole account)","IAM, Route 53, CloudFront, AWS Organizations","You don't pick a Region; the same users and roles work everywhere"],
 ["Regional","S3 buckets, Glue, Athena, Lambda, Kinesis, DynamoDB, Redshift Serverless","You pick a Region; the resource and its data stay there"],
 ["Inside one AZ","EC2 servers, subnets (network slices), EBS disks, the nodes of a provisioned Redshift cluster","For high availability you place copies in several AZs"]])}
${key("<p>Data stays in the Region where you store it. AWS never moves it to another Region by itself. It only leaves if <i>you</i> set that up, for example with S3 Cross-Region Replication (CRR). This is the basis of every data sovereignty question.</p>")}
${trap("<p>An S3 bucket <i>name</i> must be unique across the whole world, but the bucket itself and its data live in one Region. IAM is global, so you never choose a Region for IAM users or roles.</p>")}
`,[
 {q:"A company must keep all customer data inside India. What is the most important step?",o:["Use edge locations in India","Create resources only in Indian Regions and don't copy data to other Regions","Turn on Multi-AZ","Use IAM, because it is global"],a:[1],e:"Data stays in the Region you choose unless you copy it elsewhere. Multi-AZ improves availability within the same Region; it doesn't decide the country."},
 {q:"What protects an application if one data centre building loses power?",o:["Running it across multiple Availability Zones","Using a bigger server","Using edge locations","Using IAM roles"],a:[0],e:"Each AZ has separate power and network, so copies in two or more AZs survive the loss of one."},
 {q:"Which of these is a global service?",o:["Amazon S3 buckets","AWS Glue","AWS IAM","Amazon Athena"],a:[2],e:"IAM (Identity and Access Management) is global. Buckets, Glue jobs and Athena workgroups are created inside one Region."}
]);

add("cloud","shared-responsibility","The shared responsibility model",`
${learn(["What AWS protects and what you must protect","How this changes between EC2, RDS and serverless services"])}
<p>Security in AWS is a shared job. AWS protects the cloud itself; you protect what you put into it and how you configure it.</p>
${simple("<p>It's like renting a flat in a gated community. The <b>builder and society</b> look after the building structure, the lifts, the compound wall and the main gate guard. <b>You</b> decide who gets a copy of your flat key, whether you lock your door, and what you keep inside. If you leave your door open and something is stolen, that's on you, not the builder.</p>")}
${table(["AWS is responsible for (security <b>of</b> the cloud)","You are responsible for (security <b>in</b> the cloud)"],[
 ["The data centre buildings, guards and cameras","Your data and who can see it"],
 ["The servers, disks and network cables","IAM users, roles and their permissions"],
 ["The software that runs the virtual machines","Turning on encryption and managing keys"],
 ["Patching the engine of managed services (for example the RDS database software)","Network rules: security groups, NACLs (network firewalls) and private endpoints"],
 ["",'On EC2 only: updating the operating system and the software you install']])}
<p>How much is “yours” depends on the service model from the first lesson:</p>
<ul>
<li><b>EC2</b> (IaaS): you update the operating system and everything above it.</li>
<li><b>RDS</b> (managed): AWS updates the database software; you manage users, network access and encryption settings.</li>
<li><b>Glue, Athena, Lambda</b> (serverless): AWS runs everything underneath; you are responsible for permissions, encryption settings and the data itself.</li>
</ul>
${tip("<p>If a question asks what <i>the customer</i> must do, the answer is about data, access, encryption or network configuration. It's never about physical hardware or the data centre.</p>")}
`,[
 {q:"When using Amazon Athena, which task is the customer's responsibility?",o:["Updating the query engine servers","Physical security of the data centre","Controlling who can query which tables","Replacing failed disks"],a:[2],e:"Athena is serverless, so AWS runs the engine. You decide who can access which data and whether results are encrypted."},
 {q:"Who installs operating system updates on an EC2 server?",o:["AWS","The customer","Both equally","Nobody; they install themselves"],a:[1],e:"EC2 is IaaS. You own everything from the operating system upward, including updates."}

add("cloud","pricing","How AWS pricing works",`
${learn(["The four ways to pay for compute: On-Demand, Savings Plans, Reserved and Spot","How each data service is charged","Which data transfers are free and which cost money"])}
<p>Many exam questions ask for the “most cost-effective” answer, so you need to know how things are charged.</p>
<h2>Paying for servers (compute)</h2>
${table(["Option","How it works","Best for"],[
 ["On-Demand","Pay per second or hour, no commitment, stop any time","Short, unpredictable or brand-new workloads"],
 ["Savings Plans / Reserved Instances","Promise to use a certain amount for 1 or 3 years in exchange for a big discount (up to about 70%)","Systems that run all the time at a steady level"],
 ["Spot Instances","Use AWS's spare capacity at up to about 90% off. AWS can take the server back with a 2-minute warning","Work that can be interrupted and restarted, such as batch processing"]])}
${simple("<p><b>On-Demand</b> is buying a train ticket at the counter on the day. <b>Reserved / Savings Plans</b> is a yearly season pass: cheaper per trip, but you pay whether you travel or not. <b>Spot</b> is a very cheap waiting-list seat: great price, but you can be asked to get off if a full-fare passenger needs the seat.</p>")}
<h2>How data services charge</h2>
${table(["Charged by","Services","What lowers the bill"],[
 ["Amount of data scanned","Athena, Redshift Spectrum","Read less data: compress files, use columnar formats like Parquet, split data into partitions"],
 ["Running time × capacity","Glue (DPU-hours: one DPU = 4 vCPUs and 16 GB memory), EMR (server-hours), Redshift (node-hours, or RPU-hours for Serverless), Lambda (number of requests + memory × seconds)","Finish faster, use the right size, turn things off when idle"],
 ["Amount stored per month","S3 (price depends on storage class), Redshift managed storage","Move old data to cheaper storage classes"],
 ["Amount of streaming capacity or data","Kinesis (shard-hours or GB on-demand), Firehose (GB received)","Right-size capacity"]])}
<h2>Moving data (data transfer)</h2>
<p><b>Ingress</b> means data coming <i>into</i> AWS. <b>Egress</b> means data going <i>out</i>.</p>
<ul>
<li>Into AWS from the internet: <b>free</b>.</li>
<li>Out of AWS to the internet: <b>charged</b> per GB.</li>
<li>Between two Regions, and between two Availability Zones: <b>charged</b>.</li>
<li>Inside one AZ using private addresses, and to S3 or DynamoDB in the same Region: generally <b>free</b>.</li>
</ul>
${tip("<p>“Most cost-effective” answers usually involve one of: Spot for interruptible work, Glue Flex (cheaper Glue for jobs that aren't urgent), columnar formats plus partitions to scan less data, cheaper S3 storage classes with automatic lifecycle rules, or serverless options for workloads that sit idle a lot.</p>")}
${lab("<p>Create an <b>AWS Budget</b> of 10 US dollars with an email alert at 80%. Do this before any other lab so you're never surprised by a bill.</p>")}
`,[
 {q:"An EMR batch job can handle interruptions and must be as cheap as possible. Which option suits its extra worker servers?",o:["On-Demand","Spot Instances","Dedicated Hosts","3-year Reserved Instances"],a:[1],e:"Spot is the biggest discount and is fine for work that can be restarted if AWS takes a server back."},
 {q:"How does Amazon Athena mainly charge?",o:["Per hour the service is switched on","Per TB of data scanned by queries","Per number of tables","Per user"],a:[1],e:"Athena charges by data scanned, so compressing data, using Parquet and partitioning cut the cost directly."},
 {q:"Which data transfer is normally free?",o:["From the internet into AWS","From AWS out to the internet","Between two Regions","Between two Availability Zones"],a:[0],e:"Data coming in (ingress) is free. Data going out to the internet, or between Regions or AZs, costs money."}
]);

add("cloud","access-aws","Working with AWS: Console, CLI, SDK and ARNs",`
${learn(["What an API is","Four ways to control AWS","How to read an ARN, the address of an AWS resource"])}
<h2>Everything is an API call</h2>
<p>An <b>API</b> (Application Programming Interface) is a fixed set of requests one program can send to another. AWS exposes every action as an API, for example <code>CreateBucket</code> or <code>StartJobRun</code>. Whether you click a button or run a script, the same API call happens underneath, and AWS can log it (in CloudTrail, covered in Week 8).</p>
${simple("<p>An API is like a restaurant menu. You can only order what's on the menu, and you order by its exact name. The kitchen does the work and brings back the result.</p>")}
<h2>Four ways to control AWS</h2>
${table(["Tool","What it is","Typical use for a data engineer"],[
 ["Management Console","The website where you click through screens","Exploring, building a first version, watching jobs run"],
 ["CLI (Command Line Interface)","Typing commands in a terminal, e.g. <code>aws s3 ls</code>","Quick checks, uploads, simple scripts"],
 ["SDK (Software Development Kit)","A code library for calling AWS. <b>boto3</b> is the one for Python","Lambda functions, Glue Python code, automation"],
 ["Infrastructure as Code (IaC)","Files that describe your resources: CloudFormation, CDK (Cloud Development Kit), SAM (Serverless Application Model)","Creating the same setup in development, test and production"]])}
<h2>ARN: the full address of a resource</h2>
<p>Every AWS resource has an <b>ARN</b> (Amazon Resource Name). It is used in permission policies to say exactly which resource a rule is about.</p>
<pre><code>arn : aws : service : region      : account-id   : resource
arn : aws : glue    : ap-south-1  : 123456789012 : table/sales_db/orders</code></pre>
${table(["Part","Meaning","Example"],[
 ["arn","Always the same start","arn"],["partition","Normally aws","aws"],["service","Which AWS service","s3, glue, iam, kinesis"],
 ["region","Region code (left empty for global services and S3)","ap-south-1"],["account-id","The 12-digit AWS account number (left empty for S3)","123456789012"],
 ["resource","The specific thing","role/GlueJobRole, table/sales_db/orders"]])}
<pre><code>arn:aws:s3:::sales-data-lake              the bucket itself
arn:aws:s3:::sales-data-lake/raw/*        all files (objects) under raw/
arn:aws:iam::123456789012:role/GlueJobRole   an IAM role (global, so no Region)</code></pre>
${trap("<p>S3 ARNs have <b>no Region and no account number</b>. The <b>bucket</b> and the <b>files inside it</b> are two different resources: listing the bucket (<code>s3:ListBucket</code>) needs the bucket ARN <code>arn:aws:s3:::name</code>, while reading a file (<code>s3:GetObject</code>) needs <code>arn:aws:s3:::name/*</code>. Forgetting one of the two is a classic cause of “Access Denied”.</p>")}
${lab("<p>Install the AWS CLI, run <code>aws configure</code>, then run <code>aws sts get-caller-identity</code>. It shows which user or role you are using, with its ARN.</p>")}
`,[
 {q:"A policy allows s3:ListBucket on arn:aws:s3:::logs/* but listing the bucket fails. Why?",o:["ListBucket acts on the bucket, so it needs arn:aws:s3:::logs","S3 is a global service","The CLI is not installed","ListBucket needs a Region in the ARN"],a:[0],e:"Listing is an action on the bucket itself, so the resource must be the bucket ARN. Actions on files use bucket/*."},
 {q:"Which Python library is the AWS SDK?",o:["pandas","boto3","pyspark","requests"],a:[1],e:"boto3 is the AWS SDK (Software Development Kit) for Python. Lambda functions and Glue scripts use it a lot."}
]);

add("net","net-basics","Networking basics: IP addresses, ports and protocols",`
${learn(["What an IP address is, and private vs public addresses","How to read CIDR ranges like 10.0.0.0/16","What a port is and which ports you'll see","Inbound vs outbound traffic, and requests vs replies","What a firewall does"])}
<p>You need these ideas before VPCs, security groups and NACLs will make sense. Nothing here is AWS-specific.</p>
<h2>IP address: the address of a computer</h2>
<p>Every device on a network has an <b>IP address</b> (Internet Protocol address), such as <code>10.0.1.25</code>. Data is sent to an IP address the way a letter is sent to a postal address.</p>
<p>The common format (IPv4) is four numbers from 0 to 255 separated by dots.</p>
<ul>
<li>A <b>public IP address</b> can be reached from anywhere on the internet.</li>
<li>A <b>private IP address</b> works only inside a private network. Ranges starting with <code>10.</code>, <code>172.16.</code>–<code>172.31.</code> and <code>192.168.</code> are private.</li>
</ul>
${simple("<p>A private IP is like an <b>intercom extension number</b> inside an apartment complex: flat 302 can call extension 405, but nobody outside can dial that extension directly. A public IP is like a <b>mobile number</b>: anyone in the world can call it.</p>")}
<h2>CIDR: writing a range of addresses</h2>
<p><b>CIDR</b> (Classless Inter-Domain Routing) is a short way to write a block of IP addresses, like <code>10.0.0.0/16</code>. The number after the slash says how many of the leading bits are fixed. You don't need the binary maths for the exam, just this rule:</p>
${key("<p><b>Smaller number after the slash = bigger range.</b> Each step down doubles the size.</p>")}
${table(["CIDR","Number of addresses","Typical use"],[
 ["/16","65,536","A whole VPC"],["/20","4,096","A large subnet"],["/24","256","A normal subnet"],["/28","16","The smallest subnet AWS allows"],["/32","1","Exactly one IP address, e.g. your office's IP in a firewall rule"],["0.0.0.0/0","All addresses","“Anywhere”, which in practice means the whole internet"]])}
<p>In AWS, 5 addresses in every subnet are reserved, so a /24 subnet gives you 251 usable addresses.</p>
<h2>Port: which program on that computer</h2>
<p>One server can run several programs at once: a database, a web server, a login service. A <b>port</b> is a number (0 to 65535) that tells the computer <i>which program</i> the incoming data is for.</p>
${simple("<p>If the IP address is the <b>building address</b>, the port is the <b>flat number</b>. A courier needs both to deliver to the right person.</p>")}
${table(["Port","Used by"],[
 ["22","SSH (Secure Shell): logging in to a Linux server"],["80","HTTP: normal web traffic"],["443","HTTPS: encrypted web traffic and almost all AWS API calls"],
 ["3306","MySQL database"],["5432","PostgreSQL database"],["1433","Microsoft SQL Server"],["1521","Oracle database"],["5439","Amazon Redshift"],["9092 / 9094 / 9098","Apache Kafka (Amazon MSK)"],
 ["1024–65535","<b>Ephemeral ports</b>: temporary ports a computer picks to receive the reply to a request it sent"]])}
<h2>Protocol: the rules of the conversation</h2>
<ul>
<li><b>TCP</b> (Transmission Control Protocol): a reliable connection; data arrives complete and in order. Databases, HTTPS and SSH use it.</li>
<li><b>UDP</b> (User Datagram Protocol): faster but with no delivery check. Used by DNS lookups and video calls.</li>
<li><b>HTTPS</b>: web traffic encrypted with <b>TLS</b> (Transport Layer Security) so nobody in between can read it.</li>
<li><b>DNS</b> (Domain Name System): turns names like <code>s3.amazonaws.com</code> into IP addresses.</li>
</ul>
<h2>Inbound, outbound, requests and replies</h2>
<p><b>Inbound</b> (also called <b>ingress</b>) is traffic coming <i>into</i> a resource. <b>Outbound</b> (also called <b>egress</b>) is traffic going <i>out</i> of it.</p>
<p>Every conversation has two halves:</p>
<ol>
<li>A <b>request</b> goes out. Example: a Glue job at <code>10.0.2.15</code> connects to a PostgreSQL database at <code>10.0.3.20</code> on port <code>5432</code>. For the database, this is <i>inbound</i>.</li>
<li>A <b>reply</b> comes back. The database sends the rows back to <code>10.0.2.15</code> on an ephemeral port the Glue job chose, say <code>49152</code>. For the database, this reply is <i>outbound</i>.</li>
</ol>
<p>Keep this two-way picture in mind. It is exactly what “stateful” and “stateless” are about in the firewall lesson.</p>
<h2>Firewall: the security guard of a network</h2>
<p>A <b>firewall</b> checks every piece of traffic against a list of rules (which address it's from, which address and port it's going to, which protocol) and either lets it through or blocks it. In AWS the two firewalls are <b>security groups</b> and <b>NACLs</b> (Network Access Control Lists), covered in two lessons' time.</p>
`,[
 {q:"Which CIDR range contains the most IP addresses?",o:["10.0.0.0/24","10.0.0.0/16","10.0.0.0/28","10.0.0.5/32"],a:[1],e:"A smaller number after the slash means a bigger range. /16 is 65,536 addresses; /24 is 256; /28 is 16; /32 is one address."},
 {q:"An application needs to reach a PostgreSQL database. Which port must be open on the database side?",o:["22","443","5432","5439"],a:[2],e:"PostgreSQL listens on 5432. 5439 is Redshift, 443 is HTTPS, 22 is SSH."},
 {q:"In a firewall rule, what does 0.0.0.0/0 mean?",o:["No addresses","Only private addresses","Any IP address","Only AWS addresses"],a:[2],e:"0.0.0.0/0 matches every IP address. As a source in an inbound rule, it means anyone on the internet."},
 {q:"A database sends query results back to the application that asked for them. From the database's point of view, this reply is:",o:["Inbound traffic","Outbound traffic","Not traffic","DNS traffic"],a:[1],e:"The request came in (inbound). The reply leaves the database, so it is outbound from the database's point of view."}
]);

add("net","vpc-basics","VPC, subnets, gateways and routing",`
${learn(["What a VPC (Virtual Private Cloud) is","Public vs private subnets","What Internet Gateways and NAT Gateways do","How a VPC connects to your office network","Why data engineers care about all this"])}
<p>A <b>VPC</b> (Virtual Private Cloud) is your own private, isolated network inside one AWS Region. Nothing can get in or out unless you allow it.</p>
${simple("<p>Picture a <b>gated community</b>.</p><ul><li>The <b>VPC</b> is the whole community, with its compound wall.</li><li><b>Subnets</b> are the separate blocks or towers inside it.</li><li>The <b>route table</b> is the signboard at each block telling you which road leads where.</li><li>The <b>Internet Gateway</b> is the main gate to the public road.</li><li>A <b>NAT Gateway</b> is like the <b>delivery desk</b> at the gate: residents can send things out and receive replies, but strangers can't walk in.</li></ul>")}
<h2>The building blocks</h2>
${table(["Part","What it does"],[
 ["CIDR block","The VPC's range of private IP addresses, e.g. <code>10.0.0.0/16</code> (65,536 addresses)"],
 ["Subnet","A smaller slice of that range, e.g. <code>10.0.1.0/24</code>. Each subnet lives in exactly <b>one</b> Availability Zone"],
 ["Route table","Rules for where traffic leaving a subnet should go. Each subnet uses one route table"],
 ["Internet Gateway (IGW)","Connects the VPC to the public internet, in both directions"],
 ["NAT Gateway","NAT = Network Address Translation. Lets resources in a <b>private</b> subnet start connections <i>out</i> to the internet and get replies, but nobody on the internet can start a connection <i>in</i>. It sits in a public subnet"],
 ["ENI (Elastic Network Interface)","A virtual network card with a private IP. Every server, Glue worker or Lambda placed in the VPC gets one"]])}
<h2>Public subnet vs private subnet</h2>
<p>The only difference is the <b>route table</b>:</p>
<ul>
<li><b>Public subnet:</b> its route table sends internet traffic (<code>0.0.0.0/0</code>) to the <b>Internet Gateway</b>. Things here can have public IPs and be reached from the internet if firewalls allow.</li>
<li><b>Private subnet:</b> no route to the Internet Gateway. Things here can't be reached from the internet at all. If they need to go <i>out</i> (for example to download a library), their route table sends <code>0.0.0.0/0</code> to a <b>NAT Gateway</b>.</li>
</ul>
<pre><code>Region ap-south-1
└─ VPC 10.0.0.0/16  ── Internet Gateway ── internet
   ├─ AZ a
   │   ├─ Public subnet  10.0.1.0/24   (NAT Gateway lives here)
   │   └─ Private subnet 10.0.2.0/24   (databases, Glue connections, EMR)
   └─ AZ b
       ├─ Public subnet  10.0.3.0/24
       └─ Private subnet 10.0.4.0/24   (standby database copy)</code></pre>
${key("<p>Databases, EMR clusters, Redshift and Glue connections normally live in <b>private subnets</b>. Only things that must face the internet go in public subnets.</p>")}
<h2>Connecting the VPC to other networks</h2>
${table(["Option","What it is","Choose it when"],[
 ["VPC peering","A private link between two VPCs","Two VPCs need to talk privately"],
 ["Transit Gateway","A central hub that connects many VPCs and office networks","You have lots of VPCs and want one hub"],
 ["Site-to-Site VPN","VPN = Virtual Private Network: an encrypted tunnel over the normal internet between your office and the VPC","Quick, cheap private connection; speed can vary"],
 ["Direct Connect","A dedicated private cable from your data centre to AWS","Large, steady data transfers that need reliable speed"]])}
<h2>Why data engineers care</h2>
<ul>
<li>A Glue job reading a database in a private subnet needs a <b>Glue connection</b> placed in that VPC, with the right subnet and firewall rules.</li>
<li>Something in a private subnet that must call the internet needs a <b>NAT Gateway</b>.</li>
<li>Something in a private subnet that must reach S3 privately and cheaply needs a <b>VPC endpoint</b> (covered two lessons from now).</li>
<li>Copying large amounts of data from an office data centre every day often points to <b>Direct Connect</b>.</li>
</ul>
`,[
 {q:"An RDS database must not be reachable from the internet. Where should it go?",o:["A public subnet","A private subnet","An edge location","Inside the NAT Gateway"],a:[1],e:"A private subnet has no route to the Internet Gateway, so nothing on the internet can reach the database."},
 {q:"A Lambda function in a private subnet must call a public third-party API. What does it need?",o:["A route from its subnet to a NAT Gateway in a public subnet","A gateway endpoint for S3","VPC peering","Nothing; private subnets reach the internet automatically"],a:[0],e:"A NAT Gateway lets private resources start outbound connections to the internet and receive replies."},
 {q:"How many Availability Zones does one subnet span?",o:["Exactly one","Two","All AZs in the Region","None; subnets are global"],a:[0],e:"A subnet always sits in a single AZ. For high availability, create subnets in several AZs."},
 {q:"What makes a subnet “public”?",o:["Its name","Its route table sends 0.0.0.0/0 to an Internet Gateway","It has a NAT Gateway in it","It uses a /16 range"],a:[1],e:"A subnet is public only because its route table points internet traffic at the Internet Gateway."}
]);

add("net","firewalls","Security groups, NACLs, stateful and stateless",`
${learn(["What “stateful” and “stateless” mean, with an example","Security groups: the firewall on each resource","NACLs (Network Access Control Lists): the firewall on each subnet","How the two work together","Why Glue needs a “self-referencing” rule"])}
<p>AWS gives you two firewalls inside a VPC. To understand the difference, first learn two words: <b>stateful</b> and <b>stateless</b>.</p>
<h2>Stateful vs stateless</h2>
<p>Remember from the networking lesson: every conversation has a <b>request</b> going one way and a <b>reply</b> coming back the other way.</p>
${simple("<p>Imagine two kinds of security guard at a gate.</p><p><b>The stateful guard keeps a register.</b> When resident Ravi goes out to fetch something, the guard writes it down. When Ravi comes back, the guard checks the register, sees he went out, and lets him back in. He doesn't need a separate rule for people coming back.</p><p><b>The stateless guard has no register and no memory.</b> He checks everyone against his rule list every single time, in each direction. If the list says “people may go out” but doesn't say “people may come back in”, Ravi gets stuck outside, even though he just left.</p>")}
<p>In network terms:</p>
<ul>
<li>A <b>stateful</b> firewall remembers each connection it allowed. If the request was allowed, the reply is <b>automatically allowed</b> back, whatever the rules say.</li>
<li>A <b>stateless</b> firewall remembers nothing. The reply is checked as completely new traffic, so you need a rule allowing the reply as well. Replies come back on <b>ephemeral ports</b> (1024–65535), so a stateless firewall usually needs a rule allowing that range.</li>
</ul>
${key("<p><b>Security groups are stateful. NACLs are stateless.</b> This one fact answers many exam questions.</p>")}
<h2>Security group: a guard at each door</h2>
<p>A <b>security group</b> is a virtual firewall attached to one resource, more exactly to its network card (ENI). Servers, databases, Redshift clusters, Lambda functions in a VPC and Glue connections all have one or more security groups.</p>
<ul>
<li>It has <b>allow rules only</b>. Anything not allowed is blocked. You can't write a “deny” rule.</li>
<li>It has separate <b>inbound</b> rules and <b>outbound</b> rules.</li>
<li>It is <b>stateful</b>: replies to allowed traffic are let through automatically.</li>
<li>A new security group <b>blocks all inbound</b> traffic and <b>allows all outbound</b> traffic until you change it.</li>
<li>All rules are checked together; the order doesn't matter.</li>
</ul>
<p>Each rule names a protocol, a port and a <b>source</b> (for inbound) or <b>destination</b> (for outbound). The source can be an IP range or <b>another security group</b>.</p>
<p>Example: inbound rules on a PostgreSQL database's security group.</p>
${table(["Type","Protocol","Port","Source","Meaning"],[
 ["PostgreSQL","TCP","5432","sg-glue (the Glue connection's security group)","Anything wearing the Glue security group may connect"],
 ["PostgreSQL","TCP","5432","203.0.113.10/32","One office computer may connect"]])}
${simple("<p>Using another security group as the source is like a rule at the door that says “let in <b>anyone wearing a blue company badge</b>”, instead of listing every person's name. If new Glue workers start up with that badge, they get in automatically.</p>")}
<h2>NACL: a guard at the gate of each block</h2>
<p>A <b>NACL</b> (Network Access Control List) is a firewall for a whole <b>subnet</b>. Every resource in that subnet is behind it.</p>
<ul>
<li>It has <b>allow and deny</b> rules, so you can block a specific IP address.</li>
<li>Rules are <b>numbered</b> (for example 100, 110, 120) and checked from the lowest number up. The <b>first rule that matches wins</b> and the rest are ignored.</li>
<li>It is <b>stateless</b>: you need inbound rules for requests coming in <i>and</i> outbound rules for replies going back (usually ports 1024–65535), and the same in the other direction.</li>
<li>The <b>default NACL</b> that comes with every VPC allows all traffic. A <b>new custom NACL denies everything</b> until you add rules.</li>
</ul>
<h2>Side by side</h2>
${table(["","Security group","NACL (Network Access Control List)"],[
 ["Protects","One resource (its network card)","A whole subnet"],
 ["Rule types","Allow only","Allow and deny"],
 ["Remembers connections?","Yes: <b>stateful</b>. Replies are allowed automatically","No: <b>stateless</b>. Replies need their own rule"],
 ["Rule order","All rules checked together","Numbered; lowest number first; first match wins"],
 ["Source can be another security group?","Yes","No, only IP ranges"],
 ["Default behaviour","New group: no inbound allowed, all outbound allowed","Default NACL: everything allowed. New custom NACL: everything denied"]])}
<h2>How they work together</h2>
<p>Traffic coming into a database in a private subnet passes <b>two guards</b>: first the subnet's NACL (the block gate), then the database's security group (the flat door). <b>Both must allow it.</b> Most teams leave NACLs open and do almost all filtering with security groups. NACLs are used for broad blocks, such as denying a known bad IP range.</p>
<h2>The Glue “self-referencing” rule</h2>
<p>When a Glue job connects to a database inside a VPC, Glue starts several workers. Each gets its own network card in your subnet, and they all use the security group you chose for the Glue connection. The workers need to talk <b>to each other</b> as well as to the database.</p>
<p>So that security group needs an inbound rule whose source is <b>the same security group</b>: “allow all TCP traffic from members of this group”. This is called a <b>self-referencing rule</b>. Without it the job fails with a network or timeout error.</p>
${tip("<p>“Block traffic from one specific IP address” → <b>NACL deny rule</b> (security groups can't deny).<br>“The request is allowed in but the reply never gets back” → a <b>NACL</b> is missing the outbound rule for ephemeral ports 1024–65535.<br>“Glue can't connect to a database in a VPC” → check the <b>self-referencing rule</b>, the subnet, and the route to S3.</p>")}
`,[
 {q:"What does “stateful” mean for a security group?",o:["It saves your data","It remembers allowed connections and lets their replies back automatically","It checks rules in number order","It can deny specific IPs"],a:[1],e:"A stateful firewall remembers the connection, so the reply to an allowed request is allowed without any extra rule."},
 {q:"A Glue job using a JDBC connection to an RDS database fails with a network timeout. The security group only allows the database port from the Glue subnet's IP range. What is missing?",o:["A NAT Gateway","An inbound rule allowing all TCP from the same security group (self-referencing)","An Internet Gateway","A Direct Connect link"],a:[1],e:"Glue workers must talk to each other, so their security group needs a rule allowing all TCP traffic from itself."},
 {q:"You must block traffic from one malicious IP address to a whole subnet. What do you use?",o:["A security group deny rule","A NACL deny rule","An IAM policy","A route table"],a:[1],e:"Only NACLs support deny rules. Security groups can only allow."},
 {q:"A custom NACL allows inbound port 443 from anywhere but has no outbound rules. Users' HTTPS requests reach the server but never get a response. Why?",o:["NACLs are stateless, so the replies on ports 1024–65535 need an outbound allow rule","Security groups block all replies","Port 443 is wrong for HTTPS","The subnet is private"],a:[0],e:"NACLs don't remember connections. The reply going back out must be allowed separately, usually on ephemeral ports 1024–65535."},
 {q:"Which statements about security groups are true? (Choose TWO)",o:["They are stateful","They support deny rules","They can use another security group as the source","They apply to an entire subnet","Rules are checked in number order"],a:[0,2],e:"Security groups are stateful and can reference other security groups. Deny rules, subnet scope and numbered rules describe NACLs."}
]);

add("net","vpc-endpoints","VPC endpoints: reaching AWS services privately",`
${learn(["Why private resources need a special path to S3 and other services","Gateway endpoints vs interface endpoints (PrivateLink)","How to lock a bucket to your endpoint"])}
<h2>The problem</h2>
<p>AWS services like S3, Kinesis and Secrets Manager are reached through public addresses on the AWS network. A Glue job or EMR cluster in a <b>private subnet</b> has no internet route, so by default it can't reach them. One fix is a NAT Gateway, but that sends the traffic out the internet path, and NAT Gateways charge for every GB that passes through them.</p>
<h2>The fix: a VPC endpoint</h2>
<p>A <b>VPC endpoint</b> is a private door from your VPC straight to an AWS service. Traffic stays on the AWS network, never touches the internet, and no NAT or Internet Gateway is needed.</p>
${simple("<p>Instead of leaving the gated community by the main gate and taking the public road to the bank, the bank has opened a <b>private branch counter inside your community</b>. Faster, safer, and you don't pay the road toll.</p>")}
<h2>Two kinds</h2>
${table(["","Gateway endpoint","Interface endpoint (powered by PrivateLink)"],[
 ["Which services","<b>Only S3 and DynamoDB</b>","Most other services: Glue, Kinesis, Secrets Manager, STS, Athena, KMS, SQS, SNS and many more (S3 is also available this way)"],
 ["How it works","Adds an entry to the subnet's route table pointing at the service","Creates a network card (ENI) with a private IP address in your subnet"],
 ["Cost","<b>Free</b>","Charged per hour and per GB"],
 ["Reachable from your office over VPN/Direct Connect?","No","Yes"]])}
<h2>Controlling access through endpoints</h2>
<ul>
<li>An <b>endpoint policy</b> limits what can be done through the endpoint, e.g. only certain buckets.</li>
<li>A <b>bucket policy</b> can say “deny any request that didn't come through endpoint vpce-123”, using the condition key <code>aws:SourceVpce</code>. Then the bucket can only be used from inside your VPC.</li>
</ul>
${tip("<p>“Access S3 (or DynamoDB) from a private subnet <b>without going over the internet</b> at the <b>lowest cost</b>” → <b>gateway endpoint</b>.<br>“Private access to Kinesis, Secrets Manager or Glue APIs” → <b>interface endpoint</b>.</p>")}
`,[
 {q:"What is the cheapest way for an EMR cluster in a private subnet to read S3 without going over the internet?",o:["NAT Gateway","Interface endpoint for S3","Gateway endpoint for S3","VPN"],a:[2],e:"S3 gateway endpoints are free and keep traffic private. NAT Gateways charge per GB."},
 {q:"A Lambda function in a private subnet must read a secret from Secrets Manager without internet access. What do you add?",o:["A gateway endpoint for Secrets Manager","An interface endpoint for Secrets Manager","An Internet Gateway","A NACL deny rule"],a:[1],e:"Gateway endpoints exist only for S3 and DynamoDB. Other services use interface endpoints (PrivateLink)."},
 {q:"How can you make sure a bucket is only used from your VPC?",o:["Turn on versioning","Bucket policy that denies requests not coming from your endpoint (aws:SourceVpce)","Use a bigger subnet","Make the bucket public"],a:[1],e:"The aws:SourceVpce condition lets a bucket policy reject requests that didn't come through your VPC endpoint."}
]);

/* ===================== WEEK 1: IAM ===================== */
add("iam","iam-identities","IAM identities: root user, users, groups and roles",`
${learn(["Authentication vs authorisation","The root user and why you protect it","IAM users, groups and roles, and when to use each","How AWS services get permissions through roles"])}
<p><b>IAM</b> (Identity and Access Management) controls <b>who</b> can do <b>what</b> on <b>which</b> AWS resources. It is free, global, and appears in every exam domain.</p>
<h2>Two questions IAM answers</h2>
<ul>
<li><b>Authentication:</b> <i>Who are you?</i> Proved with a password, an access key or a sign-in through your company.</li>
<li><b>Authorisation:</b> <i>What are you allowed to do?</i> Decided by permission policies (next lesson).</li>
</ul>
${simple("<p>In an office building, swiping your <b>ID card</b> at the entrance proves who you are (authentication). Whether that card opens the <b>server room on the 5th floor</b> is a separate question (authorisation).</p>")}
<p>The person or thing making a request is called the <b>principal</b>: a user, a role, an AWS service, or another AWS account.</p>
<h2>The four kinds of identity</h2>
${table(["Identity","What it is","How it signs in","Use it for"],[
 ["Root user","The account owner, created with the account. Can do everything, and can't be restricted by IAM policies","Email address + password","Only a handful of account-level tasks. Turn on MFA and put it away"],
 ["IAM user","One person or one application inside the account","A password for the console and/or <b>access keys</b> for the CLI and SDK. These never expire on their own","People, only when company single sign-on isn't available"],
 ["IAM group","A collection of IAM users","Groups don't sign in","Giving the same permissions to a whole team at once"],
 ["IAM role","A set of permissions that a trusted person, service or account can <b>temporarily take on</b> (“assume”)","<b>Temporary</b> credentials from STS that expire automatically","AWS services, access from other accounts, company single sign-on"]])}
<p><b>Access keys</b> are a pair: an access key ID (like a username) and a secret access key (like a password). <b>MFA</b> (Multi-Factor Authentication) adds a second proof, such as a 6-digit code from an app on your phone.</p>
<h2>Roles: the preferred way to give access</h2>
<p>A role has no password and no permanent keys. When someone or something “assumes” the role, <b>STS</b> (Security Token Service) hands out credentials that expire after a while (from 15 minutes up to 12 hours).</p>
${simple("<p>A role is like a <b>visitor badge</b> at the reception desk. The badge itself decides which floors open. Anyone on the approved list can collect it, wear it for a while, and hand it back. Nobody takes a permanent key home.</p>")}
<p>Every AWS data service works through a role:</p>
<ul>
<li>A <b>Glue job</b> runs with a Glue service role that can read the source bucket and write the target bucket.</li>
<li>A <b>Lambda function</b> has an execution role.</li>
<li>A <b>Redshift</b> cluster uses a role to load files from S3 (<code>COPY</code>) and query S3 directly.</li>
<li><b>Firehose, Step Functions, DMS (Database Migration Service) and EMR</b> each use their own roles.</li>
</ul>
${key("<p>Never put access keys inside code or a Glue script. Give the service a <b>role</b>. For employees, use <b>IAM Identity Center</b> (AWS's SSO, single sign-on): people log in with their company account and receive temporary role credentials, so no IAM users are needed.</p>")}
${trap("<p>Groups can't contain other groups, and a group can't be named as the principal in a policy. Nobody can “sign in as a group”.</p>")}
${lab("<p>Turn on MFA for your root user. Create an IAM Identity Center user (or an admin IAM user) for daily work, sign in with it, and stop using root.</p>")}
`,[
 {q:"A Glue job needs to read files from S3. What is the recommended way to give it access?",o:["Put an IAM user's access keys in the script","Attach an IAM role with S3 permissions to the job","Use the root user's keys","Make the bucket public"],a:[1],e:"Services should always use roles. The role gives temporary credentials and nothing secret is stored in code."},
 {q:"Which identity receives temporary credentials from AWS STS?",o:["IAM group","IAM role","Root user","Every IAM user"],a:[1],e:"Assuming a role returns temporary credentials from STS (Security Token Service)."},
 {q:"What should you do with the root user?",o:["Use it for daily admin work","Share it with the team","Turn on MFA and use it only for the few tasks that require it","Delete it"],a:[2],e:"The root user can do everything. Protect it with MFA and use other identities for daily work."},
 {q:"“Proving who you are” is called:",o:["Authorisation","Authentication","Encryption","Replication"],a:[1],e:"Authentication proves identity. Authorisation decides what that identity may do."}
]);

add("iam","iam-policies","IAM policies: how permissions are written",`
${learn(["What a policy is and how to read one line by line","The six types of policy and where each is attached","Useful condition keys"])}
<p>A <b>policy</b> is a document that lists what is allowed or denied. It's written in <b>JSON</b> (JavaScript Object Notation), a text format of names and values inside curly braces. Exam questions often show a policy and ask what it allows, so practise reading them.</p>
<h2>A policy, line by line</h2>
<pre><code>{
  "Version": "2012-10-17",
  "Statement": [
    {
      "Sid": "ReadRawZone",
      "Effect": "Allow",
      "Action": ["s3:GetObject"],
      "Resource": "arn:aws:s3:::sales-data-lake/raw/*"
    },
    {
      "Sid": "ListRawFolderOnly",
      "Effect": "Allow",
      "Action": "s3:ListBucket",
      "Resource": "arn:aws:s3:::sales-data-lake",
      "Condition": {"StringLike": {"s3:prefix": ["raw/*"]}}
    }
  ]
}</code></pre>
<p>In plain English: “You may read any file under <code>raw/</code> in the sales-data-lake bucket, and you may list the bucket, but only the contents of the <code>raw/</code> folder.”</p>
${table(["Part","Meaning"],[
 ["Version","Always <code>2012-10-17</code>, the current policy language version. It isn't a date you change"],
 ["Statement","A list of rules. A policy can have many"],
 ["Sid","An optional name for the rule, for your own reference"],
 ["Effect","<code>Allow</code> or <code>Deny</code>"],
 ["Action","Which API operations, written <code>service:Action</code>, e.g. <code>s3:GetObject</code>, <code>glue:StartJobRun</code>. A <code>*</code> means “anything”, so <code>s3:Get*</code> means every S3 action starting with Get"],
 ["Resource","Which resources, as ARNs"],
