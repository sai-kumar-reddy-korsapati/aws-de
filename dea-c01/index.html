 ["Condition","Optional extra checks, e.g. only from a certain IP, only over HTTPS, only for resources with a certain tag"],
 ["Principal","<b>Who</b> the rule is for. Appears <b>only</b> in policies attached to resources (see below)"]])}
<h2>The six types of policy</h2>
${table(["Type","Attached to","What it does"],[
 ["Identity-based policy","A user, group or role","Says what <i>that identity</i> may do. Can be <b>AWS managed</b> (ready-made by AWS), <b>customer managed</b> (written by you, reusable) or <b>inline</b> (embedded in one identity only)"],
 ["Resource-based policy","A resource: S3 bucket policy, KMS key policy, SQS queue policy, Lambda function policy, Glue Data Catalog policy","Says <i>who</i> may use this resource. Has a <code>Principal</code>, so it can let <b>other AWS accounts</b> in"],
 ["Trust policy","A role","A special resource-based policy listing who is allowed to assume the role"],
 ["Permissions boundary","A user or role","Sets the <b>maximum</b> that identity can ever do. It gives nothing by itself"],
 ["SCP (Service Control Policy)","An AWS account or an OU (Organizational Unit, a folder of accounts) in AWS Organizations","Sets the maximum for <b>everyone</b> in those accounts, even admins. Gives nothing by itself"],
 ["Session policy","One assumed-role session","Narrows a single session further"]])}
${simple("<p>A <b>permissions boundary</b> or an <b>SCP</b> is like the <b>credit limit on a card</b>. The limit doesn't put money in your account; it only caps what you can spend. You still need an actual Allow (the money) from an identity or resource policy.</p>")}
<h2>Useful condition keys</h2>
${table(["Condition key","Use it to"],[
 ["<code>aws:SourceIp</code>","Allow only from certain IP addresses, e.g. the office"],
 ["<code>aws:SourceVpce</code>","Allow only through a certain VPC endpoint"],
 ["<code>aws:SecureTransport</code>","Allow only encrypted (HTTPS) requests"],
 ["<code>aws:PrincipalTag/…</code> and <code>aws:ResourceTag/…</code>","Compare tags on the person and the resource (used for ABAC, two lessons from now)"],
 ["<code>aws:RequestedRegion</code>","Allow actions only in certain Regions"],
 ["<code>s3:x-amz-server-side-encryption</code>","Require uploads to be encrypted"],
 ["<code>aws:MultiFactorAuthPresent</code>","Require MFA for sensitive actions"]])}
`,[
 {q:"Which policy element appears only in resource-based policies?",o:["Effect","Action","Principal","Resource"],a:[2],e:"Resource-based policies name a Principal (who gets access). Identity-based policies don't need one, because the identity they're attached to is the principal."},
 {q:"A permissions boundary on a role allows only S3 actions. The role's own policy allows S3 and Glue actions. What can the role do?",o:["S3 and Glue","Only S3","Only Glue","Nothing"],a:[1],e:"The role can only do what both allow: the overlap of the boundary and its policy, which is S3."},
 {q:"How do you make a bucket reject any request that doesn't use HTTPS?",o:["A bucket policy that denies requests where aws:SecureTransport is false","Turn on versioning","Use an S3 gateway endpoint","Use an IAM group"],a:[0],e:"A Deny with the condition aws:SecureTransport = false blocks unencrypted requests."},
 {q:"What does the Action \"s3:Get*\" match?",o:["Only s3:GetObject","Every S3 action whose name starts with Get","All S3 actions","All actions in every service"],a:[1],e:"The * is a wildcard matching the rest of the name, so every S3 action beginning with Get."}
]);

add("iam","iam-evaluation","How AWS decides: allow or deny",`
${learn(["The four rules AWS follows for every request","Implicit deny vs explicit deny","Why cross-account access needs permission on both sides"])}
<p>When a request arrives, AWS gathers every policy that applies to it and follows four rules, in this order.</p>
<ol>
<li><b>Start with “no”.</b> Everything is denied by default. This is an <b>implicit deny</b>: nobody wrote “deny”, there's just no Allow.</li>
<li><b>An explicit Deny always wins.</b> If any applicable policy says <code>"Effect": "Deny"</code> for this request, it's refused. No Allow anywhere can override it.</li>
<li><b>The limits must permit it.</b> SCPs, permissions boundaries and session policies must all allow the action. They only limit; they never grant.</li>
<li><b>Something must say Allow.</b> An identity-based or resource-based policy must allow the action. If nothing does, the implicit deny from step 1 stands.</li>
</ol>
${simple("<p>Think of entry to a members' club.</p><ul><li>By default, nobody gets in.</li><li>If your name is on the <b>banned list</b> (explicit deny), you're turned away, even holding an invitation.</li><li>The club's <b>house rules</b> (SCP / boundary) must not forbid it, e.g. “no entry after midnight”.</li><li>You still need an <b>invitation</b> (an Allow) to get in.</li></ul>")}
${table(["Situation","Result"],[
 ["No policy mentions the action","Denied (implicit deny)"],
 ["The role's policy allows it and nothing denies it","Allowed"],
 ["The role's policy allows it, but the bucket policy explicitly denies it","Denied (explicit deny wins)"],
 ["The role's policy allows it, but the account's SCP doesn't allow that action","Denied"],
 ["Same account: only the bucket policy allows the role (the role's own policy says nothing)","Allowed: within one account, an Allow on either side is enough"],
 ["Different accounts: account A's bucket policy allows account B, but B's role has no S3 permission in its own policy","Denied: across accounts, <b>both</b> sides must allow"]])}
${key("<p><b>Same account:</b> an Allow in the identity policy <i>or</i> in the resource policy is enough.<br><b>Different accounts:</b> the resource's policy must let the other account in <i>and</i> the caller's own identity policy must allow the action.</p>")}
${trap("<p><b>KMS</b> (Key Management Service) encryption keys are stricter. The <b>key policy</b> must allow the account or principal before any IAM policy can grant use of the key, even inside the same account. You'll study this in Week 8.</p>")}
${lab("<p>Create a role whose policy allows <code>s3:*</code> on a test bucket. Add a second statement that denies <code>s3:DeleteObject</code>. In the <b>IAM Policy Simulator</b>, test GetObject (allowed) and DeleteObject (denied).</p>")}
`,[
 {q:"A role's policy allows s3:* on a bucket. The bucket policy has an explicit Deny for s3:DeleteObject for that role. What happens when the role deletes a file?",o:["Allowed, because the role's policy wins","Denied, because an explicit Deny always wins","Allowed only with MFA","It depends on the Region"],a:[1],e:"An explicit Deny in any policy that applies overrides every Allow."},
 {q:"Account A's bucket policy allows account B to read objects. A role in account B has no S3 permissions in its own policy. Can it read the objects?",o:["Yes","No: across accounts, both the bucket policy and B's own IAM policy must allow it","Only through the console","Only if the bucket is public"],a:[1],e:"For cross-account access, the resource policy and the caller's identity policy must both allow the action."},
 {q:"No policy mentions glue:DeleteTable for a user. What happens when they try it?",o:["Allowed by default","Denied by implicit deny","Denied by explicit deny","Allowed if they are in a group"],a:[1],e:"Everything is denied unless something allows it. With no policy mentioning the action, it's an implicit deny."}
]);

add("iam","iam-cross-account","Assuming roles, other accounts and PassRole",`
${learn(["Why companies use many AWS accounts","How assuming a role works, step by step","Two ways to share across accounts","What iam:PassRole is and why it exists"])}
<h2>Why more than one account?</h2>
<p>An <b>AWS account</b> is a separate container with its own resources, users and bill. Companies usually have many: one each for development, testing and production, a central data lake account, a security logging account, and so on. So “let account B use data in account A” is a very common need.</p>
<h2>How assuming a role works</h2>
<ol>
<li>The role has a <b>trust policy</b>: the list of who may assume it (an AWS service, a user, or a whole other account).</li>
<li>The caller asks STS to assume the role (<code>sts:AssumeRole</code>). AWS services like Glue do this automatically in the background.</li>
<li>STS checks the trust policy and returns <b>temporary credentials</b>.</li>
<li>The caller uses those credentials and can do whatever the role's <b>permissions policy</b> allows, until they expire.</li>
</ol>
<pre><code>Trust policy on GlueJobRole: “the Glue service may assume me”
{
  "Version": "2012-10-17",
  "Statement": [{
    "Effect": "Allow",
    "Principal": {"Service": "glue.amazonaws.com"},
    "Action": "sts:AssumeRole"
  }]
}</code></pre>
${key("<p>Every role has <b>two</b> policies: the <b>trust policy</b> (who can assume it) and the <b>permissions policy</b> (what it can do once assumed). If a service can't use a role, check the trust policy's <code>Principal</code> first.</p>")}
<h2>Two ways to share across accounts</h2>
${table(["Method","How it works","Good for"],[
 ["A role in the account that owns the data","Account A creates a role that trusts account B. People in B assume it and act inside A","Broad access to many resources in A, managed in one place"],
 ["A resource-based policy","The bucket, key or queue policy in A names account B directly. B's people keep using their own identity","Sharing one specific resource"]])}
<p>For data-lake tables there's a third option, <b>Lake Formation</b> sharing through RAM (Resource Access Manager), covered in Week 8.</p>
<h2>iam:PassRole</h2>
<p>When you create a Glue job, Lambda function or Step Functions workflow, you choose a role for it to run as. To do that, you need the permission <code>iam:PassRole</code> on that role.</p>
${simple("<p>Without this rule, a junior employee who can create Glue jobs could attach the company's most powerful admin role to their job and then do anything through it. PassRole is like saying: <b>you can only hand out keys you've been allowed to hand out.</b></p>")}
${tip("<p>Error “User is not authorized to perform: <code>iam:PassRole</code>” while creating a Glue job or Lambda function → give that user <code>iam:PassRole</code> on that <b>specific role's ARN</b>, not on <code>*</code>.</p>")}
`,[
 {q:"A developer gets AccessDenied for iam:PassRole when creating a Lambda function with an execution role. What is the least-privilege fix?",o:["Give the developer AdministratorAccess","Allow iam:PassRole on that execution role's ARN only","Remove the execution role","Use the root user"],a:[1],e:"PassRole limited to that one role ARN is the smallest permission that fixes the problem."},
 {q:"Which policy on a role decides who can assume it?",o:["Permissions policy","Trust policy","SCP","Session policy"],a:[1],e:"The trust policy names the principals allowed to call sts:AssumeRole on the role."},
 {q:"Analysts in account B need read access to many buckets and Glue tables in account A. Which approach is simplest to manage?",o:["Copy the data to account B every night","A role in account A that trusts account B, with the needed read permissions","An IAM user in account A for every analyst","Make the buckets public"],a:[1],e:"One cross-account role gives a single place to manage access to many resources, using temporary credentials."}
]);

add("iam","iam-least-privilege","Least privilege, RBAC and ABAC",`
${learn(["What least privilege means in practice","RBAC vs ABAC, and when ABAC is the better answer","IAM Access Analyzer"])}
<h2>Least privilege</h2>
<p>Give only the permissions needed, on only the resources needed, for only as long as needed. In practice:</p>
<ul>
<li>Name exact actions instead of <code>s3:*</code> or <code>*</code>.</li>
<li>Name exact ARNs and folders (prefixes) instead of <code>"Resource": "*"</code>.</li>
<li>Add conditions: a specific VPC endpoint, IP address, tag or encryption requirement.</li>
<li>Use roles with temporary credentials, and delete unused users and access keys.</li>
<li>Use <b>IAM Access Analyzer</b>: it flags resources shared with outside accounts, and can generate a tight policy from what a role actually did (from CloudTrail logs).</li>
</ul>
${simple("<p>A hotel gives a guest a key card that opens <b>their own room and the gym</b>, and only during their stay. It doesn't hand out the master key in case they might need it one day.</p>")}
<h2>RBAC vs ABAC</h2>
<p>A <b>tag</b> is a label you attach to a resource or identity as a key and a value, for example <code>project = sales</code> or <code>env = prod</code>.</p>
${table(["","RBAC (Role-Based Access Control)","ABAC (Attribute-Based Access Control)"],[
 ["Idea","Permissions belong to a job role, e.g. <i>DataAnalyst</i>","Permissions depend on <b>tags</b> on the person and on the resource"],
 ["Example","The Analyst role may read the curated bucket","Allow access when the resource's tag <code>project</code> equals the person's tag <code>project</code>"],
 ["When a new project starts","Write or change policies","Just tag the new people and resources; no policy change"],
 ["Exam signal","A few stable teams","“Many teams or projects, minimise policy changes, scale”"]])}
<pre><code>ABAC: allow access only to resources tagged with your own project
"Condition": {
  "StringEquals": {"aws:ResourceTag/project": "\${aws:PrincipalTag/project}"}
}</code></pre>
${tip("<p>For data-lake tables, the same tag idea is used by <b>Lake Formation LF-Tags</b> (Week 8). When a question says “grant access to thousands of tables based on how sensitive they are”, think tags.</p>")}
${trap("<p>In questions about least privilege, answers offering <code>AdministratorAccess</code>, <code>s3:*</code> on <code>*</code>, sharing access keys, or making a bucket public are almost always wrong.</p>")}
`,[
 {q:"A company has 200 project teams and wants to avoid writing a new policy for each one. What should it use?",o:["One IAM user per team","Attribute-based access control (ABAC) with tags","Inline policies on every user","The root user"],a:[1],e:"ABAC lets one policy compare tags on people and resources, so new projects need only tags."},
 {q:"Which policy follows least privilege for a job that only reads files under s3://lake/curated/?",o:["s3:* on *","s3:GetObject on arn:aws:s3:::lake/curated/*","s3:GetObject on *","AdministratorAccess"],a:[1],e:"The exact action on the exact folder is least privilege."},
 {q:"Which tool can generate a least-privilege policy from a role's actual activity?",o:["Amazon Macie","IAM Access Analyzer","AWS Config","Amazon Inspector"],a:[1],e:"IAM Access Analyzer can build a policy from CloudTrail activity and also flags resources shared outside the account."}
]);

add("iam","week1-review","Week 1 review quiz",`
<p>Mixed questions on cloud basics, networking and IAM, written in the exam's style. Aim for at least 8 out of 10 before moving to Week 2. If you score lower, re-read the lessons behind the questions you missed. Tap any dotted word if a term is unclear.</p>
`,[
 {q:"A data team runs a nightly EMR job in a private subnet that reads from S3. The NAT Gateway bill is high. What reduces cost most?",o:["Move EMR to a public subnet","Add an S3 gateway endpoint","Use bigger servers","Turn on Multi-AZ"],a:[1],e:"S3 traffic through a NAT Gateway is charged per GB. A gateway endpoint is free and keeps traffic private."},
 {q:"A Lambda function must read a secret stored in Secrets Manager in a different AWS account. What is required? (Choose TWO)",o:["A resource policy on the secret allowing the Lambda's role","A policy on the Lambda's role allowing secretsmanager:GetSecretValue","Making the secret public","The root user's keys","A NAT Gateway"],a:[0,1],e:"Across accounts, both the resource's policy and the caller's own policy must allow it. (If a customer-managed KMS key encrypts the secret, the key policy must allow it too.)"},
 {q:"Under the shared responsibility model, what does AWS secure when you use Glue?",o:["The Glue job's IAM role","The servers that run Glue jobs","Encryption settings for job output","The S3 bucket policy"],a:[1],e:"AWS secures the infrastructure running Glue. Roles, encryption settings and bucket policies are yours."},
 {q:"A role's policy allows s3:GetObject on all resources. An SCP on the account denies all S3 actions. Result?",o:["Allowed","Denied","Allowed only for the root user","Allowed in one Region"],a:[1],e:"An SCP (Service Control Policy) caps what anyone in the account can do. Its deny overrides the role's Allow."},
 {q:"Which statement about NACLs is correct?",o:["They are stateful","They protect individual servers","Rules are checked in number order and can deny traffic","They can use security groups as the source"],a:[2],e:"NACLs (Network Access Control Lists) are stateless, protect whole subnets, use numbered rules and support deny."},
 {q:"What is the best way to let a Redshift cluster load files from S3 with COPY?",o:["Put an IAM user's keys in the COPY command","Attach an IAM role to the cluster and name it in COPY","Make the bucket public","Use the root user"],a:[1],e:"COPY uses an IAM role associated with the cluster. Avoid putting keys in commands."},
 {q:"A company must make sure no resources are ever created outside ap-south-1, in any of its accounts. What enforces this?",o:["An IAM group","An SCP denying actions where aws:RequestedRegion is not ap-south-1","A NACL","A security group"],a:[1],e:"SCPs apply to every user and role in the accounts they're attached to, including admins."},
 {q:"Where should a production RDS database used by Glue ETL be placed?",o:["A public subnet with a public IP","A private subnet, with a security group allowing the Glue connection","An edge location","Any subnet; security groups don't matter"],a:[1],e:"Databases go in private subnets, and security groups decide exactly who can connect."},
 {q:"Database queries arrive at a server, but replies never get back to the clients. The security group is correct. What is the most likely cause?",o:["The subnet's custom NACL has no outbound rule for ephemeral ports 1024–65535","The security group is stateless","The IAM role is missing","The bucket policy denies access"],a:[0],e:"NACLs are stateless, so replies need their own outbound rule. Security groups are stateful and would allow replies automatically."},
 {q:"Creating a Glue job fails with “not authorized to perform iam:PassRole”. What is missing?",o:["glue:CreateJob","iam:PassRole on the job's role, for the user","A NAT Gateway","An S3 endpoint"],a:[1],e:"Attaching a role to a service needs iam:PassRole on that role."}
]);

/* ===================== WEEK 2: DATA ENGINEERING CONCEPTS ===================== */
add("de","de-systems","Databases, warehouses, data lakes and lakehouses",`
${learn(["What a data engineer actually builds","OLTP vs OLAP: the two kinds of database work","Row storage vs columnar storage, and why analytics prefers columns","Structured, semi-structured and unstructured data","Database vs data warehouse vs data lake vs lakehouse","The raw, cleaned and curated zones of a data lake"])}
<h2>What data engineering is</h2>
<p>Data is created in many places: apps, websites, machines, partner files, SaaS tools. A <b>data engineer</b> builds the <b>pipelines</b> that collect that data, clean and reshape it, store it in the right place, and keep it flowing reliably so analysts, dashboards and AI models can use it.</p>
${simple("<p>Think of a city's <b>water supply</b>. Lakes and rivers are the <b>sources</b>. Pipes and the treatment plant are the <b>pipelines</b> that move and clean the water. Overhead tanks in each building are the <b>analytics stores</b>. Taps are the <b>dashboards and reports</b> people actually use. The data engineer designs and runs everything between the river and the tap.</p>")}
<h2>Two kinds of database work: OLTP and OLAP</h2>
${table(["","OLTP (Online Transaction Processing)","OLAP (Online Analytical Processing)"],[
 ["Purpose","Run the business: record each order, payment, login","Understand the business: trends, totals, comparisons"],
 ["Typical query","“Get order 10045” or “insert this new order”","“Total sales per city per month for 3 years”"],
 ["Rows touched per query","A few","Millions or billions"],
 ["Number of queries","Thousands per second, each tiny","Fewer, each big"],
 ["Who uses it","The application","Analysts, BI dashboards, data scientists"],
 ["Storage layout","Row-based","Columnar"],
 ["AWS examples","RDS, Aurora, DynamoDB","Redshift, Athena on S3"]])}
${key("<p>Don't run heavy analytics directly on the app's OLTP database. Big reports slow it down for customers. Copy the data into an analytics store (a warehouse or lake) and query it there. Many exam questions describe exactly this problem.</p>")}
<h2>Row storage vs columnar storage</h2>
<p>Take this small table:</p>
${table(["order_id","customer","city","amount"],[["1","Ravi","Hyderabad","500"],["2","Anita","Pune","1200"],["3","Kiran","Hyderabad","300"]])}
<p>A <b>row-based</b> store writes whole rows together on disk:</p>
<pre><code>1,Ravi,Hyderabad,500 | 2,Anita,Pune,1200 | 3,Kiran,Hyderabad,300</code></pre>
<p>A <b>columnar</b> store writes each column together:</p>
<pre><code>order_id: 1,2,3 | customer: Ravi,Anita,Kiran | city: Hyderabad,Pune,Hyderabad | amount: 500,1200,300</code></pre>
<p>Now run <code>SELECT SUM(amount) FROM orders</code>. The row store must read every row, including names and cities it doesn't need. The columnar store reads only the <code>amount</code> column. With 50 columns and a billion rows, that's the difference between reading everything and reading 2% of it.</p>
<p>Columnar data also <b>compresses much better</b>, because values in one column look alike (lots of “Hyderabad”s next to each other).</p>
${simple("<p>A row store is like a <b>register book</b> where each line has one student's name, roll number, marks and address. To add up everyone's marks you must turn every page. A columnar store is like keeping a <b>separate notebook for each column</b>. To add up marks you open only the marks notebook.</p>")}
<p>Row storage is better for OLTP, where you usually want one whole record. Columnar storage is better for OLAP, where you want a few columns across many records.</p>
<h2>Three shapes of data</h2>
${table(["Type","What it looks like","Examples"],[
 ["Structured","Fixed rows and columns with types","Database tables, CSV exports"],
 ["Semi-structured","Has labels and structure, but fields can vary and nest","JSON, XML, application logs, clickstream events"],
 ["Unstructured","No table structure","Images, PDFs, audio, video, free text"]])}
<h2>Where data is stored for analytics</h2>
${table(["Store","What it holds","Structure","Strengths","AWS example"],[
 ["Operational database","Current app data","Fixed schema, row-based","Fast small reads and writes","RDS, Aurora, DynamoDB"],
 ["Data warehouse","Cleaned, structured data for reporting","<b>Schema-on-write</b>: tables defined first; data must fit","Fast complex SQL, joins, consistent BI performance","Amazon Redshift"],
 ["Data lake","Raw data of any type and format","<b>Schema-on-read</b>: store first, define structure when querying","Cheap, unlimited, any format, many tools can read it","Amazon S3 + Glue Data Catalog + Athena"],
 ["Lakehouse","Lake data with warehouse features","Open table format adds transactions, updates, deletes","Lake prices with database-like reliability","S3 + Apache Iceberg (or S3 Tables)"]])}
${simple("<p><b>Schema-on-write</b> is a library that catalogues every book and puts it on the correct shelf before anyone can borrow it. Finding a book is quick, but adding books takes effort. <b>Schema-on-read</b> is a big storeroom where boxes go in as they arrive; you sort through a box only when you need something from it. Storing is easy, and you decide how to read it later.</p>")}
<p>Most companies use <b>both</b>: an S3 data lake for everything, and Redshift for the curated data that powers dashboards.</p>
<h2>Zones in a data lake</h2>
<p>A data lake is usually split into layers, often as separate S3 prefixes or buckets. Names vary; the “medallion” names bronze, silver and gold are common.</p>
${table(["Zone","Also called","What it holds","Example path"],[
 ["Raw","Bronze, landing","An exact copy of the source data, as received. Never changed","<code>s3://lake/raw/orders/2026/10/29/orders.json</code>"],
 ["Cleaned","Silver, processed","Fixed data types, duplicates removed, bad rows filtered, converted to Parquet","<code>s3://lake/clean/orders/order_date=2026-10-29/</code>"],
 ["Curated","Gold, analytics","Business-ready tables: joined, aggregated, named for users","<code>s3://lake/curated/daily_sales_by_city/</code>"]])}
${key("<p>Keep the raw zone untouched. If you find a bug in your cleaning logic months later, you can rebuild the cleaned and curated zones from raw data.</p>")}
${tip("<p>“Store any data format cheaply and decide how to analyse it later” → <b>S3 data lake</b>.<br>“Complex joins and fast, consistent dashboard queries on structured data” → <b>Redshift</b>.<br>“Update or delete individual rows in the data lake” → a <b>lakehouse</b> table format like <b>Iceberg</b> (Week 7).</p>")}
`,[
 {q:"An e-commerce app's database slows down every evening when analysts run large monthly reports on it. What is the best long-term fix?",o:["Give analysts more powerful laptops","Copy the data into an analytics store such as Redshift or an S3 data lake and run reports there","Run the reports twice","Convert the app database to CSV"],a:[1],e:"OLTP databases serve the app. Heavy OLAP reporting belongs in a separate analytics store."},
 {q:"Why is columnar storage faster for “total sales by month”?",o:["It stores data in more files","It reads only the columns the query needs and compresses them well","It keeps every row in memory","It sorts data by customer name"],a:[1],e:"The query needs only a couple of columns. A columnar store reads just those, and compressed columns are smaller to read."},
 {q:"Which describes schema-on-read?",o:["Data must match a table definition before it is stored","Data is stored as-is and structure is applied when queried","Data can't have a schema","Only JSON data can be stored"],a:[1],e:"Data lakes store raw files and apply a schema (for example through the Glue Data Catalog) at query time."},
 {q:"Which zone of a data lake should keep an unchanged copy of source data?",o:["Raw (bronze)","Cleaned (silver)","Curated (gold)","None; raw data should be deleted after cleaning"],a:[0],e:"The raw zone keeps the original data so you can reprocess it whenever logic changes."},
 {q:"Application logs in JSON, where fields vary from event to event, are an example of:",o:["Structured data","Semi-structured data","Unstructured data","OLTP data"],a:[1],e:"JSON has labels and structure, but fields can vary and nest: semi-structured."}
]);

add("de","de-movement","ETL, ELT, batch, streaming and CDC",`
${learn(["ETL vs ELT","Batch, micro-batch and streaming; real-time vs near-real-time","Full loads vs incremental loads, and how to find “new” data","CDC (Change Data Capture)","Idempotency, upserts, replay and backfill","Orchestration and DAGs"])}
<h2>ETL vs ELT</h2>
<p>Every pipeline does three things: <b>Extract</b> (read from the source), <b>Transform</b> (clean, convert, join, aggregate) and <b>Load</b> (write to the target). The difference is the order.</p>
${table(["","ETL (Extract, Transform, Load)","ELT (Extract, Load, Transform)"],[
 ["Order","Transform in a separate engine, then load the finished data","Load raw data into the warehouse first, then transform it there with SQL"],
 ["Where the work happens","Glue, EMR or Lambda","Inside Redshift (or Athena on the lake)"],
 ["Good when","Data needs heavy cleaning or reshaping first; target should only get clean data","The warehouse is powerful and analysts are comfortable in SQL"],
 ["AWS example","Glue job reads raw JSON from S3, cleans it, writes Parquet","<code>COPY</code> raw data into Redshift staging tables, then SQL builds final tables"]])}
${simple("<p><b>ETL</b> is washing and chopping vegetables before putting them in the fridge. <b>ELT</b> is putting the shopping straight into the fridge and washing and chopping only when you cook.</p>")}
<h2>Batch vs streaming</h2>
${table(["","Batch","Micro-batch","Streaming"],[
 ["How it works","Collect data, then process a big chunk on a schedule","Process small chunks every few seconds or minutes","Process each event continuously as it arrives"],
 ["Delay (latency)","Minutes to hours","Seconds to minutes","Milliseconds to seconds"],
 ["Example","Nightly load of yesterday's orders","Glue streaming job processing every 100 seconds","Fraud check on each card payment"],
 ["AWS services","Glue, EMR, Redshift COPY, Step Functions","Glue streaming, Spark Structured Streaming on EMR","Kinesis Data Streams, MSK, Managed Service for Apache Flink, Lambda"]])}
<p>Exam wording matters:</p>
<ul>
<li><b>Real-time</b> usually means milliseconds up to about a second. Think Kinesis Data Streams or MSK with a consumer.</li>
<li><b>Near-real-time</b> means within seconds to a few minutes. Think Amazon Data Firehose, which collects (buffers) data briefly before delivering it.</li>
</ul>
<h2>Full load vs incremental load</h2>
<ul>
<li><b>Full load:</b> copy the entire table every time. Simple, but slow and expensive for big tables.</li>
<li><b>Incremental load:</b> copy only what is new or changed since the last run. Faster and cheaper, but you need a way to find the new data.</li>
</ul>
<p>Three common ways to find new data:</p>
${table(["Method","How","Weakness"],[
 ["Timestamp or ID column (a “watermark”)","Remember the last run's highest <code>updated_at</code> value; next time read rows where <code>updated_at</code> is greater","Misses rows deleted at the source; needs a reliable timestamp column"],
 ["New files","Process only files that arrived since last time. Glue <b>job bookmarks</b> do this automatically (Week 3)","Only works for file sources"],
 ["CDC (Change Data Capture)","Read the database's own change log","Needs CDC enabled on the source"]])}
<h2>CDC: Change Data Capture</h2>
<p>Every database keeps a <b>transaction log</b>: a running diary of every insert, update and delete. <b>Log-based CDC</b> reads that diary and sends each change downstream. It captures deletes too, and puts almost no load on the database.</p>
${table(["Operation","order_id","status","changed_at"],[
 ["I (insert)","101","PLACED","10:00:01"],["U (update)","101","SHIPPED","14:22:40"],["I (insert)","102","PLACED","14:25:03"],["D (delete)","99","—","15:01:10"]])}
<p>The target applies these changes in order, so it stays in sync with the source. On AWS, <b>DMS</b> (Database Migration Service) does log-based CDC from databases such as MySQL, PostgreSQL, Oracle and SQL Server into S3, Redshift, Kinesis and others (Week 4).</p>
${simple("<p>A full load is photocopying the entire attendance register every day. CDC is reading only today's new entries in the register's daily diary: “Ravi joined, Anita's surname changed, Kiran left”.</p>")}
<h2>Four ideas that keep pipelines correct</h2>
${table(["Term","Meaning","How to achieve it"],[
 ["Idempotent","Running the same job twice gives the same result as running it once. No duplicates","Overwrite a whole partition instead of appending; use MERGE on a key; remove duplicates by unique key"],
 ["Upsert","Update the row if it exists, insert it if it doesn't","SQL <code>MERGE</code>; Iceberg tables; DynamoDB <code>PutItem</code>"],
 ["Replay","Re-read data that was already processed","Keep it somewhere re-readable: Kinesis Data Streams retains data for 24 hours up to 365 days; the S3 raw zone keeps it forever"],
 ["Backfill","Re-run the pipeline for past dates","Pipelines that take a date as input and are idempotent"]])}
${simple("<p><b>Idempotent</b> is like a lift button: pressing it five times still calls the lift once. A pipeline that appends rows each time it runs is like a shop counter that rings up the same bill again on every retry.</p>")}
<p>Also know <b>fan-in</b> (many sources feeding one target, such as many app servers sending logs to one stream) and <b>fan-out</b> (one source feeding many consumers, such as one stream read by three different applications).</p>
<h2>Orchestration</h2>
<p>A real pipeline has several steps that must run in the right order, retry when something fails, and alert someone if it still fails. Managing this is called <b>orchestration</b>.</p>
<p>The steps and their order form a <b>DAG</b> (Directed Acyclic Graph): tasks connected by one-way arrows, with no loops.</p>
<pre><code>new file lands → crawl it → clean it (Glue) → check quality → load Redshift → notify team
                                                  └── fails → alert on SNS</code></pre>
<p>Pipelines start in two ways: <b>on a schedule</b> (“every day at 2 AM”) or <b>on an event</b> (“when a file arrives in S3”). AWS orchestration tools: <b>Step Functions</b>, <b>MWAA</b> (Managed Workflows for Apache Airflow), <b>Glue Workflows</b>, and <b>EventBridge</b> for schedules and events (Week 5).</p>
${tip("<p>“Only process new data since the last run” → <b>incremental</b> (Glue job bookmarks for files, CDC for databases).<br>“Keep the warehouse in sync with ongoing database changes” → <b>DMS with CDC</b>.<br>“Retries must not create duplicates” → make the step <b>idempotent</b> (overwrite partition or MERGE).</p>")}
`,[
 {q:"A team loads raw data into Redshift first and then uses SQL inside Redshift to build reporting tables. This is:",o:["ETL","ELT","CDC","Streaming"],a:[1],e:"Load first, transform inside the warehouse afterwards: Extract, Load, Transform."},
 {q:"A pipeline must capture inserts, updates AND deletes from an Oracle database and keep S3 in sync, with minimal load on the database. What approach fits?",o:["Nightly full export","Query rows by updated_at timestamp","Log-based CDC, for example with AWS DMS","Copy the database files manually"],a:[2],e:"Log-based CDC reads the transaction log, captures deletes too, and adds very little load. DMS supports it."},
 {q:"A job failed halfway and was re-run. Now some rows appear twice in the target. Which property was missing?",o:["Durability","Idempotency","Elasticity","Partitioning"],a:[1],e:"An idempotent job gives the same result however many times it runs, for example by overwriting the partition or merging on a key."},
 {q:"Data must be available for dashboards within about a minute of arriving, with as little code as possible. Which word describes this requirement?",o:["Real-time","Near-real-time","Batch","Backfill"],a:[1],e:"Seconds to a few minutes is near-real-time. Firehose is the classic low-code answer."},
 {q:"Which method of finding new rows will MISS rows that were deleted in the source?",o:["Log-based CDC","Reading rows with updated_at greater than the last run","Neither","Both"],a:[1],e:"A deleted row no longer exists, so a timestamp query never sees it. Log-based CDC records the delete."}
]);

add("de","de-formats","File formats, compression and partitioning",`
${learn(["CSV, JSON, Avro, Parquet and ORC: what each is good for","How Parquet lets engines skip data","Compression, and what “splittable” means","Partitioning: how to choose partition columns","The small files problem and data skew","Why these choices change cost so much"])}
<p>How you store files in S3 decides how fast and how cheap every query on them will be. This lesson is behind a large number of exam questions.</p>
<h2>The five formats</h2>
${table(["Format","Row or column","Has a schema?","Human-readable?","Best for"],[
 ["CSV","Row","No (just text; no data types)","Yes","Simple exchange of flat data. Weak for analytics"],
 ["JSON (JSON Lines: one object per line)","Row","No fixed schema; fields can vary and nest","Yes","Events, logs, API data. Verbose and slow to scan"],
 ["Avro","Row","Yes, stored inside the file","No (binary)","Streaming and Kafka, writing whole records, schemas that change over time"],
 ["Parquet","Columnar","Yes, with data types","No (binary)","Analytics with Athena, Redshift Spectrum, Glue, EMR. The usual default"],
 ["ORC (Optimized Row Columnar)","Columnar","Yes","No (binary)","Analytics, especially with Hive. Very similar to Parquet"]])}
${key("<p>For analytics, the answer is almost always <b>Parquet</b> (or ORC): columnar, compressed and typed. Converting CSV or JSON to Parquet is one of the most common “make it faster and cheaper” answers.</p>")}
<h2>How Parquet lets engines skip data</h2>
<p>A Parquet file is divided into <b>row groups</b> (blocks of, say, a million rows). Inside each row group, every column is stored separately. The file's <b>footer</b> records the schema and, for each column in each row group, the <b>minimum and maximum value</b>.</p>
<pre><code>orders.parquet
├─ row group 1: order_date min 2026-10-01, max 2026-10-10 | amount ... | city ...
├─ row group 2: order_date min 2026-10-11, max 2026-10-20 | ...
└─ footer: schema + min/max of every column in every row group</code></pre>
<p>For <code>SELECT SUM(amount) WHERE order_date = '2026-10-15'</code>, the engine:</p>
<ol>
<li>reads the footer first;</li>
<li>skips row group 1, because its dates stop at the 10th. This is <b>predicate pushdown</b>;</li>
<li>in row group 2, reads only the <code>order_date</code> and <code>amount</code> columns. This is <b>column projection</b>.</li>
</ol>
${simple("<p>It's like a filing cabinet where every drawer has a label saying “Invoices 1–10 Oct”. Looking for 15 October, you skip the first drawer without opening it, and in the right drawer you pull out only the one sheet type you need.</p>")}
<h2>Compression</h2>
<p>Compression makes files smaller, so less is stored and less is read. One idea matters most: <b>splittable</b>.</p>
<p>A file is <b>splittable</b> if several workers can each read a different piece of it at the same time. If it isn't, one worker must read the whole file alone, however many workers you have.</p>
${table(["Codec","Size reduction","Speed","Splittable as a plain text file?","Notes"],[
 ["GZIP","High","Slower","<b>No</b>","Common for CSV and JSON, but one big .gz file is read by one worker"],
 ["BZIP2","High","Slow","Yes","Rarely chosen today"],
 ["Snappy","Moderate","Very fast","No as raw text","Default inside Parquet"],
 ["ZSTD","High","Fast","No as raw text","Good balance inside Parquet and ORC"],
 ["LZ4","Moderate","Very fast","No as raw text","Speed-focused"]])}
${key("<p>Inside <b>Parquet and ORC</b>, compression is applied to each block separately, so these files stay splittable <i>whatever</i> codec you use. The splittable question matters mainly for big CSV or JSON files: avoid single huge GZIP files, or split them into many smaller files.</p>")}
<h2>Partitioning</h2>
<p><b>Partitioning</b> means storing data in separate folders by the value of one or more columns. Hive-style folder names use <code>column=value</code>:</p>
<pre><code>s3://lake/clean/orders/year=2026/month=10/day=28/part-0001.parquet
s3://lake/clean/orders/year=2026/month=10/day=29/part-0001.parquet</code></pre>
<p>A query with <code>WHERE year = 2026 AND month = 10 AND day = 29</code> opens only one folder and ignores all others. This is <b>partition pruning</b>. Athena, Redshift Spectrum, Glue and EMR all do it.</p>
<p>How to choose partition columns:</p>
<ul>
<li>Pick columns people <b>filter on most often</b>, usually a date, sometimes a region or source system.</li>
<li>Pick columns with <b>low to medium cardinality</b>. Cardinality is how many different values a column has. Date (365 a year) or country (a few hundred) is fine.</li>
<li><b>Don't</b> partition by high-cardinality columns such as <code>order_id</code> or <code>customer_id</code>. You'd get millions of folders with one tiny file each, which is slower, not faster.</li>
<li>Aim for each partition to hold a decent amount of data (ideally hundreds of MB or more).</li>
</ul>
<p><b>Bucketing</b> is a related idea: rows are spread over a fixed number of files by hashing a column (often a join key like <code>customer_id</code>), which can speed up joins. It's tested far less than partitioning.</p>
<h2>The small files problem</h2>
<p>Every file has overhead: it must be listed, opened and its footer read, and every S3 request costs time and money. 100,000 files of 10 KB each are <b>far slower</b> to query than 10 files of 100 MB, even though the total data is the same.</p>
<p>Small files often come from streaming jobs that write every few seconds, or from over-partitioning.</p>
<p>Fixes: aim for files of roughly <b>128 MB to 1 GB</b>; <b>compact</b> small files into bigger ones on a schedule; reduce the number of output files in Spark before writing; increase Firehose buffer size; use Glue's file grouping when reading (Week 3); use Iceberg's compaction (Week 7).</p>
<h2>Data skew</h2>
<p><b>Data skew</b> means one partition or key holds much more data than the rest. For example, 70% of orders are from one big customer. Work is split by key, so one worker gets 70% of the job and everyone waits for it. Spark fixes are covered in the Spark lesson.</p>
<h2>Why it matters: an example</h2>
<p>Athena charges about 5 US dollars per TB scanned. Imagine one year of orders, 20 columns, and a query for one day using 2 columns. Numbers below are illustrative; real savings vary with the data.</p>
${table(["How the data is stored","Data scanned","Approximate cost per query"],[
 ["1 TB of CSV, one folder","All 1 TB","5 USD"],
 ["Same data as Parquet (often about 4× smaller), one folder","About 25 GB (only 2 of 20 columns of 250 GB)","0.12 USD"],
 ["Parquet, partitioned by day","About 70 MB (one day, 2 columns)","Under 0.01 USD"]])}
${tip("<p>“Athena queries are slow and expensive” → convert to <b>Parquet/ORC</b>, <b>compress</b>, <b>partition</b> by the columns used in filters, and fix <b>small files</b>.<br>“Schema changes often, streaming, write-heavy” → <b>Avro</b>.<br>“One large GZIP CSV takes forever to process” → it's <b>not splittable</b>; split it or convert it to Parquet.</p>")}
${trap("<p>Partitioning by a high-cardinality column (like user ID) is a wrong answer. It creates millions of tiny files and makes queries slower.</p>")}
`,[
 {q:"Analysts query a large CSV dataset in Athena. Queries are slow and costly. Which TWO changes help most? (Choose TWO)",o:["Convert the data to Parquet","Partition by the date column used in most filters","Store it as one single GZIP file","Partition by order_id","Add more columns"],a:[0,1],e:"Parquet reads only needed columns and compresses well; date partitions let Athena skip folders. One big GZIP file isn't splittable, and order_id partitions create millions of tiny files."},
 {q:"Which file format stores its schema inside the file and is popular for streaming data whose fields change over time?",o:["CSV","Avro","Parquet","Plain text"],a:[1],e:"Avro is row-based, binary, carries its schema, and handles schema evolution well."},
 {q:"A Spark job processes one 50 GB .csv.gz file and only one worker is busy. Why?",o:["GZIP text files aren't splittable, so one worker must read the whole file","Spark can't read CSV","The bucket is in the wrong Region","Parquet is required for Spark"],a:[0],e:"A GZIP-compressed text file can't be split, so it can't be shared across workers. Split it or convert it to Parquet."},
 {q:"How does Parquet let an engine skip row groups that can't match a filter?",o:["It stores data row by row","Its footer stores min and max values for each column in each row group","It encrypts the data","It sorts files by name"],a:[1],e:"The min/max statistics let the engine skip row groups (predicate pushdown)."},
 {q:"A streaming job writes thousands of 5 KB files per hour to S3, and queries are slowing down. What is the main fix?",o:["Use more partitions","Compact the small files into larger ones (about 128 MB to 1 GB)","Switch to CSV","Delete the bucket"],a:[1],e:"Too many small files add overhead to every query. Compacting them into fewer, larger files fixes it."}
]);

add("de","de-modelling","Data modelling: star schemas, keys and SCDs",`
${learn(["Normalised vs denormalised tables","Star schema: fact tables and dimension tables","Grain: what one row means","Primary, foreign, natural and surrogate keys","Slowly Changing Dimensions (SCD) types 1 and 2","Schema evolution, metadata and lineage"])}
<p><b>Data modelling</b> means deciding which tables to create, what columns each has, and how they connect. Good models make queries simple and fast.</p>
<h2>Normalised vs denormalised</h2>
<p>Look at this orders table:</p>
${table(["order_id","customer_name","customer_city","product","amount"],[["1","Ravi","Hyderabad","Phone","15000"],["2","Ravi","Hyderabad","Cover","500"],["3","Anita","Pune","Phone","15000"]])}
<p>Ravi's name and city are repeated on every order. If he moves, you must update many rows. <b>Normalisation</b> splits the data so each fact is stored once:</p>
<pre><code>customers(customer_id, name, city)
orders(order_id, customer_id, product_id, amount)
products(product_id, product_name, category)</code></pre>
${table(["","Normalised (many small linked tables)","Denormalised (fewer, wider tables)"],[
 ["Duplication","None or very little","Some values repeated"],
 ["Writes and updates","Easy: change one place","Harder: change many rows"],
 ["Analytical queries","Need many joins, so slower","Fewer joins, so faster"],
 ["Used in","OLTP app databases","Data warehouses and lakes"]])}
<h2>Star schema</h2>
<p>The standard design for analytics is the <b>star schema</b>: one central <b>fact table</b> surrounded by <b>dimension tables</b>.</p>
<pre><code>                 dim_date
                    │
 dim_customer ── fact_sales ── dim_product
                    │
                 dim_store

fact_sales(date_key, customer_key, product_key, store_key, quantity, amount)</code></pre>
<ul>
<li><b>Fact table:</b> one row per business event, holding the numbers you add up (quantity, amount) plus keys pointing to dimensions. Usually very long: millions or billions of rows.</li>
<li><b>Dimension tables:</b> the descriptive context: <i>who</i> (customer), <i>what</i> (product), <i>where</i> (store), <i>when</i> (date). Usually much smaller and wide (many descriptive columns).</li>
</ul>
${simple("<p>A shop's bill book is the <b>fact table</b>: each line says what was sold, how many and for how much. The customer list, product catalogue and store list are the <b>dimension tables</b> that explain who, what and where.</p>")}
<p>A <b>snowflake schema</b> normalises the dimensions further (for example product → category → department as separate tables). It saves a little space but needs more joins, so star schemas are preferred for fast BI.</p>
<h3>Grain</h3>
<p>The <b>grain</b> is what exactly one fact row represents, for example “one product line on one order”. Decide it first. Mixing grains (some rows per order, some per line) causes double counting.</p>
<h2>Keys</h2>
${table(["Key","Meaning","Example"],[
 ["Primary key","Uniquely identifies each row in a table","<code>customer_id</code> in customers"],
 ["Foreign key","A column that points to another table's primary key","<code>customer_id</code> inside orders"],
 ["Natural (business) key","An identifier that exists in the real world or source system","Email address, PAN-style ID, product SKU code"],
 ["Surrogate key","A meaningless number the warehouse generates","<code>customer_key</code> = 1, 2, 3…"]])}
<p>Warehouses use <b>surrogate keys</b> in dimensions because one real customer can have several rows over time (see SCD Type 2 next), and natural keys can change.</p>
<h2>Slowly Changing Dimensions (SCD)</h2>
<p>Dimension values change slowly over time: a customer moves city, a product changes category. An <b>SCD</b> type is the rule for handling that change.</p>
${table(["Type","What happens","History kept?","Use when"],[
 ["Type 0","The value never changes once loaded","Original only","Fixed facts like date of birth"],
 ["Type 1","Overwrite the old value","No","Corrections, or when history doesn't matter"],
 ["Type 2","Add a new row with start and end dates and a “current” flag","Full history","Reports must show what was true at the time"],
 ["Type 3","Add a column for the previous value","Only one previous value","Rare"]])}
<p>Type 2 example: Ravi moves from Hyderabad to Bengaluru on 1 October 2026.</p>
${table(["customer_key","customer_id","city","valid_from","valid_to","is_current"],[
 ["1","C100","Hyderabad","2023-01-01","2026-09-30","false"],
 ["57","C100","Bengaluru","2026-10-01","9999-12-31","true"]])}
<p>Sales from 2025 still point to key 1 (Hyderabad), so last year's report by city stays correct.</p>
<h2>Schema evolution, metadata and lineage</h2>
<ul>
<li><b>Schema evolution:</b> the structure of data changes over time: a new column appears, a type widens. Avro, Parquet and especially Iceberg handle this well; Glue crawlers can detect changes (Week 3). <b>Schema drift</b> means unexpected changes from a source.</li>
<li><b>Metadata:</b> data about data. <i>Technical</i> metadata is column names, types and file locations (stored in the Glue Data Catalog). <i>Business</i> metadata is descriptions, owners and definitions (stored in a business catalog such as SageMaker Catalog, Week 8).</li>
<li><b>Data lineage:</b> a record of where data came from and every step that changed it, so you can trace a wrong number back to its source.</li>
</ul>
${tip("<p>“Reports must show the customer's address at the time of each sale” → <b>SCD Type 2</b>.<br>“Fewer joins and faster BI queries” → <b>denormalised star schema</b>.<br>“Small, rarely changing dimension joined to a huge fact table” → in Redshift this becomes the <b>ALL</b> distribution style (Week 6).</p>")}
`,[
 {q:"A table holding one row per sale with quantity and amount, plus keys to customer, product and date, is a:",o:["Dimension table","Fact table","Lookup file","Staging bucket"],a:[1],e:"Fact tables hold measurable events and keys to dimensions."},
 {q:"Business users need sales reports that show each customer's city at the time of the sale, even if the customer has since moved. Which approach fits?",o:["SCD Type 1","SCD Type 2","Delete old customers","Store the city only in the fact table header"],a:[1],e:"Type 2 keeps a new row per change with valid dates, so old sales still link to the old city."},
 {q:"Why do warehouses usually prefer surrogate keys in dimension tables?",o:["They are easier for humans to read","One real customer can have several rows over time, and source keys can change","They are required by S3","They are encrypted"],a:[1],e:"Surrogate keys give each version of a dimension row its own key and protect against changes in source identifiers."},
 {q:"Which design generally gives the fastest analytical queries?",o:["Highly normalised OLTP schema","Denormalised star schema","One table per column","Storing everything as text"],a:[1],e:"Star schemas need few joins, which suits analytics."}
]);

add("de","de-sql","SQL for data engineers",`
${learn(["The order SQL actually runs in","Joins, GROUP BY and HAVING","CTEs (Common Table Expressions)","Window functions: ROW_NUMBER, RANK, LAG and running totals","MERGE (upsert), CTAS, views and materialized views","Simple rules for faster queries"])}
<p>The exam won't ask you to write long SQL, but it shows queries and asks what they do, and it expects you to know which SQL feature solves a problem. Examples use these two tables:</p>
<pre><code>customers(customer_id, name, city)
orders(order_id, customer_id, order_date, amount, status, updated_at)</code></pre>
<h2>The order SQL runs in</h2>
<p>You write <code>SELECT</code> first, but the database runs the parts in this order:</p>
<ol><li><code>FROM</code> and <code>JOIN</code>: which tables</li><li><code>WHERE</code>: filter rows</li><li><code>GROUP BY</code>: form groups</li><li><code>HAVING</code>: filter groups</li><li><code>SELECT</code>: choose columns, compute values</li><li><code>ORDER BY</code>: sort</li><li><code>LIMIT</code>: keep the first N</li></ol>
<p>That's why a column alias made in <code>SELECT</code> can't be used in <code>WHERE</code>: <code>WHERE</code> runs first.</p>
<h2>Joins</h2>
${table(["Join","Returns"],[
 ["INNER JOIN","Only rows that match in both tables"],
 ["LEFT JOIN","Every row from the left table, plus matches from the right (NULL where no match)"],
 ["RIGHT JOIN","Every row from the right table, plus matches from the left"],
 ["FULL OUTER JOIN","Every row from both, matched where possible"],
 ["CROSS JOIN","Every combination of rows (rarely wanted; can explode in size)"]])}
<pre><code>-- Customers who have never ordered
SELECT c.customer_id, c.name
FROM customers c
LEFT JOIN orders o ON o.customer_id = c.customer_id
WHERE o.order_id IS NULL;</code></pre>
<h2>GROUP BY, WHERE and HAVING</h2>
<pre><code>SELECT city, SUM(amount) AS total_sales
FROM orders o JOIN customers c ON c.customer_id = o.customer_id
WHERE order_date >= DATE '2026-01-01'      -- filters rows before grouping
GROUP BY city
HAVING SUM(amount) > 100000;               -- filters groups after grouping</code></pre>
<h2>CTEs: naming steps</h2>
<p>A <b>CTE</b> (Common Table Expression) names a sub-result with <code>WITH</code> so long queries read top to bottom:</p>
<pre><code>WITH daily AS (
  SELECT order_date, SUM(amount) AS sales
  FROM orders
  GROUP BY order_date
)
SELECT AVG(sales) AS avg_daily_sales FROM daily;</code></pre>
<h2>Window functions</h2>
<p>A <b>window function</b> calculates across a group of related rows <i>without</i> collapsing them into one row the way <code>GROUP BY</code> does. The pattern is <code>function() OVER (PARTITION BY … ORDER BY …)</code>: <code>PARTITION BY</code> says which rows belong together; <code>ORDER BY</code> sets their order inside each group.</p>
<h3>Keep only the latest record per key (the most common data engineering use)</h3>
<pre><code>WITH ranked AS (
  SELECT *,
         ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) AS rn
  FROM orders_raw
)
SELECT * FROM ranked WHERE rn = 1;   -- one row per order: the newest version</code></pre>
<p>This removes duplicates that arrive when a source sends the same order several times.</p>
<h3>ROW_NUMBER vs RANK vs DENSE_RANK</h3>
<p>For amounts ordered from highest to lowest: 900, 800, 800, 700</p>
${table(["amount","ROW_NUMBER","RANK","DENSE_RANK"],[["900","1","1","1"],["800","2","2","2"],["800","3","2","2"],["700","4","4","3"]])}
<h3>Previous value and running total</h3>
<pre><code>SELECT order_date, sales,
       LAG(sales) OVER (ORDER BY order_date)                 AS previous_day_sales,
       SUM(sales) OVER (ORDER BY order_date)                 AS running_total
FROM daily_sales;</code></pre>
<h2>Changing data: MERGE, CTAS, INSERT … SELECT</h2>
<p><b>MERGE</b> performs an <b>upsert</b>: update matching rows, insert new ones (and optionally delete). It's how you apply a batch of changes without creating duplicates.</p>
<pre><code>MERGE INTO orders t
USING orders_staging s
  ON t.order_id = s.order_id
WHEN MATCHED THEN UPDATE SET status = s.status, amount = s.amount, updated_at = s.updated_at
WHEN NOT MATCHED THEN INSERT (order_id, customer_id, order_date, amount, status, updated_at)
  VALUES (s.order_id, s.customer_id, s.order_date, s.amount, s.status, s.updated_at);</code></pre>
<p>Redshift and Athena (on Iceberg tables) support MERGE.</p>
<ul>
<li><b>CTAS</b> (<code>CREATE TABLE … AS SELECT</code>) makes a new table from a query. In Athena it's a quick way to convert CSV into partitioned Parquet (Week 3).</li>
<li><b>INSERT INTO … SELECT</b> adds query results to an existing table.</li>
</ul>
<h2>Views vs materialized views</h2>
${table(["","View","Materialized view"],[
 ["What it stores","Only the query text","The query's <b>results</b>"],
 ["Speed when read","Runs the full query every time","Fast: reads stored results"],
 ["Freshness","Always current","Needs refreshing (Redshift can refresh automatically)"],
 ["Use for","Simplifying access, hiding columns","Speeding up heavy dashboard queries"]])}
<h2>Rules for faster, cheaper queries</h2>
<ul>
<li>Select only the columns you need; avoid <code>SELECT *</code>, especially on columnar data.</li>
<li>Filter on partition columns so whole folders are skipped.</li>
<li>Filter early and join on keys.</li>
<li>Pre-aggregate with materialized views or curated tables for repeated heavy queries.</li>
<li>Use <code>LIMIT</code> while exploring.</li>
</ul>
${tip("<p>“Remove duplicate records and keep the latest version of each” → <b>ROW_NUMBER() OVER (PARTITION BY key ORDER BY timestamp DESC)</b> and keep row 1.<br>“Apply inserts and updates from a staging table” → <b>MERGE</b>.<br>“Dashboard query is slow and runs often” → <b>materialized view</b>.</p>")}
`,[
 {q:"Which clause filters groups AFTER aggregation?",o:["WHERE","HAVING","ORDER BY","FROM"],a:[1],e:"WHERE filters rows before grouping; HAVING filters groups after GROUP BY."},
 {q:"A table has duplicate versions of each order. You must keep only the most recently updated version of each order. What do you use?",o:["GROUP BY order_id with SUM","ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) and keep row 1","CROSS JOIN","A view with SELECT *"],a:[1],e:"ROW_NUMBER numbers each order's versions from newest; keeping rn = 1 leaves exactly one row per order."},
 {q:"Which query returns customers who have never placed an order?",o:["INNER JOIN orders and keep all rows","LEFT JOIN orders and keep rows where order_id IS NULL","CROSS JOIN orders","RIGHT JOIN customers"],a:[1],e:"A LEFT JOIN keeps every customer; those with no matching order have NULL order columns."},
 {q:"Values 500, 400, 400, 300 are ranked from highest. What does DENSE_RANK give the value 300?",o:["4","3","2","1"],a:[1],e:"DENSE_RANK doesn't leave gaps: 500 → 1, 400 → 2, 400 → 2, 300 → 3. RANK would give 4."},
 {q:"A heavy dashboard query runs every few minutes and is slow. What helps most?",o:["A normal view","A materialized view that stores the results","SELECT *","Removing the WHERE clause"],a:[1],e:"A materialized view stores the results so reads are fast; a normal view re-runs the whole query each time."}
]);

add("de","de-spark","Apache Spark basics",`
${learn(["Why big data needs many machines","Driver, executors, partitions and tasks","Lazy transformations and actions","Narrow vs wide transformations, and why shuffles are slow","Broadcast joins, data skew, repartition and coalesce","Common memory errors, and how Glue and EMR use Spark"])}
<h2>Why Spark exists</h2>
<p>A single machine can't comfortably process 2 TB of data: it doesn't fit in memory and would take hours. <b>Apache Spark</b> splits the data into many pieces and processes them <b>in parallel</b> on many machines, then combines the results. AWS Glue ETL jobs, Amazon EMR and Athena's Spark notebooks all run Spark.</p>
${simple("<p>Think of a university correcting 10,000 exam papers. The <b>chief examiner</b> (the driver) splits the papers into bundles (partitions) and hands them to many <b>evaluators</b> (executors), who mark them in parallel. The chief examiner then collects the totals. If evaluators must swap papers to regroup them by subject, that swapping (the <b>shuffle</b>) is the slowest part of the day.</p>")}
<h2>The parts of a Spark application</h2>
${table(["Part","What it does"],[
 ["Driver","The coordinator. Runs your program, builds the plan, splits it into tasks and tracks progress. One per application"],
 ["Executors","Worker processes on the cluster machines. They run tasks and hold data in memory"],
 ["Partition","One chunk of the data. Each partition is processed by one task. More partitions = more parallel work"],
 ["Task","One unit of work on one partition"],
 ["Stage","A group of tasks that can run without moving data between machines. Stages are separated by shuffles"],
 ["Cluster manager","Gives the application machines. YARN on EMR; Glue handles this for you"]])}
<h2>A small PySpark job</h2>
<pre><code>df = spark.read.parquet("s3://lake/clean/orders/")              # nothing runs yet

hyd = (df.filter(df.city == "Hyderabad")                        # transformation
         .groupBy("order_date")                                 # transformation
         .sum("amount"))                                        # transformation

hyd.write.mode("overwrite").parquet("s3://lake/curated/hyd_daily_sales/")   # action: runs now</code></pre>
<h2>Lazy transformations and actions</h2>
<ul>
<li><b>Transformations</b> (<code>filter</code>, <code>select</code>, <code>join</code>, <code>groupBy</code>, <code>withColumn</code>) only <i>describe</i> what to do. Spark records them in a plan but runs nothing. This is called <b>lazy evaluation</b>.</li>
<li><b>Actions</b> (<code>write</code>, <code>count</code>, <code>show</code>, <code>collect</code>) make Spark actually run the plan.</li>
</ul>
<p>Being lazy lets Spark optimise the whole plan first, for example reading only the needed columns and pushing filters down into the Parquet reader.</p>
<h2>Narrow vs wide transformations, and shuffles</h2>
${table(["Kind","Examples","What happens"],[
 ["Narrow","filter, select, withColumn, map","Each partition is processed on its own. Fast; no data moves between machines"],
 ["Wide","groupBy, join, distinct, orderBy, repartition","Rows with the same key must be brought together, so data moves across the network. This is a <b>shuffle</b>"]])}
<p>Shuffles cost network traffic, disk writes and memory. Making jobs faster is mostly about shuffling less data.</p>
<h2>Joins: shuffle vs broadcast</h2>
<ul>
<li>A <b>shuffle join</b> moves both tables across the network so matching keys meet. Fine for two big tables, but expensive.</li>
<li>A <b>broadcast join</b> sends a full copy of a <b>small</b> table to every executor, so the big table never moves. Much faster when one side is small (by default Spark broadcasts tables under about 10 MB automatically; you can also hint it).</li>
</ul>
<h2>Data skew</h2>
<p>If one key has far more rows than others (say one customer has 60% of all orders), the partition for that key is huge. One task runs for an hour while the rest finish in a minute. Signs: in the Spark UI, most tasks are quick and one or two are very slow.</p>
<p>Fixes: <b>AQE</b> (Adaptive Query Execution, on by default in Spark 3) can split skewed partitions automatically; <b>salting</b> adds a random number to the hot key to spread it out; filter out junk keys such as NULLs before joining.</p>
<h2>repartition vs coalesce</h2>
${table(["","repartition(n)","coalesce(n)"],[
 ["Can increase partitions?","Yes","No, only reduce"],
 ["Shuffle?","Full shuffle","Avoids a full shuffle"],
 ["Partition sizes","Even","Can be uneven"],
 ["Typical use","Spread data evenly before heavy work","Reduce the number of output files before writing, to avoid small files"]])}
<p><code>cache()</code> keeps a result in memory when it's used several times in the same job.</p>
<h2>Memory errors</h2>
${table(["Error","Common cause","Fix"],[
 ["Driver out of memory (OOM)","<code>collect()</code> pulling a big result to the driver; listing millions of small files","Don't collect big data; write it out instead. Compact small files. Bigger driver"],
 ["Executor out of memory","Skewed or very large partitions, huge shuffles","More or larger workers, more partitions, fix skew, broadcast the small side"]])}
<h2>Spark on AWS</h2>
${table(["Service","How you use Spark"],[
 ["AWS Glue ETL","Serverless Spark. You choose a worker type and number of workers: G.1X = 1 DPU = 4 vCPUs and 16 GB memory; G.2X = 2 DPUs. Adds DynamicFrames and job bookmarks (Week 3)"],
 ["Amazon EMR","Spark on a cluster you configure, or EMR Serverless. Full control of versions and settings (Week 5)"],
 ["Athena for Apache Spark","Run PySpark in notebooks without managing anything"]])}
${tip("<p>“Join a large table with a small lookup table faster” → <b>broadcast join</b>.<br>“A few tasks take much longer than the rest” → <b>data skew</b> (AQE, salting).<br>“Job writes thousands of tiny output files” → <b>coalesce</b> (or repartition) to fewer partitions before writing.<br>“Driver runs out of memory” → stop calling <b>collect()</b> on large data.</p>")}
`,[
 {q:"In Spark, which process coordinates the job and splits it into tasks?",o:["Executor","Driver","Partition","Shuffle"],a:[1],e:"The driver builds the plan and schedules tasks; executors run them."},
 {q:"A Spark job joins a 2 TB fact table with a 5 MB lookup table and spends most of its time shuffling. What helps most?",o:["Broadcast the lookup table","Increase the lookup table's size","Use collect() on the fact table","Convert both to CSV"],a:[0],e:"Broadcasting the small table to every executor avoids shuffling the 2 TB table."},
 {q:"Most tasks finish in a minute, but two run for 40 minutes. What is the likely cause?",o:["Lazy evaluation","Data skew","Too few columns","Snappy compression"],a:[1],e:"A few very slow tasks usually mean skewed keys put far more data into some partitions."},
 {q:"Which operation triggers Spark to actually execute the plan?",o:["filter","select","write","groupBy"],a:[2],e:"Transformations are lazy; actions such as write, count and collect run the plan."},
 {q:"A Glue Spark job writes 4,000 tiny Parquet files. What should you add before the write?",o:["coalesce to a smaller number of partitions","collect()","More transformations","A larger driver only"],a:[0],e:"coalesce reduces the number of partitions without a full shuffle, so fewer, larger files are written."}
]);

/* ===================== WEEK 2: AMAZON S3 ===================== */
add("s3","s3-basics","S3 basics: buckets, objects and keys",`
${learn(["What object storage is and how it differs from a disk or file share","Buckets, objects, keys and prefixes","Durability, availability and consistency","Size limits and how files are uploaded","Why S3 is the base of every AWS data lake"])}
<p><b>Amazon S3</b> (Simple Storage Service) stores files of any type and size, as many as you like, and you pay per GB stored per month. Almost every AWS data pipeline reads from or writes to S3.</p>
<h2>Objects, buckets and keys</h2>
${table(["Part","Meaning","Example"],[
 ["Bucket","A container for objects. Created in one Region. Its name must be unique across all AWS accounts worldwide: 3–63 characters, lowercase letters, numbers, dots and hyphens","<code>acme-sales-lake-prod</code>"],
 ["Object","One stored file: the data itself plus metadata (content type, custom labels). Up to <b>5 TB</b>","<code>orders_001.parquet</code>"],
 ["Key","The object's full name inside the bucket, including any “folders”","<code>raw/orders/2026/10/29/orders_001.parquet</code>"],
 ["Prefix","The beginning part of a key, used like a folder path","<code>raw/orders/2026/10/</code>"]])}
${key("<p>S3 has <b>no real folders</b>. A key is just one long name that happens to contain slashes. The console shows prefixes as folders for convenience. Prefixes still matter a lot, for partitioning, for permissions and for performance.</p>")}
${simple("<p>S3 is like a <b>cloakroom</b>. You hand over a bag and get a token with a unique number (the key). To get the bag back, you show the token. You can't go in and rearrange things inside a bag; you swap the whole bag. The cloakroom (bucket) is in one city (Region).</p>")}
<h2>Object storage vs file storage vs block storage</h2>
${table(["Type","AWS service","How you use it","Can you change part of a file in place?"],[
 ["Object storage","S3","Read and write whole objects over HTTPS (API calls)","<b>No</b>. To change one row, you rewrite the whole object"],
 ["File storage","EFS (Elastic File System)","A shared network drive that many servers mount","Yes"],
 ["Block storage","EBS (Elastic Block Store)","A virtual hard disk attached to one EC2 server","Yes"]])}
<p>Because objects can't be edited in place, updating or deleting single rows in a data lake is hard. That's the problem table formats like Apache Iceberg solve (Week 7).</p>
<h2>Durability, availability and consistency</h2>
<ul>
<li><b>Durability</b> (not losing data): S3 is designed for <b>99.999999999%</b> (“eleven nines”). Most storage classes keep copies across at least <b>three Availability Zones</b>.</li>
<li><b>Availability</b> (being reachable): S3 Standard is designed for 99.99% availability. Cheaper classes are a little lower.</li>
<li><b>Consistency:</b> S3 has <b>strong read-after-write consistency</b>. As soon as a write or delete succeeds, every following read and list sees the change. No waiting.</li>
</ul>
<h2>Uploading</h2>
<ul>
<li>A single upload request (PUT) can be up to <b>5 GB</b>.</li>
<li>Larger objects <b>must</b> use <b>multipart upload</b>, which splits a file into parts uploaded in parallel. AWS recommends it for anything over about 100 MB (details in the S3 performance lesson).</li>
<li>You can attach up to 10 <b>tags</b> (key-value labels) to an object, for example <code>classification=pii</code>. Tags can drive lifecycle rules and permissions.</li>
</ul>
<h2>Addressing objects</h2>
<pre><code>s3://acme-sales-lake-prod/raw/orders/2026/10/29/orders_001.parquet          (used by tools and Spark)
https://acme-sales-lake-prod.s3.ap-south-1.amazonaws.com/raw/orders/...    (HTTPS URL)</code></pre>
<h2>Security at a glance</h2>
<p>Buckets and objects are <b>private by default</b>. <b>Block Public Access</b> is on by default for new buckets, and every new object is <b>encrypted by default</b> with SSE-S3 (Server-Side Encryption with S3-managed keys). Access is granted with IAM policies and bucket policies. All of this is covered in depth in Week 8.</p>
<h2>Why data lakes are built on S3</h2>
<ul>
<li>Practically unlimited space, very high durability, low cost.</li>
<li>Any format: CSV, JSON, Parquet, images, logs.</li>
<li>Every AWS analytics service reads it directly: Glue, Athena, EMR, Redshift Spectrum, SageMaker, Bedrock.</li>
<li><b>Storage is separate from compute</b>: you keep data in one place and run whichever engine fits each job, paying for compute only while it runs.</li>
</ul>
`,[
 {q:"What is the maximum size of a single S3 object?",o:["5 GB","5 TB","50 TB","Unlimited"],a:[1],e:"An object can be up to 5 TB. A single PUT is limited to 5 GB, so larger objects need multipart upload."},
 {q:"A job writes an object and immediately lists the bucket. Will the new object appear?",o:["Only after a few minutes","Yes, S3 has strong read-after-write consistency","Only in a different Region","Only if versioning is on"],a:[1],e:"S3 is strongly consistent: successful writes are visible to all following reads and lists."},
 {q:"You need to change one row in a 2 GB CSV object in S3. What happens?",o:["S3 edits that row in place","You must write a new version of the whole object","S3 refuses any change","Only Glacier allows edits"],a:[1],e:"S3 is object storage; objects are replaced whole. Table formats like Iceberg manage row-level changes on top of this."},
 {q:"Which statement about S3 prefixes is true?",o:["They are real directories on disk","They are just the leading part of the object key, shown as folders in the console","They must be created before uploading","Each prefix is a separate bucket"],a:[1],e:"S3 has no real folders. Prefixes are part of the key name."}
]);

add("s3","s3-classes","S3 storage classes",`
${learn(["Each S3 storage class and when to use it","Retrieval times and retrieval fees","Minimum storage duration and minimum billable object size","How to choose a class in exam questions"])}
<p>Every object has a <b>storage class</b>. Cheaper classes cost less per GB per month, but charge to read data back, may be slower to retrieve, and charge a minimum number of days even if you delete early.</p>
${simple("<p>Think about where you keep things at home. Daily-use items sit on the <b>kitchen shelf</b> (Standard). Seasonal items go up in the <b>loft</b> (Infrequent Access): cheaper space, a ladder to fetch. Old documents go to a <b>rented storage unit across town</b> (Glacier Flexible): cheap, but a trip to get them. Things you must keep for years but almost never need go to a <b>relative's farmhouse in another state</b> (Deep Archive): cheapest, but it takes a day or two to get anything back.</p>")}
<h2>The classes</h2>
${table(["Class","Use when","How fast you get data back","Minimum storage charge","Retrieval fee"],[
 ["S3 Standard","Data used often (hot data, active pipelines)","Milliseconds","None","No"],
 ["S3 Intelligent-Tiering","Access pattern is <b>unknown or changes</b>","Milliseconds (optional archive tiers: minutes to hours)","None (small monthly monitoring fee per object)","No"],
 ["S3 Standard-IA","Used rarely, but must be available instantly (e.g. monthly reports, backups)","Milliseconds","30 days; objects billed as at least 128 KB","Yes, per GB"],
 ["S3 One Zone-IA","Rarely used data you can <b>re-create</b> if lost; stored in <b>one AZ</b> only","Milliseconds","30 days; at least 128 KB","Yes, per GB"],
 ["S3 Glacier Instant Retrieval","Archive read about once a quarter, but needed instantly","Milliseconds","90 days; at least 128 KB","Yes, higher"],
 ["S3 Glacier Flexible Retrieval","Archive read once or twice a year","Expedited 1–5 minutes; Standard 3–5 hours; Bulk 5–12 hours","90 days","Depends on speed"],
 ["S3 Glacier Deep Archive","Kept for years for compliance, almost never read. Cheapest","Standard within 12 hours; Bulk within 48 hours","180 days","Yes"]])}
<p>There is also <b>S3 Express One Zone</b>: a high-performance class in a single AZ with single-digit-millisecond access, stored in special “directory buckets”. It's for very hot data used by analytics and ML jobs in the same AZ.</p>
<h2>Two rules that catch people out</h2>
<ul>
<li><b>Minimum storage duration:</b> if you delete or move an object from Standard-IA after 10 days, you are still charged for 30 days. For Glacier Flexible it's 90 days, for Deep Archive 180 days.</li>
<li><b>Minimum billable size:</b> IA classes and Glacier Instant Retrieval charge small objects as if they were 128 KB. Millions of tiny files in IA can cost <i>more</i> than in Standard.</li>
</ul>
<h2>Reading archived data</h2>
<p>Objects in <b>Glacier Flexible Retrieval</b> and <b>Glacier Deep Archive</b> can't be read directly. You must first <b>restore</b> them, which creates a temporary readable copy for the number of days you choose. Athena and Glue can't query them until they're restored. <b>Glacier Instant Retrieval</b> objects can be read directly, like Standard.</p>
<h2>How to choose</h2>
<ol>
<li>Is the data used often? → <b>Standard</b>.</li>
<li>Don't know, or it changes? → <b>Intelligent-Tiering</b>. It moves objects to cheaper tiers automatically after 30 and 90 days without access, and back when they're used, with no retrieval fees.</li>
<li>Rarely used but needed instantly? → <b>Standard-IA</b> (or <b>One Zone-IA</b> if it can be re-created).</li>
<li>Archive needed instantly a few times a year? → <b>Glacier Instant Retrieval</b>.</li>
<li>Archive where minutes or hours are fine? → <b>Glacier Flexible Retrieval</b>.</li>
<li>Must be kept for years, hours to days is fine, cheapest possible? → <b>Glacier Deep Archive</b>.</li>
</ol>
${tip("<p>“Unpredictable access, minimise cost, no operational effort” → <b>Intelligent-Tiering</b>.<br>“Keep for 7 years for audit, rarely or never accessed, retrieval within 48 hours is fine” → <b>Glacier Deep Archive</b>.<br>“Infrequent access but data must be available within milliseconds” → <b>Standard-IA</b> or <b>Glacier Instant Retrieval</b>.</p>")}
${trap("<p><b>One Zone-IA</b> keeps data in one AZ. It's wrong for the only copy of important data. Use it only for copies or data you can regenerate (like processed outputs or thumbnails).</p>")}
`,[
 {q:"A company stores data with unpredictable access patterns and wants lower cost with no effort to manage tiers. Which class fits?",o:["S3 Standard","S3 Intelligent-Tiering","S3 One Zone-IA","S3 Glacier Deep Archive"],a:[1],e:"Intelligent-Tiering moves objects between tiers automatically based on use, without retrieval fees."},
