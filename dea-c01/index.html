add("s3","s3-lifecycle","Lifecycle rules, versioning, replication and Object Lock",`
${learn(["Lifecycle rules: moving and deleting objects automatically","Versioning and delete markers","Replication to another bucket: CRR and SRR","Object Lock for data that must not be changed (WORM)"])}
<h2>Lifecycle rules</h2>
<p>A <b>lifecycle rule</b> tells S3 to act on objects automatically as they age. Two kinds of action:</p>
<ul><li><b>Transition:</b> move objects to a cheaper storage class after N days.</li><li><b>Expiration:</b> delete objects after N days.</li></ul>
<p>Rules can apply to the whole bucket or only to objects with a certain <b>prefix</b>, <b>tag</b> or <b>size</b>.</p>
<pre><code>Rule "raw-zone-ageing"   applies to prefix raw/
  after 30 days   → move to S3 Standard-IA
  after 90 days   → move to S3 Glacier Flexible Retrieval
  after 365 days  → delete</code></pre>
<p>Useful clean-up rules for every data lake bucket:</p>
<ul>
<li><b>Abort incomplete multipart uploads</b> after, say, 7 days. Half-finished uploads are invisible but still charged.</li>
<li><b>Delete old (noncurrent) versions</b> after N days in versioned buckets.</li>
<li><b>Remove expired delete markers</b> left after all versions are gone.</li>
</ul>
${key("<p>Objects must stay at least <b>30 days</b> in Standard before a lifecycle rule can move them to Standard-IA or One Zone-IA. Use <b>lifecycle rules</b> when you know the access pattern (e.g. data is rarely used after 30 days). Use <b>Intelligent-Tiering</b> when you don't.</p>")}
<h2>Versioning</h2>
<p>With <b>versioning</b> on, S3 keeps every version of an object instead of overwriting it. Each version gets a version ID.</p>
${simple("<p>Like <b>version history</b> in a Google Doc: every save is kept, and you can go back to any earlier one.</p>")}
<ul>
<li>A bucket starts <b>unversioned</b>. You can <b>enable</b> versioning, and later <b>suspend</b> it, but you can never return to unversioned.</li>
<li><b>Overwrite</b> an object → the old version is kept as a “noncurrent” version.</li>
<li><b>Delete</b> an object normally → S3 adds a <b>delete marker</b>. The object looks gone, but older versions remain. Remove the delete marker to bring the object back.</li>
<li><b>Delete a specific version ID</b> → that version is permanently removed.</li>
<li>Every version is billed, so pair versioning with a lifecycle rule for noncurrent versions.</li>
<li><b>MFA Delete</b> can require an MFA code to permanently delete versions or change versioning settings.</li>
</ul>
<h2>Replication</h2>
<p><b>Replication</b> copies new objects automatically from one bucket to another.</p>
${table(["Type","Full form","Use it for"],[
 ["CRR","Cross-Region Replication","Disaster recovery in another Region, lower latency for users elsewhere, compliance needing a copy far away"],
 ["SRR","Same-Region Replication","Combining logs from many buckets, copying production data to a test account, keeping a copy in another account while staying in the same Region (useful for data sovereignty)"]])}
<p>Rules to know:</p>
<ul>
<li><b>Versioning must be enabled</b> on both the source and destination buckets.</li>
<li>S3 needs an <b>IAM role</b> allowed to read the source and write the destination.</li>
<li>Only objects created <b>after</b> the rule is turned on are copied. To copy existing objects, use <b>S3 Batch Replication</b>.</li>
<li>Replication isn't chained: objects replicated from bucket A to B are not passed on again from B to C.</li>
<li>Delete markers can optionally be replicated; deletes of specific versions never are (to protect against malicious deletes).</li>
<li>You can change the storage class or owner of the copies.</li>
<li><b>RTC</b> (Replication Time Control) guarantees 99.99% of objects are copied within 15 minutes, for strict requirements.</li>
</ul>
<h2>Object Lock (WORM)</h2>
<p><b>Object Lock</b> stops objects from being deleted or overwritten for a set time. This is called <b>WORM</b>: Write Once, Read Many. It needs versioning and is used for financial, medical and legal records that regulations say must not be changed.</p>
${table(["Setting","What it does"],[
 ["Retention period","The object version can't be deleted or changed until this date"],
 ["Governance mode","Most users can't delete or change it, but users with a special permission can override the lock"],
 ["Compliance mode","<b>Nobody</b>, not even the root user, can delete it or shorten the retention until it ends"],
 ["Legal hold","Locks the object with no end date until someone with permission removes the hold (for example during a lawsuit)"]])}
${tip("<p>“Move logs to cheaper storage after 30 days and delete after 1 year” → <b>lifecycle rule</b>.<br>“Protect against accidental deletes or overwrites” → <b>versioning</b> (plus MFA Delete).<br>“Copy data to another Region for disaster recovery” → <b>CRR</b>.<br>“Records must not be deleted by anyone, including administrators, for 7 years” → <b>Object Lock in Compliance mode</b>.</p>")}
`,[
 {q:"Logs are queried often for 30 days, rarely after that, and must be deleted after 1 year. What is the simplest solution?",o:["A Lambda function that moves files nightly","An S3 lifecycle rule: transition to Standard-IA after 30 days, expire after 365 days","Manual deletion every year","Intelligent-Tiering with no expiration"],a:[1],e:"Lifecycle rules handle known age-based patterns with no code."},
 {q:"A user deleted an important file from a versioned bucket. How can it be recovered?",o:["It can't be recovered","Delete the delete marker to restore the latest version","Restore from Glacier","Enable versioning now"],a:[1],e:"A normal delete in a versioned bucket only adds a delete marker; removing it brings the object back."},
 {q:"S3 Cross-Region Replication was configured, but files uploaded last month were not copied. Why?",o:["CRR copies only objects created after the rule is enabled; use S3 Batch Replication for existing ones","CRR only works within one Region","Versioning must be off","The files are too small"],a:[0],e:"Replication applies to new objects. Existing objects need S3 Batch Replication."},
 {q:"Regulations require records that no one, including the root user, can delete for 7 years. Which setting fits?",o:["Versioning","Object Lock in Governance mode","Object Lock in Compliance mode","A lifecycle rule"],a:[2],e:"Compliance mode can't be overridden by anyone until the retention period ends."},
 {q:"What must be enabled on both buckets before configuring replication?",o:["Object Lock","Versioning","Transfer Acceleration","Requester Pays"],a:[1],e:"S3 replication requires versioning on the source and destination buckets."}
]);

add("s3","s3-performance","S3 performance and useful features",`
${learn(["How many requests per second S3 handles, and why prefixes matter","Multipart upload and byte-range fetches","Transfer Acceleration","Event notifications to start pipelines","Batch Operations, Inventory and Storage Lens","Requester Pays and presigned URLs"])}
<h2>Request rates and prefixes</h2>
<p>S3 handles at least <b>3,500 write requests</b> (PUT, COPY, POST, DELETE) and <b>5,500 read requests</b> (GET, HEAD) <b>per second, per prefix</b>. There's no limit on the number of prefixes, so spreading objects across prefixes multiplies the limit: 10 prefixes can support 55,000 reads per second.</p>
<p>When traffic jumps suddenly, S3 scales automatically, but you may briefly see <b>503 Slow Down</b> errors. Clients should <b>retry with exponential backoff</b> (wait a little longer before each retry).</p>
<p>Partitioned data lakes spread data across many prefixes naturally, which helps.</p>
<h2>Multipart upload</h2>
<p>Large files are split into parts that upload <b>in parallel</b>. If one part fails, only that part is retried.</p>
<ul>
<li>Up to 10,000 parts; each part 5 MB to 5 GB (the last part can be smaller).</li>
<li><b>Required</b> for objects over 5 GB; recommended over about 100 MB.</li>
<li>Unfinished multipart uploads are still charged until removed, so add a lifecycle rule to abort them after a few days.</li>
</ul>
<p>The opposite direction is a <b>byte-range fetch</b>: download different byte ranges of one object in parallel, or read just the part you need (for example only a file's header or a Parquet footer).</p>
<h2>Transfer Acceleration</h2>
<p><b>S3 Transfer Acceleration</b> speeds up uploads from far away. Your data goes to the nearest AWS <b>edge location</b>, then travels over AWS's own fast network to the bucket's Region. Use it when users or offices upload large files over long distances. It costs extra per GB.</p>
<h2>Event notifications: starting a pipeline when a file lands</h2>
<p>S3 can send an event when something happens to an object: created, deleted, restored from Glacier, replicated, and so on. Filter by prefix and suffix, e.g. only <code>raw/orders/</code> and only <code>.csv</code>.</p>
${table(["Destination","Use"],[
 ["Lambda","Run a small piece of code for each new file"],
 ["SQS (Simple Queue Service)","Queue the events so a consumer processes them at its own pace"],
 ["SNS (Simple Notification Service)","Fan out one event to many subscribers"],
 ["EventBridge","Send <b>all</b> S3 events to EventBridge for advanced filtering, many targets (Step Functions, Glue workflows…), archiving and replay"]])}
${simple("<p>Event notifications are like a <b>doorbell</b>. Instead of checking the front door every five minutes to see if a parcel has arrived (polling), the bell rings when it does, and your pipeline starts.</p>")}
<h2>Working with millions of objects</h2>
${table(["Feature","What it does","Use when"],[
 ["S3 Inventory","Produces a daily or weekly list of all objects and their properties (size, storage class, encryption, replication status) as CSV, ORC or Parquet","You need to audit or find objects in a huge bucket; query the list with Athena instead of listing the bucket"],
 ["S3 Batch Operations","Performs one action on millions or billions of objects from a list: copy, replace tags, restore from Glacier, run a Lambda on each, set Object Lock, replicate existing objects","Bulk changes to existing objects"],
 ["S3 Storage Lens","Dashboards of storage usage and activity across all buckets and accounts, with recommendations","Organisation-wide cost and usage visibility"],
 ["Storage Class Analysis","Watches how often objects are read to suggest when to move them to Standard-IA","Deciding lifecycle transition days"]])}
<h2>Sharing data</h2>
<ul>
<li><b>Requester Pays:</b> the person downloading pays for the requests and data transfer instead of the bucket owner. Good for sharing large datasets with other companies.</li>
<li><b>Presigned URL:</b> a link that gives temporary access to one object (for example for 15 minutes), using the permissions of whoever created the link. Good for letting someone download or upload one file without giving them AWS access.</li>
<li><b>Access Points:</b> named entry points to a bucket, each with its own policy, which simplifies access for many teams (Week 8).</li>
</ul>
${tip("<p>“Upload very large files faster and more reliably” → <b>multipart upload</b>.<br>“Uploads from distant offices are slow” → <b>Transfer Acceleration</b>.<br>“Start processing as soon as a file arrives” → <b>S3 event notification</b> (to Lambda, SQS or EventBridge).<br>“Change tags or restore millions of existing objects” → <b>S3 Batch Operations</b>.<br>“503 Slow Down errors” → retry with backoff and spread keys across more prefixes.</p>")}
`,[
 {q:"An application gets 503 Slow Down errors when reading many objects under one prefix. What helps? (Choose TWO)",o:["Spread objects across more prefixes","Retry with exponential backoff","Move objects to Glacier","Turn off versioning","Use a single larger object for everything"],a:[0,1],e:"Limits apply per prefix, so more prefixes raise total throughput; backoff retries handle temporary throttling while S3 scales."},
 {q:"A 20 GB file must be uploaded to S3. What is required?",o:["A single PUT request","Multipart upload","Transfer Acceleration","Requester Pays"],a:[1],e:"A single PUT is limited to 5 GB, so larger objects must use multipart upload."},
 {q:"A pipeline must start automatically whenever a new CSV file lands in raw/orders/. What is the simplest trigger?",o:["A person checking the bucket","S3 event notification filtered on prefix and suffix","S3 Inventory","S3 Storage Lens"],a:[1],e:"Event notifications fire on object creation and can filter by prefix and suffix."},
 {q:"You must add a tag to 300 million existing objects. Which feature fits?",o:["Lifecycle rules","S3 Batch Operations","Transfer Acceleration","Presigned URLs"],a:[1],e:"Batch Operations runs one action across a list of existing objects at massive scale."},
 {q:"An external partner needs to download one report for the next hour without an AWS account. What do you give them?",o:["Your access keys","A presigned URL","A public bucket","An IAM user"],a:[1],e:"A presigned URL grants temporary access to a single object."}
]);

/* ---------- state ---------- */
const STORE="dea-hub-v1";
let state={done:{},scores:{}};
try{const s=JSON.parse(localStorage.getItem(STORE)||"null");if(s&&s.done)state=s;}catch(e){}
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}};
const ready=PAGES.filter(p=>p.ready&&!p.noDone);
const navable=PAGES.filter(p=>p.ready);

/* ---------- sidebar ---------- */
const tree=document.getElementById("tree");
function renderTree(filter=""){
  const f=filter.trim().toLowerCase();
  tree.innerHTML=MODULES.map(m=>{
    const items=PAGES.filter(p=>p.mod===m.id&&(!f||p.title.toLowerCase().includes(f)));
    if(!items.length)return"";
    return`<div class="mod"><h4>${m.name}<small>${m.week}</small></h4>${items.map(p=>
      `<a href="#${p.id}" data-id="${p.id}" class="${p.ready?"":"soon"}"><span class="d">${state.done[p.id]?"✓":""}</span>${p.title}</a>`).join("")}</div>`;
  }).join("")||`<p style="padding:0 16px;color:var(--muted)">No topics match.</p>`;
  markActive();
}
function markActive(){const id=current();tree.querySelectorAll("a").forEach(a=>a.classList.toggle("on",a.dataset.id===id));}
function updateProgress(){
  const n=ready.filter(p=>state.done[p.id]).length;
  document.getElementById("progTxt").textContent=`${n}/${ready.length}`;
  document.getElementById("barFill").style.width=(n/ready.length*100)+"%";
}

/* ---------- page ---------- */
const current=()=>{const h=location.hash.slice(1);return PAGES.some(p=>p.id===h)?h:"home";};
const page=document.getElementById("page");
function render(){
  hidePop();
  const id=current(), p=PAGES.find(x=>x.id===id), mod=MODULES.find(m=>m.id===p.mod);
  const idx=navable.indexOf(p);
  let html=`<div class="crumb">${mod.name}${mod.week?" · "+mod.week:""}</div><h1>${p.title}</h1>`;
  if(!p.ready){
    html+=`<p>This lesson is planned for <b>${mod.week}</b>. It will cover: ${p.summary}</p><p>It will be written in the same step-by-step style as Week 1, with every abbreviation explained.</p>`;
  }else{
    html+=p.body;
    if(p.quiz.length) html+=quizHTML(p);
    if(!p.noDone) html+=`<button class="done-btn ${state.done[id]?"is":""}" id="doneBtn">${state.done[id]?"✓ Marked as done":"Mark this page as done"}</button>`;
    const prev=navable[idx-1], next=navable[idx+1];
    html+=`<div class="foot">${prev?`<a class="nav" href="#${prev.id}"><small>Previous</small>${prev.title}</a>`:"<span></span>"}${next?`<a class="nav nx" href="#${next.id}"><small>Next</small>${next.title}</a>`:""}</div>`;
  }
  page.innerHTML=html;
  if(id==="home") document.getElementById("modCards").innerHTML=MODULES.filter(m=>m.id!=="start").map(m=>{
    const ps=PAGES.filter(x=>x.mod===m.id), r=ps.filter(x=>x.ready).length, first=ps[0];
    return`<a class="card ${r?"":"soon"}" href="#${first.id}"><b>${m.name}</b><span>${m.week} · ${r?`${r} lessons ready`:`${ps.length} lessons coming`}</span></a>`;
  }).join("");
  if(id==="glossary") renderGlossary("");
  const db=document.getElementById("doneBtn");
  if(db) db.onclick=()=>{state.done[id]=!state.done[id];save();render();renderTree(document.getElementById("search").value);updateProgress();};
  if(p.ready&&p.quiz.length) wireQuiz(p);
  if(id!=="glossary") linkTerms(page);
  markActive(); window.scrollTo(0,0); document.title="DEA-C01 Study Hub";
}

function renderGlossary(f){
  const q=f.trim().toLowerCase();
  const list=GLOSSARY.filter(([t,full,m])=>!q||t.toLowerCase().includes(q)||full.toLowerCase().includes(q)||m.toLowerCase().includes(q))
    .sort((a,b)=>a[0].toLowerCase().localeCompare(b[0].toLowerCase()));
  let html="",letter="";
  list.forEach(([t,full,m])=>{const L=t[0].toUpperCase();if(L!==letter){letter=L;html+=`<h3>${L}</h3>`;}
    html+=`<div class="g" id="g-${t.replace(/[^A-Za-z0-9]/g,"_")}"><b>${t}</b>${full!=="—"?`<span class="f">${full}</span>`:""}<p>${m}</p></div>`;});
  document.getElementById("glList").innerHTML=html||`<div class="g"><p>No term matches “${f}”. Try a shorter word.</p></div>`;
  const s=document.getElementById("glSearch");
  if(s&&!s.dataset.w){s.dataset.w=1;s.addEventListener("input",e=>renderGlossary(e.target.value));}
}

function quizHTML(p){
  const best=state.scores[p.id];
  return`<section class="quiz"><h2>Check yourself</h2><p>${p.quiz.length} questions. ${best!=null?`<span class="score">Best score: ${best}/${p.quiz.length}</span>`:"Choose an answer, then press Check."}</p>`+
  p.quiz.map((q,i)=>{const multi=q.a.length>1;return`<div class="q" data-i="${i}"><p class="stem"><span class="n">${i+1}.</span>${q.q}${multi?` <span class="pill">Choose ${q.a.length}</span>`:""}</p>`+
    q.o.map((o,j)=>`<label class="opt"><input id="q-${p.id}-${i}-${j}" type="${multi?"checkbox":"radio"}" name="q-${p.id}-${i}" value="${j}"><span>${o}</span></label>`).join("")+
    `<button class="qbtn" disabled>Check</button><div class="why" hidden></div></div>`;}).join("")+`<p class="score" id="tally" hidden></p></section>`;
}
function wireQuiz(p){
  const res={};
  page.querySelectorAll(".q").forEach(el=>{
    const i=+el.dataset.i, q=p.quiz[i], btn=el.querySelector(".qbtn"), inputs=[...el.querySelectorAll("input")];
    inputs.forEach(inp=>inp.onchange=()=>{btn.disabled=!inputs.some(x=>x.checked);});
    btn.onclick=()=>{
      const picked=inputs.filter(x=>x.checked).map(x=>+x.value).sort(), want=[...q.a].sort();
      const ok=picked.length===want.length&&picked.every((v,k)=>v===want[k]);
      inputs.forEach((x,j)=>{x.disabled=true;const lab=x.closest(".opt");
        if(q.a.includes(j))lab.classList.add("right");else if(x.checked)lab.classList.add("wrong");});
      const w=el.querySelector(".why");w.hidden=false;
      w.innerHTML=`${ok?"<b>Correct.</b>":"<b class='x'>Not quite.</b>"} ${q.e}`;
      btn.hidden=true;res[i]=ok;
      if(Object.keys(res).length===p.quiz.length){
        const sc=Object.values(res).filter(Boolean).length,t=document.getElementById("tally");
        t.hidden=false;t.textContent=`You scored ${sc} out of ${p.quiz.length}.`;
        if(state.scores[p.id]==null||sc>state.scores[p.id]){state.scores[p.id]=sc;save();}
      }
    };
  });
}

/* ---------- term popover ---------- */
const pop=document.getElementById("pop");
function showPop(k,label){
  const g=k==="__demo"?{t:"Like this",f:"Tap any dotted word",m:"You'll see its full form and a plain-English meaning here."}:GMAP[k];
  if(!g)return;
  document.getElementById("popT").textContent=k==="__demo"?g.t:label||g.t;
  document.getElementById("popF").textContent=g.f==="—"?"Key term":g.f;
  document.getElementById("popM").textContent=g.m;
  pop.hidden=false;
}
function hidePop(){pop.hidden=true;}
document.addEventListener("click",e=>{
  const b=e.target.closest(".gl");
  if(b){e.preventDefault();showPop(b.dataset.k,b.textContent);return;}
  if(!e.target.closest(".pop"))hidePop();
});
document.getElementById("popX").onclick=hidePop;
document.getElementById("popAll").onclick=()=>hidePop();
document.addEventListener("keydown",e=>{if(e.key==="Escape")hidePop();});

/* ---------- mobile drawer + search ---------- */
const side=document.getElementById("side"),mb=document.getElementById("menuBtn");
mb.onclick=()=>{const o=side.classList.toggle("open");mb.setAttribute("aria-expanded",o);};
tree.addEventListener("click",e=>{if(e.target.closest("a")){side.classList.remove("open");mb.setAttribute("aria-expanded","false");}});
document.getElementById("search").addEventListener("input",e=>renderTree(e.target.value));

window.addEventListener("hashchange",render);
renderTree();updateProgress();render();
