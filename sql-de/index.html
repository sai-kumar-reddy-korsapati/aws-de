L('what-is-sql','What is SQL?',`
<p>Everything generates data: your name, your phone, your car, your bank statements. People keep personal data in spreadsheets and text files; companies generate far too much for that, so they store it in a <b>database</b> — a container that stores data in an <i>organized</i> way so it is easy to access, manage and search.</p>
<p><b>SQL</b> (Structured Query Language, pronounced "S-Q-L" or "sequel" — both are fine) is the language you use to <b>talk to a database</b>. You ask a question in SQL, the database answers with a result.</p>
<h2>Why databases instead of files?</h2>
<div class="tw"><table class="t"><tr><th>Files / spreadsheets</th><th>Database</th></tr>
<tr><td>To answer "total spending" you open every file, search and combine by hand</td><td>Ask one question in SQL, get one answer</td></tr>
<tr><td>Break with large data</td><td>Handle millions or billions of rows</td></tr>
<tr><td>Weak access control</td><td>Secure: you control who accesses what</td></tr></table></div>
<h2>Database, DBMS, Server</h2>
<p>In a company, many things talk to the database at once: people writing SQL, applications and websites sending SQL, and BI tools (Power BI, Tableau) whose dashboards generate SQL. Something has to manage all those requests.</p>
<div class="tw"><table class="t"><tr><th>Term</th><th>What it is</th><th>Analogy</th></tr>
<tr><td><b>Database</b></td><td>Container that stores the data</td><td>The warehouse</td></tr>
<tr><td><b>SQL</b></td><td>Language to talk to the database</td><td>The language you order in</td></tr>
<tr><td><b>DBMS</b> (Database Management System)</td><td>Software that manages the database: prioritises and executes requests, enforces security (e.g. SQL Server, PostgreSQL, MySQL, Oracle)</td><td>The manager</td></tr>
<tr><td><b>Server</b></td><td>The powerful machine, online 24/7, where the database lives — on-premises or in the cloud</td><td>The building</td></tr></table></div>
<h2>Why learn SQL?</h2>
<ol><li><b>Talk to data</b> — most companies store data in databases; SQL is the standard way to reach it.</li>
<li><b>High demand</b> — almost every data engineer, analyst, scientist and developer job description asks for SQL.</li>
<li><b>Industry standard</b> — Power BI, Tableau, Spark, Kafka, Synapse, Athena, Redshift, Snowflake, Databricks all accept SQL.</li></ol>
<details class="iq"><summary>Interview: What is the difference between SQL and a DBMS?</summary><p>SQL is a <i>language</i> (a declarative standard for querying and manipulating relational data). A DBMS is the <i>software</i> that stores data and executes SQL — SQL Server, PostgreSQL, MySQL. Each DBMS implements standard SQL plus its own dialect (T-SQL for SQL Server, PL/pgSQL for Postgres).</p></details>
<details class="iq"><summary>Interview: SQL is called "declarative". What does that mean?</summary><p>You describe <i>what</i> result you want, not <i>how</i> to get it. The database's query optimizer decides the how — which index to use, which join algorithm, in which order — and records it as an execution plan.</p></details>
`);
L('db-types','Types of Databases',`
<p>Databases differ in how they organize data. Data engineers meet all five in practice.</p>
<div class="tw"><table class="t"><tr><th>Type</th><th>How data is organized</th><th>Good for</th><th>Examples</th></tr>
<tr><td><b>Relational (SQL)</b></td><td>Tables of rows and columns, linked by keys (relationships)</td><td>Structured business data, transactions</td><td>SQL Server, MySQL, PostgreSQL, Oracle</td></tr>
<tr><td><b>Key-Value</b></td><td>Pairs of key → value, like a dictionary</td><td>Caching, sessions, fast lookups</td><td>Redis, Amazon DynamoDB</td></tr>
<tr><td><b>Column-based</b></td><td>Data stored and grouped by column instead of by row</td><td>Huge data, fast search and analytics</td><td>Cassandra, Amazon Redshift</td></tr>
<tr><td><b>Graph</b></td><td>Nodes and relationships</td><td>Connections: social networks, fraud, recommendations</td><td>Neo4j</td></tr>
<tr><td><b>Document</b></td><td>Whole documents (JSON-like); structure is flexible</td><td>Semi-structured data, fitting everything on one "page"</td><td>MongoDB</td></tr></table></div>
<p>Key-value, column, graph and document databases are grouped as <b>NoSQL</b>. Relational databases are <b>SQL databases</b> — the focus of this guide.</p>
<div class="box tip"><b class="lbl">Data-engineering angle</b>"Column-based" storage is why warehouses (Redshift, Snowflake, BigQuery) and file formats (Parquet, ORC) are fast for analytics: a query reads only the columns it needs. You will see the same idea again as the <a href="#idx-columnstore">columnstore index</a>.</div>
<details class="iq"><summary>Interview: OLTP vs OLAP?</summary><p><b>OLTP</b> (online transaction processing) — application databases: many small reads and writes, normalized tables, row storage (banking, e-commerce). <b>OLAP</b> (online analytical processing) — warehouses/lakes: few large read queries aggregating millions of rows, denormalized star schemas, columnar storage. Data engineers move data from OLTP sources into OLAP systems.</p></details>
`);
L('db-structure','Database Structure & Data Types',`
<p>Relational databases are strictly organized as a hierarchy:</p>
<div class="flow"><span>Server</span><i>→</i><span>Database</span><i>→</i><span>Schema</span><i>→</i><span>Table / View</span><i>→</i><span>Columns &amp; Rows</span></div>
<ul>
<li><b>Server</b> hosts many databases (e.g. <code>SalesDB</code>, <code>HR</code>).</li>
<li><b>Schema</b> — a logical container to group related objects, e.g. all order tables under <code>Orders</code>, customer tables under <code>Customers</code>. In SalesDB every table lives in schema <code>Sales</code> (<code>Sales.Orders</code>). If you don't name one, SQL Server uses the default <code>dbo</code>.</li>
<li><b>Table</b> — like a spreadsheet. <b>Columns</b> (fields) define what is stored; <b>rows</b> (records) hold the data; a single value at the intersection is a <b>cell</b>.</li>
<li><b>Primary key</b> — a column (or set) that uniquely identifies each row, like a fingerprint. Used to find rows fast and to join tables.</li></ul>
<h2>Common data types</h2>
<div class="tw"><table class="t"><tr><th>Type</th><th>Stores</th><th>Example</th></tr>
<tr><td><code>INT</code></td><td>Whole numbers</td><td>1, 2, 30</td></tr>
<tr><td><code>DECIMAL(p,s)</code> / <code>FLOAT</code></td><td>Numbers with decimals (DECIMAL is exact — use it for money)</td><td>3.14</td></tr>
<tr><td><code>CHAR(n)</code></td><td>Fixed-length text: always reserves n characters</td><td>Country code 'DE'</td></tr>
<tr><td><code>VARCHAR(n)</code> / <code>NVARCHAR(n)</code></td><td>Variable-length text (NVARCHAR = Unicode)</td><td>'Maria'</td></tr>
<tr><td><code>DATE</code>, <code>TIME</code>, <code>DATETIME2</code></td><td>Dates, times, both</td><td>2025-08-20</td></tr>
<tr><td><code>BIT</code></td><td>0 / 1 flags</td><td>is_active</td></tr></table></div>
<details class="iq"><summary>Interview: CHAR vs VARCHAR?</summary><p>CHAR(n) is fixed length — padded to n, slightly faster for truly fixed codes. VARCHAR(n) stores only the characters used plus a small length overhead — better for names, addresses. Use NVARCHAR when you need Unicode (non-Latin scripts).</p></details>
<details class="iq"><summary>Interview: Primary key vs unique key vs foreign key?</summary><p><b>Primary key</b>: unique + NOT NULL, one per table, by default the clustered index in SQL Server. <b>Unique key</b>: unique values, allows one NULL in SQL Server, several per table. <b>Foreign key</b>: a column referencing another table's primary key, enforcing referential integrity (you can't insert an order for a customer that doesn't exist).</p></details>
`);
L('sql-commands','SQL Command Families',`
<p>SQL commands are grouped by what they do. Imagine an empty database:</p>
<div class="tw"><table class="t"><tr><th>Family</th><th>Purpose</th><th>Commands</th><th>Returns</th></tr>
<tr><td><b>DDL</b> — Data Definition Language</td><td>Define the <i>structure</i></td><td><code>CREATE</code>, <code>ALTER</code>, <code>DROP</code> (+ <code>TRUNCATE</code>)</td><td>A message</td></tr>
<tr><td><b>DML</b> — Data Manipulation Language</td><td>Change the <i>data</i> inside tables</td><td><code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code> (+ <code>MERGE</code>)</td><td>"n rows affected"</td></tr>
<tr><td><b>DQL</b> — Data Query Language</td><td>Read / ask questions</td><td><code>SELECT</code></td><td>Data (a result set)</td></tr>
<tr><td><b>DCL</b> — Data Control Language</td><td>Permissions</td><td><code>GRANT</code>, <code>REVOKE</code>, <code>DENY</code></td><td>A message</td></tr>
<tr><td><b>TCL</b> — Transaction Control Language</td><td>Group changes into all-or-nothing units</td><td><code>BEGIN TRAN</code>, <code>COMMIT</code>, <code>ROLLBACK</code>, <code>SAVE</code></td><td>A message</td></tr></table></div>
<p>The course covers DDL, DML and DQL; DCL and TCL are added here because interviewers ask about them.</p>
@@tsql Transactions (TCL) — all or nothing
BEGIN TRANSACTION;
  UPDATE Sales.Accounts SET Balance = Balance - 100 WHERE AccountID = 1;
  UPDATE Sales.Accounts SET Balance = Balance + 100 WHERE AccountID = 2;
COMMIT;      -- or ROLLBACK; to undo both
@@
<details class="iq"><summary>Interview: What does ACID mean?</summary><p><b>Atomicity</b> — a transaction fully succeeds or fully fails. <b>Consistency</b> — it moves the database from one valid state to another (constraints hold). <b>Isolation</b> — concurrent transactions don't see each other's partial work. <b>Durability</b> — once committed, it survives crashes (written to the log).</p></details>
<details class="iq"><summary>Interview: Is TRUNCATE DDL or DML?</summary><p>It is classified as DDL: it deallocates data pages instead of deleting row by row, logs minimally, resets identity seeds and can't take a WHERE clause. DELETE is DML. See <a href="#delete-truncate">DELETE &amp; TRUNCATE</a>.</p></details>
`);

C('query','2 · Querying Data','SELECT, WHERE, ORDER BY, GROUP BY, HAVING, DISTINCT, TOP and execution order');
L('select','SELECT & FROM',`
<p>A <b>query</b> is a <code>SELECT</code> statement that <i>reads</i> data. It never changes data or structure. Each part of a query is a <b>clause</b>; the simplest query needs two: <code>SELECT</code> (which columns) and <code>FROM</code> (which table).</p>
@@sql
SELECT column1, column2   -- or * for all columns
FROM table_name
@@
<p>SQL executes <code>FROM</code> first (fetch the table), then <code>SELECT</code> (keep the listed columns).</p>
@@run Retrieve all customer data
SELECT *
FROM my_customers;
@@
@@run Retrieve each customer's name, country and score
SELECT
    first_name,
    country,
    score
FROM my_customers;
@@
<div class="box warn"><b class="lbl">Common error</b>A comma after the last column (<code>score,</code> before <code>FROM</code>) causes a syntax error — SQL expects another column.</div>
<h2>Comments, USE, multiple queries, static values</h2>
@@tsql
USE MyDatabase;            -- switch to the right database first
-- single-line comment
/* multi-line
   comment */
SELECT * FROM customers;   -- semicolons separate multiple queries (required in many DBs)
SELECT * FROM orders;
@@
@@run Static values mixed with table data
SELECT id, first_name, 'New Customer' AS customer_type, 123 AS static_number
FROM my_customers;
@@
<div class="box tip"><b class="lbl">Tip</b>In SSMS you can highlight part of the script and execute only the highlighted part — handy for testing a sub-query or one statement.</div>
<div class="box note"><b class="lbl">Best practice</b>Avoid <code>SELECT *</code> in production code: list only the columns you need. It reads less data and doesn't break when someone adds or reorders columns.</div>
@@ex Retrieve the order_id and sales of every order from my_orders.
SELECT order_id, sales FROM my_orders;
@@
`);
L('where','WHERE — Filter Rows',`
<p><code>WHERE</code> filters rows on a <b>condition</b>. SQL tests every row; rows where the condition is true stay, the rest are removed. It runs right after <code>FROM</code>.</p>
@@sql
SELECT columns FROM table WHERE condition
@@
@@run Customers with a score not equal to 0
SELECT * FROM my_customers WHERE score != 0;
@@
@@run Customers from Germany — text values go in single quotes
SELECT first_name, country
FROM my_customers
WHERE country = 'Germany';
@@
<p>Numbers can be written bare; text (strings) must be in single quotes. Filtering columns (SELECT) and rows (WHERE) together gives you exactly the cells you want.</p>
@@ex Show the first_name and score of customers whose score is greater than 500.
SELECT first_name, score FROM my_customers WHERE score > 500;
@@
`);
L('order-by','ORDER BY — Sort',`
<p><code>ORDER BY column ASC|DESC</code> sorts the result. <code>ASC</code> (lowest first) is the default, but write it anyway — not everyone knows the default.</p>
@@run Customers by highest score first
SELECT * FROM my_customers ORDER BY score DESC;
@@
<h2>Nested sorting</h2>
<p>Sort by several columns: the second column refines the order only where the first column has ties (repeated values). Each column has its own direction, and order matters.</p>
@@run By country, then highest score within each country
SELECT * FROM my_customers ORDER BY country ASC, score DESC;
@@
<div class="box note">Nested sorting only matters when the first column repeats. Sorting by a unique column first makes the second column useless.</div>
@@ex List my_customers sorted by score from lowest to highest.
SELECT * FROM my_customers ORDER BY score ASC;
@@
`);
L('group-by','GROUP BY — Aggregate',`
<p><code>GROUP BY</code> combines rows that share a value into one row and <b>aggregates</b> another column for each group: "total score <i>by</i> country".</p>
@@run Total score and number of customers for each country
SELECT
    country,
    SUM(score)  AS total_score,
    COUNT(id)   AS total_customers
FROM my_customers
GROUP BY country;
@@
<p><code>AS</code> gives an <b>alias</b> — a name that lives only inside this query; it does not rename anything in the database.</p>
<div class="box warn"><b class="lbl">The GROUP BY rule</b>Every column in <code>SELECT</code> must be either <b>aggregated</b> or listed in <b>GROUP BY</b>. <code>SELECT country, first_name, SUM(score) … GROUP BY country</code> fails, because SQL can't know which first_name to show for a group. Adding first_name to the GROUP BY works, but now groups are country+name combinations — the number of output rows equals the number of unique combinations.</div>
@@ex Find the average score per country in my_customers (columns: country, avg_score).
SELECT country, AVG(score) AS avg_score FROM my_customers GROUP BY country;
@@
`);
L('having','HAVING — Filter Groups',`
<p><code>HAVING</code> filters <b>after aggregation</b>; <code>WHERE</code> filters <b>before</b>. HAVING can only be used with GROUP BY and normally tests an aggregate.</p>
@@run Average score per country, ignoring score 0, keeping countries with average &gt; 430
SELECT
    country,
    AVG(score) AS avg_score
FROM my_customers
WHERE score != 0              -- row filter: before grouping
GROUP BY country
HAVING AVG(score) > 430;      -- group filter: after grouping
@@
<div class="tw"><table class="t"><tr><th></th><th>WHERE</th><th>HAVING</th></tr>
<tr><td>Runs</td><td>Before GROUP BY</td><td>After GROUP BY</td></tr>
<tr><td>Filters</td><td>Original rows</td><td>Aggregated groups</td></tr>
<tr><td>Can use aggregates?</td><td>No</td><td>Yes</td></tr></table></div>
<details class="iq"><summary>Interview: Can you use WHERE and HAVING in the same query? What's the difference?</summary><p>Yes. WHERE removes individual rows before they are grouped (cheaper, can use indexes). HAVING removes whole groups after aggregation. Rule of thumb: if the condition doesn't need an aggregate, put it in WHERE.</p></details>
@@ex Show countries whose total score is more than 800 (columns: country, total_score).
SELECT country, SUM(score) AS total_score FROM my_customers GROUP BY country HAVING SUM(score) > 800;
@@
`);
L('distinct','DISTINCT — Remove Duplicates',`
<p><code>SELECT DISTINCT</code> removes duplicate rows so each value (or combination) appears once.</p>
@@run Unique list of countries
SELECT DISTINCT country FROM my_customers;
@@
<div class="box warn"><b class="lbl">Don't use it blindly</b>DISTINCT is an expensive operation (sort or hash). On columns that are already unique (like an id) it does extra work for nothing. Use it only when you actually see duplicates you don't want.</div>
`);
L('top','TOP / LIMIT — Limit Rows',`
<p>Restricts how many rows are returned, based on row position — not on data. SQL Server uses <code>TOP n</code>; MySQL, PostgreSQL, SQLite use <code>LIMIT n</code>.</p>
@@tsql
SELECT TOP 3 * FROM customers ORDER BY score DESC;  -- top 3 by score
@@
@@run Top 3 customers by highest score (portable: LIMIT)
SELECT * FROM my_customers ORDER BY score DESC LIMIT 3;
@@
@@run Two most recent orders
SELECT * FROM my_orders ORDER BY order_date DESC LIMIT 2;
@@
<p>TOP combined with ORDER BY gives <b>Top-N</b> (best) and <b>Bottom-N</b> (worst) analysis. Use it during exploration too, so you don't pull a 100-million-row table to look at 10 rows.</p>
@@ex Retrieve the lowest 2 customers by score.
SELECT * FROM my_customers ORDER BY score ASC LIMIT 2;
@@
`);
L('exec-order','Coding Order vs Execution Order',`
<p>You write clauses in one order; SQL executes them in another. This explains most "why doesn't my alias work?" errors.</p>
@@sql Coding order (must be written like this)
SELECT DISTINCT TOP 2 col1, SUM(col2)
FROM table
WHERE condition
GROUP BY col1
HAVING SUM(col2) > 10
ORDER BY col1
@@
<div class="flow"><span>1 FROM / JOIN</span><i>→</i><span>2 WHERE</span><i>→</i><span>3 GROUP BY</span><i>→</i><span>4 HAVING</span><i>→</i><span>5 SELECT / DISTINCT</span><i>→</i><span>6 ORDER BY</span><i>→</i><span>7 TOP / LIMIT</span></div>
<p>Window functions are evaluated during step 5 (after HAVING). That is why you can't filter on a window function in WHERE.</p>
<h2>Five ways to filter</h2>
<div class="tw"><table class="t"><tr><th>Clause</th><th>Filters</th></tr>
<tr><td>SELECT</td><td>Columns</td></tr><tr><td>DISTINCT</td><td>Duplicate rows</td></tr><tr><td>TOP</td><td>Rows by position (no condition)</td></tr><tr><td>WHERE</td><td>Rows before aggregation</td></tr><tr><td>HAVING</td><td>Rows after aggregation</td></tr></table></div>
<details class="iq"><summary>Interview: Why can I use a column alias in ORDER BY but not in WHERE?</summary><p>Because WHERE runs (step 2) before SELECT (step 5) creates the alias, while ORDER BY runs after SELECT. To filter on a computed alias, repeat the expression or wrap the query in a subquery/CTE.</p></details>
`);
QZ('quiz-query','Quiz: Querying',[
{q:'Which clause executes first?',o:['SELECT','WHERE','FROM','ORDER BY'],a:2},
{q:'You need countries whose AVG(score) > 400. Which clause holds the condition?',o:['WHERE','HAVING','ORDER BY','SELECT'],a:1},
{q:'SELECT country, first_name, SUM(score) FROM t GROUP BY country — what happens?',o:['Works','Error: first_name is neither grouped nor aggregated','Returns one row','Ignores first_name'],a:1},
{q:'Which runs LAST in a query?',o:['HAVING','DISTINCT','ORDER BY','TOP'],a:3},

C('ddl','3 · DDL — Define Structure','CREATE, ALTER, DROP and constraints');
L('create','CREATE TABLE',`
<p>DDL commands change the structure, not the data, and return only a message.</p>
@@run Create a table persons
CREATE TABLE persons (
    id          INT          NOT NULL,
    person_name VARCHAR(50)  NOT NULL,
    birth_date  DATE,                     -- optional: NULL allowed
    phone       VARCHAR(15)  NOT NULL,
    CONSTRAINT pk_persons PRIMARY KEY (id)
);
SELECT * FROM persons;                     -- columns, but no rows yet
@@
<p>For each column define: <b>name</b>, <b>data type</b> (and length), and <b>constraints</b>. Every table should have a <b>primary key</b> for integrity and joins.</p>
<h2>Constraints</h2>
<div class="tw"><table class="t"><tr><th>Constraint</th><th>Rule</th></tr>
<tr><td><code>NOT NULL</code></td><td>Value required</td></tr><tr><td><code>PRIMARY KEY</code></td><td>Unique + not null identifier</td></tr><tr><td><code>UNIQUE</code></td><td>No duplicates</td></tr><tr><td><code>FOREIGN KEY … REFERENCES</code></td><td>Value must exist in another table</td></tr><tr><td><code>CHECK (score &gt;= 0)</code></td><td>Value must satisfy a rule</td></tr><tr><td><code>DEFAULT</code></td><td>Value used when none given</td></tr><tr><td><code>IDENTITY(1,1)</code></td><td>Auto-incrementing number (SQL Server)</td></tr></table></div>
<div class="box tip"><b class="lbl">Tip</b>Lost the CREATE script? In SSMS right-click the table → <i>Script Table as → CREATE To → New Query Editor</i>. Better: keep all DDL in a Git repository.</div>
`);
L('alter-drop','ALTER & DROP',`
@@run Add a column (always appended at the end)
CREATE TABLE persons (id INT NOT NULL PRIMARY KEY, person_name VARCHAR(50) NOT NULL, phone VARCHAR(15));
ALTER TABLE persons ADD email VARCHAR(50);
SELECT * FROM persons;
@@
@@tsql Remove a column — its data is lost too
ALTER TABLE persons DROP COLUMN phone;
@@
<p>A new column always goes to the end. To place it in the middle you must drop and recreate the table (painful when it holds data).</p>
@@sql Drop the whole table — structure and data
DROP TABLE persons;
@@
<div class="box warn"><b class="lbl">Careful</b>DROP is three words and destroys everything. Destroying is always easier than building.</div>
`);

C('dml','4 · DML — Modify Data','INSERT, UPDATE, DELETE, TRUNCATE, MERGE');
L('insert','INSERT',`
<p><code>INSERT</code> adds new rows. Two methods: manual <code>VALUES</code>, or <code>INSERT … SELECT</code> from another table.</p>
@@sql
INSERT INTO table_name (column1, column2, …)
VALUES (value1, value2, …), (value1, value2, …);   -- multiple rows at once
@@
@@run Insert two new customers
INSERT INTO my_customers (id, first_name, country, score)
VALUES (6, 'Anna', 'USA', NULL),
       (7, 'Sam',  NULL,  100);
SELECT * FROM my_customers;
@@
<h2>Rules</h2>
<ul><li>The number of columns and values must match.</li>
<li>Order matters. SQL inserts blindly as long as data types and constraints are satisfied — swap name and country and SQL happily stores a customer called "USA" from "Max". Swap an INT id with text and SQL rejects it.</li>
<li>The column list is optional only if you supply a value for every column in table order (lazy, risky).</li>
<li>You may skip nullable columns; they become NULL. You can't skip NOT NULL columns.</li></ul>
@@run INSERT … SELECT: move data from one table to another
CREATE TABLE persons (id INT NOT NULL, person_name VARCHAR(50) NOT NULL, birth_date DATE, phone VARCHAR(15) NOT NULL);
INSERT INTO persons (id, person_name, birth_date, phone)
SELECT id, first_name, NULL, 'Unknown'      -- shape the source result to match the target
FROM my_customers;
SELECT * FROM persons;
@@
<p>Write the SELECT on the source first, make its result match the target's structure, then put <code>INSERT INTO</code> on top. Column names don't need to match — positions do.</p>
`);
L('update','UPDATE',`
<p><code>UPDATE</code> changes values of existing rows.</p>
@@sql
UPDATE table_name
SET column1 = value1, column2 = value2
WHERE condition;          -- without WHERE, EVERY row is updated!
@@
@@run Change score of customer 6 — test the WHERE with a SELECT first
INSERT INTO my_customers VALUES (6,'Anna','USA',NULL),(10,'Sara',NULL,NULL);
SELECT * FROM my_customers WHERE id = 6;     -- check what will change
UPDATE my_customers SET score = 0 WHERE id = 6;
UPDATE my_customers SET score = 0, country = 'UK' WHERE id = 10;   -- two columns
UPDATE my_customers SET score = 0 WHERE score IS NULL;              -- many rows
SELECT * FROM my_customers;
@@
<div class="box tip"><b class="lbl">Safe habit</b>Copy the WHERE into a <code>SELECT *</code>, check the rows, then run the UPDATE and read the "rows affected" message. Note <code>IS NULL</code>, not <code>= NULL</code>.</div>
`);
L('delete-truncate','DELETE & TRUNCATE',`
@@run Delete customers with id &gt; 5
INSERT INTO my_customers VALUES (6,'Anna','USA',NULL),(7,'Sam',NULL,100);
DELETE FROM my_customers WHERE id > 5;
SELECT * FROM my_customers;
@@
@@tsql Empty a table fast
TRUNCATE TABLE persons;
@@
<div class="tw"><table class="t"><tr><th></th><th>DELETE</th><th>TRUNCATE</th><th>DROP</th></tr>
<tr><td>Removes</td><td>Selected rows (WHERE)</td><td>All rows</td><td>Table + data</td></tr>
<tr><td>Speed on big tables</td><td>Slow — row-by-row, fully logged</td><td>Fast — deallocates pages, minimal logging</td><td>Fast</td></tr>
<tr><td>Table remains</td><td>Yes</td><td>Yes</td><td>No</td></tr>
<tr><td>Identity reset</td><td>No</td><td>Yes</td><td>—</td></tr>
<tr><td>Fires DELETE triggers</td><td>Yes</td><td>No</td><td>No</td></tr>
<tr><td>Family</td><td>DML</td><td>DDL</td><td>DDL</td></tr></table></div>
<details class="iq"><summary>Interview: Can TRUNCATE be rolled back in SQL Server?</summary><p>Yes — inside an explicit transaction (<code>BEGIN TRAN … ROLLBACK</code>) because page deallocations are logged. Outside a transaction it auto-commits like any statement.</p></details>
`);
L('merge','MERGE (Upsert)',`
<p>Not in the course but asked constantly in DE interviews: <code>MERGE</code> combines INSERT, UPDATE and DELETE in one statement by comparing a source to a target — the classic <b>upsert</b> used in incremental loads.</p>
@@tsql Upsert staging data into a dimension (SCD Type 1)
MERGE silver.customers AS tgt
USING bronze.customers_stage AS src
   ON tgt.CustomerID = src.CustomerID
WHEN MATCHED AND (tgt.Country <> src.Country OR tgt.Score <> src.Score) THEN
    UPDATE SET tgt.Country = src.Country, tgt.Score = src.Score
WHEN NOT MATCHED BY TARGET THEN
    INSERT (CustomerID, FirstName, Country, Score)
    VALUES (src.CustomerID, src.FirstName, src.Country, src.Score)
WHEN NOT MATCHED BY SOURCE THEN
    DELETE;                       -- optional: remove rows gone from source
@@
@@run The same upsert in portable SQL (INSERT … ON CONFLICT)
CREATE TABLE stage (id INT, first_name TEXT, country TEXT, score INT);
INSERT INTO stage VALUES (1,'Maria','Germany',999),(6,'Lena','Austria',420);
INSERT INTO my_customers (id, first_name, country, score)
SELECT id, first_name, country, score FROM stage WHERE true
ON CONFLICT(id) DO UPDATE SET country = excluded.country, score = excluded.score;
SELECT * FROM my_customers;
@@
<details class="iq"><summary>Interview: How do you implement an idempotent incremental load?</summary><p>Load new/changed rows (watermark on a modified timestamp, CDC, or EXCEPT-based delta) into a staging table, then MERGE (upsert) into the target on the business key. Re-running the same batch produces the same result because matched rows are updated, not re-inserted. Alternatives: delete-then-insert by partition (e.g. a whole date partition) inside a transaction.</p></details>
`);

C('filter','5 · Filtering Data','Comparison, logical, range, membership and search operators');
L('comparison-ops','Comparison Operators',`
<p>A <b>condition</b> is <i>expression · operator · expression</i>. Each side can be a column, a static value, a function, an expression, or even a whole subquery:</p>
@@sql
WHERE first_name = last_name           -- column vs column
WHERE first_name = 'John'              -- column vs value
WHERE UPPER(first_name) = 'JOHN'       -- function vs value
WHERE price * quantity = 1000          -- expression vs value
WHERE sales > (SELECT AVG(sales) FROM orders)   -- subquery
@@
<div class="tw"><table class="t"><tr><th>Operator</th><th>Meaning</th></tr><tr><td><code>=</code></td><td>Equal</td></tr><tr><td><code>&lt;&gt;</code> or <code>!=</code></td><td>Not equal</td></tr><tr><td><code>&gt;</code> / <code>&gt;=</code></td><td>Greater / greater or equal</td></tr><tr><td><code>&lt;</code> / <code>&lt;=</code></td><td>Less / less or equal</td></tr></table></div>
@@run Customers who are NOT from Germany
SELECT * FROM my_customers WHERE country <> 'Germany';
@@
@@run Customers with a score of 500 or more
SELECT * FROM my_customers WHERE score >= 500;
@@
`);
L('logical-ops','Logical Operators: AND, OR, NOT',`
<ul><li><b>AND</b> — all conditions must be true (restrictive).</li><li><b>OR</b> — at least one condition must be true (relaxed).</li><li><b>NOT</b> — reverses a single condition (true↔false).</li></ul>
@@run From USA AND score &gt; 500
SELECT * FROM my_customers WHERE country = 'USA' AND score > 500;
@@
@@run From USA OR score &gt; 500
SELECT * FROM my_customers WHERE country = 'USA' OR score > 500;
@@
@@run Score NOT less than 500
SELECT * FROM my_customers WHERE NOT score < 500;
@@
<div class="box warn"><b class="lbl">Precedence trap</b><code>NOT</code> binds first, then <code>AND</code>, then <code>OR</code>. <code>WHERE country='USA' OR country='UK' AND score&gt;500</code> means USA (any score) OR (UK with score &gt; 500). Use parentheses whenever you mix AND and OR.</div>
@@ex Find customers from Germany whose score is below 400.
SELECT * FROM my_customers WHERE country = 'Germany' AND score < 400;
@@
`);
L('between','BETWEEN — Range',`
<p><code>BETWEEN low AND high</code> checks whether a value falls inside a range. Both boundaries are <b>inclusive</b>.</p>
@@run Score between 100 and 500
SELECT * FROM my_customers WHERE score BETWEEN 100 AND 500;
@@
@@run Same result — explicit comparison (the course author's preference: the inclusiveness is visible)
SELECT * FROM my_customers WHERE score >= 100 AND score <= 500;
@@
<div class="box warn"><b class="lbl">Date trap</b><code>OrderDate BETWEEN '2025-01-01' AND '2025-01-31'</code> on a DATETIME column misses everything after midnight on the 31st. Prefer <code>&gt;= '2025-01-01' AND &lt; '2025-02-01'</code>.</div>
`);
L('in','IN / NOT IN — Membership',`
<p><code>IN (list)</code> tests whether a value is a member of a list. It replaces chains of OR on the same column — shorter, easier to extend, and usually faster.</p>
@@run Customers from Germany or USA
SELECT * FROM my_customers WHERE country IN ('Germany', 'USA');
@@
@@run Everyone else
SELECT * FROM my_customers WHERE country NOT IN ('Germany', 'USA');
@@
<div class="box warn"><b class="lbl">NULL trap (interview favourite)</b><code>x NOT IN (1, 2, NULL)</code> returns <b>no rows</b>: comparing to NULL is unknown, so the whole NOT IN can never be true. When the list comes from a subquery that may contain NULLs, use <code>NOT EXISTS</code> instead.</div>
`);
L('like','LIKE — Search Patterns',`
<p><code>LIKE</code> searches text with a pattern. Two wildcards:</p>
<div class="tw"><table class="t"><tr><th>Wildcard</th><th>Means</th><th>Pattern</th><th>Matches</th></tr>
<tr><td><code>%</code></td><td>Anything (0, 1 or many characters)</td><td><code>'M%'</code></td><td>Maria, Ma, M — not Emma</td></tr>
<tr><td></td><td></td><td><code>'%in'</code></td><td>Martin, Vin, in — not Jasmine</td></tr>
<tr><td></td><td></td><td><code>'%r%'</code></td><td>Maria, Peter, Ryan — not Alice</td></tr>
<tr><td><code>_</code></td><td>Exactly one character</td><td><code>'__b%'</code></td><td>Albert, Rob — not Abel, An</td></tr></table></div>
@@run First name starts with M
SELECT * FROM my_customers WHERE first_name LIKE 'M%';
@@
@@run 'r' in the third position
SELECT * FROM my_customers WHERE first_name LIKE '__r%';
@@
<div class="box note"><b class="lbl">Performance</b>A leading wildcard (<code>'%gold'</code>) can't use an index — the database must scan. A trailing wildcard (<code>'gold%'</code>) can seek. SQLite's LIKE is case-insensitive; SQL Server depends on the collation (usually case-insensitive).</div>
@@ex Find customers whose first_name ends with 'n'.
SELECT * FROM my_customers WHERE first_name LIKE '%n';
@@
`);

C('joins','6 · Joins','Combine columns from multiple tables: basic, anti and cross joins');
L('combine-overview','Combining Tables: Joins vs Set Operators',`
<p>Two ways to combine tables:</p>
<div class="tw"><table class="t"><tr><th></th><th>JOIN</th><th>Set operators</th></tr>
<tr><td>Combines</td><td><b>Columns</b> side by side — wider result</td><td><b>Rows</b> stacked — longer result</td></tr>
<tr><td>Requirement</td><td>Key column(s) to match on</td><td>Same number of columns, compatible types</td></tr>
<tr><td>Types</td><td>INNER, LEFT, RIGHT, FULL (+ anti joins, CROSS)</td><td>UNION, UNION ALL, EXCEPT, INTERSECT</td></tr></table></div>
<h2>Why join?</h2>
<ol><li><b>Recombine data</b> — customer data is spread over customers, addresses, orders, reviews. Join to see the big picture.</li>
<li><b>Data enrichment</b> — add one extra field (e.g. zip code) from a reference / lookup table to your master table.</li>
<li><b>Check existence</b> — filter one table by whether its rows exist (or don't) in another, without taking any columns from it.</li></ol>
<p>The table in <code>FROM</code> is the <b>left</b> table; the one in <code>JOIN</code> is the <b>right</b> table. Think in three possibilities: matching rows only, all rows of one table, or unmatching rows only.</p>
{{venn:inner,left,right,full,leftanti,rightanti,fullanti}}
`);
L('inner-join','INNER JOIN',`
<p>Returns only rows that match in <b>both</b> tables. Table order doesn't matter. <code>JOIN</code> alone defaults to INNER, but write <code>INNER</code> explicitly.</p>
{{venn:inner}}
@@sql
SELECT … FROM A INNER JOIN B ON A.key = B.key
@@
@@run Customers with their orders — only customers who placed an order
SELECT c.id, c.first_name, o.order_id, o.sales
FROM my_customers AS c
INNER JOIN my_orders AS o
    ON c.id = o.customer_id;
@@
<h2>How SQL executes it</h2><p>For each customer, SQL looks for orders with the same id. Match → row in output. Customers 4 and 5 have no orders, so they disappear; order 1004 (customer 6) has no customer, so it disappears too.</p>
<div class="box tip"><b class="lbl">Best practices</b><ul style="margin:0"><li>Select only needed columns (don't repeat the key twice).</li><li>Prefix every column with its table — required when names clash (two <code>id</code> columns), and it makes long queries readable.</li><li>Use short table aliases: <code>customers AS c</code>.</li></ul></div>
<p>INNER JOIN is used to recombine data <i>and</i> as a filter (existence check).</p>
`);
L('left-join','LEFT JOIN',`
<p>Returns <b>all</b> rows from the left table and only the matching rows from the right. Where there's no match, right-side columns are <code>NULL</code>. Table order matters.</p>
{{venn:left}}
@@run All customers with their orders, including customers without orders
SELECT c.id, c.first_name, o.order_id, o.sales
FROM my_customers AS c
LEFT JOIN my_orders AS o
    ON c.id = o.customer_id;
@@
<p>SQL copies every left row into the result first, then searches for matches on the right. Martin and Peter get NULLs. Swap the tables and you get a different answer.</p>
<p>LEFT JOIN is the author's (and most analysts') favourite: start from the <b>master table</b> of the analysis, LEFT JOIN every supporting table, and control what survives with WHERE.</p>
`);
L('right-join','RIGHT JOIN',`
<p>The mirror of LEFT JOIN: all rows from the right table, matching rows from the left.</p>
{{venn:right}}
@@run All orders, including orders without a matching customer
SELECT c.id, c.first_name, o.order_id, o.sales
FROM my_customers AS c
RIGHT JOIN my_orders AS o
    ON c.id = o.customer_id;
@@
@@run Same result with LEFT JOIN — just swap the tables
SELECT c.id, c.first_name, o.order_id, o.sales
FROM my_orders AS o
LEFT JOIN my_customers AS c
    ON c.id = o.customer_id;
@@
<div class="box note">Any RIGHT JOIN can be rewritten as a LEFT JOIN by swapping tables. Many teams avoid RIGHT JOIN for readability.</div>
`);
L('full-join','FULL JOIN',`
<p>Returns <b>everything</b> from both tables — matches side by side, unmatched rows padded with NULLs. Order doesn't matter.</p>
{{venn:full}}
@@run All customers and all orders, even without a match
SELECT c.id, c.first_name, o.order_id, o.sales
FROM my_customers AS c
FULL JOIN my_orders AS o
    ON c.id = o.customer_id;
@@
`);
L('anti-joins','Anti Joins: LEFT, RIGHT, FULL',`
<p>There is no ANTI JOIN keyword in SQL Server. Build it in two steps: a normal join, then a <code>WHERE … IS NULL</code> on the <i>other</i> table's key to keep only unmatched rows.</p>
<h2>Left anti join</h2>{{venn:leftanti}}
@@run Customers who haven't placed any order
SELECT c.*
FROM my_customers AS c
LEFT JOIN my_orders AS o ON c.id = o.customer_id
WHERE o.customer_id IS NULL;
@@
<h2>Right anti join</h2>{{venn:rightanti}}
@@run Orders without a matching customer (written as LEFT JOIN, tables swapped)
SELECT o.*
FROM my_orders AS o
LEFT JOIN my_customers AS c ON c.id = o.customer_id
WHERE c.id IS NULL;
@@
<h2>Full anti join</h2>{{venn:fullanti}}
<p>The opposite of an inner join: only rows that don't match on either side.</p>
@@run Customers without orders AND orders without customers
SELECT *
FROM my_customers AS c
FULL JOIN my_orders AS o ON c.id = o.customer_id
WHERE c.id IS NULL OR o.customer_id IS NULL;
@@
<h2>Challenge: inner join without INNER JOIN</h2>
@@run LEFT JOIN + IS NOT NULL behaves like INNER JOIN
SELECT *
FROM my_customers AS c
LEFT JOIN my_orders AS o ON c.id = o.customer_id
WHERE o.customer_id IS NOT NULL;
@@
@@ex Find products that have never been ordered (table products, orders). Return all product columns.
SELECT p.* FROM products p LEFT JOIN orders o ON p.ProductID = o.ProductID WHERE o.OrderID IS NULL;
@@
`);
L('cross-join','CROSS JOIN',`
<p>Combines <b>every</b> row from the left with <b>every</b> row from the right — the Cartesian product. No ON condition. 5 customers × 4 orders = 20 rows.</p>
@@run All combinations of customers and orders
SELECT * FROM my_customers CROSS JOIN my_orders;
@@
<p>Rarely used; useful for generating test data or all combinations, e.g. every product × every colour, or every store × every date (to build a complete calendar grid before a LEFT JOIN to sales).</p>
<div class="box warn">CROSS JOIN on two big tables can explode: 1M × 1M = 10<sup>12</sup> rows.</div>
`);
L('multi-joins','Joining Multiple Tables',`
<p>Task (SalesDB): list every order with the customer name, product name, sales, price and salesperson name.</p>
@@run Start from the main table, LEFT JOIN every supporting table to it
SELECT
    o.OrderID,
    c.FirstName AS CustomerFirstName,
    c.LastName  AS CustomerLastName,
    p.Product   AS ProductName,
    o.Sales,
    p.Price,
    e.FirstName AS SalesPersonFirstName,
    e.LastName  AS SalesPersonLastName
FROM orders AS o
LEFT JOIN customers AS c ON o.CustomerID    = c.CustomerID
LEFT JOIN products  AS p ON o.ProductID     = p.ProductID
LEFT JOIN employees AS e ON o.SalesPersonID = e.EmployeeID;
@@
<ul><li>Use the <b>ER diagram</b> to find join keys (e.g. <code>SalesPersonID</code> → <code>EmployeeID</code> — names differ!).</li><li>Join every table to the main table so all orders are kept.</li><li>Alias duplicate column names (customer vs employee FirstName).</li><li>Wrong join keys produce silently wrong results — double-check them.</li></ul>
<h2>Choosing the right join</h2>
<div class="tw"><table class="t"><tr><th>I want…</th><th>Use</th></tr>
<tr><td>Only matching data</td><td>INNER JOIN</td></tr>
<tr><td>All data, one side is the master</td><td>LEFT JOIN</td></tr>
<tr><td>All data from both, both important</td><td>FULL JOIN</td></tr>
<tr><td>Unmatched data, one side important</td><td>LEFT ANTI JOIN</td></tr>
<tr><td>Unmatched data from both sides</td><td>FULL ANTI JOIN</td></tr>
<tr><td>Every combination</td><td>CROSS JOIN</td></tr></table></div>
<details class="iq"><summary>Interview: A LEFT JOIN returned more rows than the left table had. Why?</summary><p>The right table has duplicate keys (one-to-many). Each left row is repeated once per matching right row. Fix by deduplicating/aggregating the right side first, or check whether the join key is really unique.</p></details>
<details class="iq"><summary>Interview: Filter in ON vs WHERE for a LEFT JOIN?</summary><p>A condition on the right table in <b>ON</b> limits which rows match but keeps all left rows. The same condition in <b>WHERE</b> runs after the join and removes rows where the right side is NULL — it silently turns the LEFT JOIN into an INNER JOIN. For INNER JOIN they are equivalent.</p></details>
<details class="iq"><summary>Interview: What is a self join?</summary><p>Joining a table to itself with two aliases — e.g. employees to their managers: <code>FROM employees e LEFT JOIN employees m ON e.ManagerID = m.EmployeeID</code>.</p></details>
@@ex Show each employee's first name and their manager's first name (columns: Employee, Manager). Include the top boss with a NULL manager.
SELECT e.FirstName AS Employee, m.FirstName AS Manager FROM employees e LEFT JOIN employees m ON e.ManagerID = m.EmployeeID;
@@
@@ex Total sales per product name, including products with no orders (columns: Product, TotalSales — 0 not NULL for no orders).
SELECT p.Product, COALESCE(SUM(o.Sales),0) AS TotalSales FROM products p LEFT JOIN orders o ON p.ProductID = o.ProductID GROUP BY p.Product;
@@
`);
QZ('quiz-joins','Quiz: Joins',[
{q:'Which join keeps all rows from the table in FROM?',o:['INNER','LEFT','RIGHT','CROSS'],a:1},
{q:'How do you build a LEFT ANTI join in SQL Server?',o:['LEFT ANTI JOIN keyword','LEFT JOIN + WHERE right.key IS NULL','INNER JOIN + NOT','EXCEPT JOIN'],a:1},
{q:'customers (5 rows) CROSS JOIN orders (4 rows) returns…',o:['4','5','9','20'],a:3},
{q:'A WHERE condition on the right table after a LEFT JOIN usually…',o:['has no effect','turns it into an inner join','turns it into a full join','causes an error'],a:1},
{q:'Order of tables does NOT matter for…',o:['LEFT JOIN','RIGHT JOIN','INNER and FULL JOIN','anti joins'],a:2}]);

C('sets','7 · Set Operators','UNION, UNION ALL, EXCEPT, INTERSECT and their DE use cases');
L('set-rules','Set Operator Syntax & Rules',`
@@sql
SELECT FirstName, LastName FROM customers
UNION                                    -- or UNION ALL / EXCEPT / INTERSECT
SELECT FirstName, LastName FROM employees
ORDER BY FirstName;                      -- only once, at the very end
@@
<ol><li><b>Clauses</b>: each query may use WHERE, JOIN, GROUP BY, HAVING — but <code>ORDER BY</code> only once, at the end.</li>
<li><b>Same number of columns</b> in every query.</li>
<li><b>Compatible data types</b> column by column.</li>
<li><b>Same column order</b>: SQL maps by position, not by name (LastName, CustomerID vs EmployeeID, LastName → conversion error).</li>
<li>The <b>first query controls column names (aliases) and data types</b>.</li>
<li><b>You</b> must map the correct information. Swapping FirstName and LastName in the second query passes all the rules and produces garbage — SQL doesn't know your content.</li></ol>
`);
L('union','UNION & UNION ALL',`
<p><b>UNION</b> returns all distinct rows from both queries (duplicates removed). <b>UNION ALL</b> returns all rows, duplicates included.</p>
@@run Employees and customers in one list, no duplicates (8 people)
SELECT FirstName, LastName FROM employees
UNION
SELECT FirstName, LastName FROM customers;
@@
@@run Including duplicates (10 people) — Kevin and Mary appear twice
SELECT FirstName, LastName FROM employees
UNION ALL
SELECT FirstName, LastName FROM customers;
@@
<div class="box tip"><b class="lbl">Performance</b>UNION ALL is faster: no duplicate check. Use it when you know there are no duplicates, or when you want to see them (data-quality checks). Using UNION "just in case" costs a sort/hash on every run.</div>
<div class="box warn"><b class="lbl">NULL note</b>UNION treats two NULLs as duplicates of each other (Mary has a NULL last name in both tables and is collapsed to one row).</div>
`);
L('except-intersect','EXCEPT & INTERSECT',`
<p><b>EXCEPT</b> (MINUS in Oracle) returns distinct rows from the first query that are not in the second. It's the only set operator where <b>query order changes the result</b>.</p>
@@run Employees who are not customers
SELECT FirstName, LastName FROM employees
EXCEPT
SELECT FirstName, LastName FROM customers;
@@
<p><b>INTERSECT</b> returns only rows common to both — similar to an inner join, duplicates removed.</p>
@@run Employees who are also customers
SELECT FirstName, LastName FROM employees
INTERSECT
SELECT FirstName, LastName FROM customers;
@@
@@ex List customers (FirstName, LastName) who are not employees.
SELECT FirstName, LastName FROM customers EXCEPT SELECT FirstName, LastName FROM employees;
@@
`);
L('set-usecases','Set Operator Use Cases for Data Engineers',`
<h2>1. Combine similar tables before analysis</h2>
<p>Employees, customers, suppliers, students all hold "persons"; orders may be split by year (orders_2023, orders_2024). Instead of writing the same analysis four times, UNION them into one table/view and analyse once.</p>
@@run Combine orders and the archive — list columns explicitly and tag the source
SELECT 'orders' AS SourceTable, OrderID, ProductID, CustomerID, OrderDate, OrderStatus, Sales
FROM orders
UNION
SELECT 'orders_archive', OrderID, ProductID, CustomerID, OrderDate, OrderStatus, Sales
FROM orders_archive
ORDER BY OrderID;
@@
<div class="box note"><b class="lbl">Best practice</b>Never <code>SELECT *</code> in a union. If someone later reorders a column in one table, star-unions silently mix order IDs and product IDs. Add a <b>source column</b> so analysts can trace each row.</div>
<h2>2. Delta detection (incremental load)</h2>
<p>Compare today's extract to the previous load; <code>EXCEPT</code> gives only the new or changed rows to insert into the warehouse.</p>
@@sql
SELECT * FROM stage_today
EXCEPT
SELECT * FROM stage_yesterday;     -- new + changed rows only
@@
<h2>3. Data completeness checks after migration</h2>
<p>After moving a table from database A to B, run EXCEPT both ways. Both results must be empty for the tables to be identical.</p>
@@sql
SELECT * FROM dbA.dbo.customers EXCEPT SELECT * FROM dbB.dbo.customers;  -- expect 0 rows
SELECT * FROM dbB.dbo.customers EXCEPT SELECT * FROM dbA.dbo.customers;  -- expect 0 rows
@@
<details class="iq"><summary>Interview: UNION vs JOIN?</summary><p>JOIN combines columns side by side based on a key; result is wider. UNION stacks rows from queries with the same column structure; result is longer and needs no key.</p></details>
<details class="iq"><summary>Interview: How would you validate a migrated table?</summary><p>Row counts and checksums first (cheap), then EXCEPT in both directions for exact row equality, plus column-level aggregates (SUM, MIN/MAX of dates, COUNT DISTINCT keys) to locate differences.</p></details>
`);
QZ('quiz-sets','Quiz: Set Operators',[
{q:'Which set operator keeps duplicates?',o:['UNION','UNION ALL','INTERSECT','EXCEPT'],a:1},
{q:'Which query names the output columns?',o:['The last','The first','The longest','Neither'],a:1},
{q:'Order of queries changes the result for…',o:['UNION','INTERSECT','EXCEPT','UNION ALL'],a:2},
{q:'To prove two tables are identical you run…',o:['UNION once','INTERSECT once','EXCEPT in both directions','CROSS JOIN'],a:2},
{q:'Where can ORDER BY appear in a UNION query?',o:['In each query','Only at the end','Only in the first','Nowhere'],a:1}]);

C('rowfn','8 · Row-Level Functions','String, number, date/time, NULL functions and CASE');
L('functions-intro','What Are Functions?',`
<p>A function is a built-in block of code that takes input, processes it and returns output. Two families:</p>
<div class="tw"><table class="t"><tr><th></th><th>Single-row (row-level)</th><th>Multi-row (aggregate)</th></tr>
<tr><td>Input → output</td><td>One value → one value (<code>LOWER('Maria')</code> → 'maria')</td><td>Many rows → one value (<code>SUM(30,10,20,40)</code> → 100)</td></tr>
<tr><td>Groups</td><td>String, numeric, date &amp; time, NULL functions (+ CASE)</td><td>Aggregate functions, window functions</td></tr>
<tr><td>Who uses them most</td><td><b>Data engineers</b> — cleaning, transforming, preparing</td><td><b>Data analysts</b> — analysing, aggregating</td></tr></table></div>
<h2>Nesting</h2><p>Functions can be nested; the innermost runs first and feeds the next.</p>
@@run LEFT → LOWER → LENGTH
SELECT first_name,
       LOWER(SUBSTR(first_name,1,2))         AS lower_first2,
       LENGTH(LOWER(SUBSTR(first_name,1,2))) AS len
FROM my_customers;
@@
`);
L('string-fn','String Functions',`
<div class="tw"><table class="t"><tr><th>Group</th><th>SQL Server</th><th>Does</th></tr>
<tr><td rowspan="5">Manipulation</td><td><code>CONCAT(a, ' ', b)</code></td><td>Combine values into one</td></tr>
<tr><td><code>UPPER</code> / <code>LOWER</code></td><td>Change case</td></tr>
<tr><td><code>TRIM</code> (LTRIM, RTRIM)</td><td>Remove leading and trailing spaces</td></tr>
<tr><td><code>REPLACE(v, old, new)</code></td><td>Replace (or, with '' as new, remove) characters</td></tr>
<tr><td><code>CONCAT_WS</code>, <code>STRING_AGG</code></td><td>Join with a separator / aggregate strings (bonus)</td></tr>
<tr><td>Calculation</td><td><code>LEN(v)</code></td><td>Number of characters (numbers and dates too)</td></tr>
<tr><td rowspan="3">Extraction</td><td><code>LEFT(v, n)</code></td><td>First n characters</td></tr>
<tr><td><code>RIGHT(v, n)</code></td><td>Last n characters</td></tr>
<tr><td><code>SUBSTRING(v, start, length)</code></td><td>Part from a position</td></tr></table></div>
@@tsql
SELECT
  CONCAT(first_name, ' - ', country)     AS name_country,
  UPPER(first_name)                      AS up_name,
  LEN(first_name)                        AS len_name,
  LEFT(TRIM(first_name), 2)              AS first_2,
  RIGHT(first_name, 2)                   AS last_2,
  SUBSTRING(TRIM(first_name), 2, LEN(first_name)) AS sub_name,  -- drop first char
  REPLACE('123-456-7890', '-', '')       AS clean_phone,
  REPLACE('report.txt', '.txt', '.csv')  AS new_file
FROM customers;
@@
@@run Same in SQLite (|| = concat, LENGTH = LEN, SUBSTR = SUBSTRING)
SELECT
  first_name || ' - ' || country           AS name_country,
  UPPER(first_name)                        AS up_name,
  LENGTH(first_name)                       AS len_name,
  SUBSTR(TRIM(first_name), 1, 2)           AS first_2,
  SUBSTR(first_name, -2)                   AS last_2,
  SUBSTR(TRIM(first_name), 2)              AS sub_name,
  REPLACE('123-456-7890', '-', '')         AS clean_phone
FROM my_customers;
@@
<h2>Detecting hidden spaces</h2>
<p>' John' has a leading space you can't see. Compare a column to its trimmed self, or compare lengths:</p>
@@run Find names with leading or trailing spaces
SELECT first_name, LENGTH(first_name) - LENGTH(TRIM(first_name)) AS flag
FROM my_customers
WHERE first_name <> TRIM(first_name);
@@
<div class="box note"><b class="lbl">Dynamic length trick</b><code>SUBSTRING(name, 2, LEN(name))</code>: a length longer than what's left is fine — SQL returns everything after the start, so LEN works for every row.</div>
<details class="iq"><summary>Interview: CONCAT vs + for strings in SQL Server?</summary><p><code>'a' + NULL</code> is NULL; <code>CONCAT('a', NULL)</code> is 'a' (CONCAT treats NULL as empty). CONCAT also converts numbers implicitly, and it's standard across databases.</p></details>
@@ex Return each customer's first_name with surrounding spaces removed, in UPPER case (single column called name).
SELECT UPPER(TRIM(first_name)) AS name FROM my_customers;
@@
`);
L('numeric-fn','Numeric Functions',`
@@run ROUND and ABS
SELECT 3.516 AS original,
       ROUND(3.516, 2) AS round_2,   -- 3.52
       ROUND(3.516, 1) AS round_1,   -- 3.5
       ROUND(3.516, 0) AS round_0,   -- 4.0
       ABS(-10) AS abs_neg, ABS(10) AS abs_pos;
@@
<p>ROUND keeps n decimals; the next digit (≥5 rounds up) decides. ABS turns negatives into positives — handy to fix data errors like negative sales.</p>
<div class="box tip"><b class="lbl">Integer division</b>In SQL Server <code>5/2 = 2</code>. Cast one side: <code>CAST(sales AS FLOAT)/quantity</code> — you'll see this in the percentage-of-total lesson.</div>
`);
L('date-basics','Date & Time Basics',`
<ul><li><b>DATE</b> — year-month-day: 2025-08-20</li><li><b>TIME</b> — hour:minute:second: 18:55:45</li><li><b>DATETIME2</b> (SQL Server) / TIMESTAMP (others) — both together.</li></ul>
<p>Three sources of dates in a query: a <b>column</b> (<code>OrderDate</code>), a <b>hard-coded string</b> (<code>'2025-08-20'</code>), and <code>GETDATE()</code> — the current date and time at execution.</p>
<h2>Date format codes</h2>
<p>SQL Server stores and accepts the international standard <b>ISO 8601: yyyy-MM-dd</b>. Format specifiers are case-sensitive: <code>MM</code> = month, <code>mm</code> = minutes, <code>HH</code> = 24-hour, <code>hh</code> = 12-hour.</p>
<div class="tw"><table class="t"><tr><th>Standard</th><th>Format</th></tr><tr><td>International / SQL Server</td><td>yyyy-MM-dd</td></tr><tr><td>USA</td><td>MM-dd-yyyy</td></tr><tr><td>Europe</td><td>dd-MM-yyyy</td></tr></table></div>
<h2>Four groups of date functions</h2>
<div class="tw"><table class="t"><tr><th>Group</th><th>Functions</th></tr>
<tr><td>Part extraction</td><td>DAY, MONTH, YEAR, DATEPART, DATENAME, DATETRUNC, EOMONTH</td></tr>
<tr><td>Format &amp; casting</td><td>FORMAT, CONVERT, CAST</td></tr>
<tr><td>Calculations</td><td>DATEADD, DATEDIFF</td></tr>
<tr><td>Validation</td><td>ISDATE</td></tr></table></div>
`);
L('date-parts','Extracting Date Parts',`
@@tsql
SELECT CreationTime,
  YEAR(CreationTime)                 AS yr,        -- INT
  MONTH(CreationTime)                AS mo,        -- INT
  DAY(CreationTime)                  AS dy,        -- INT
  DATEPART(quarter, CreationTime)    AS qtr,       -- INT: any part (week, hour, weekday…)
  DATENAME(month, CreationTime)      AS month_name,-- STRING: 'January'
  DATENAME(weekday, CreationTime)    AS day_name,  -- STRING: 'Wednesday'
  DATETRUNC(month, CreationTime)     AS mon_start, -- DATETIME: 2025-01-01 00:00:00
  EOMONTH(CreationTime)              AS mon_end    -- DATE: 2025-01-31
FROM Sales.Orders;
@@
<h2>DATETRUNC — move up the hierarchy</h2>
<p>Resets every part below the chosen level: <code>minute</code> zeroes seconds; <code>day</code> zeroes the time; <code>month</code> resets day to 01; <code>year</code> resets month and day. Perfect for changing the granularity of an aggregation (zoom in / zoom out). First day of month = <code>CAST(DATETRUNC(month, d) AS DATE)</code>.</p>
@@run SQLite equivalents with strftime
SELECT CreationTime,
  CAST(strftime('%Y', CreationTime) AS INT)  AS yr,
  CAST(strftime('%m', CreationTime) AS INT)  AS mo,
  (CAST(strftime('%m', CreationTime) AS INT)+2)/3 AS qtr,
  strftime('%Y-%m-01', CreationTime)         AS mon_start,
  date(CreationTime,'start of month','+1 month','-1 day') AS mon_end
FROM orders;
@@
<h2>Which function when?</h2>
<div class="tw"><table class="t"><tr><th>Need</th><th>Use</th><th>Returns</th></tr>
<tr><td>Day / month as a number</td><td>DAY, MONTH</td><td>INT</td></tr><tr><td>Year</td><td>YEAR</td><td>INT</td></tr><tr><td>Full name of month/weekday</td><td>DATENAME</td><td>STRING</td></tr><tr><td>Week, quarter, hour…</td><td>DATEPART</td><td>INT</td></tr><tr><td>Change granularity</td><td>DATETRUNC</td><td>DATETIME</td></tr><tr><td>Last day of month</td><td>EOMONTH</td><td>DATE</td></tr></table></div>
@@run Use case: orders per month (aggregation)
SELECT strftime('%Y-%m', OrderDate) AS order_month, COUNT(*) AS total_orders
FROM orders GROUP BY strftime('%Y-%m', OrderDate);
@@
<div class="box note"><b class="lbl">Filtering tip</b>Filter with integers (MONTH = 2), not names — numbers compare faster. Even better for indexes: a date range (<code>OrderDate &gt;= '2025-02-01' AND OrderDate &lt; '2025-03-01'</code>), because wrapping a column in a function blocks index seeks.</div>
@@ex Show all orders placed in February 2025 (all columns).
SELECT * FROM orders WHERE OrderDate >= '2025-02-01' AND OrderDate < '2025-03-01';
@@
`);
L('format-cast','FORMAT, CONVERT & CAST',`
<p><b>Formatting</b> changes how a value <i>looks</i>; <b>casting</b> changes its <i>data type</i>.</p>
@@tsql
SELECT
  FORMAT(OrderDate, 'MM-dd-yyyy')       AS usa_fmt,
  FORMAT(OrderDate, 'dd-MM-yyyy')       AS eu_fmt,
  FORMAT(OrderDate, 'MMM yy')           AS mon_yr,     -- 'Jan 25' — great for report labels
  'Day ' + FORMAT(CreationTime,'ddd MMM') + ' Q' + DATENAME(quarter,CreationTime)
     + ' ' + FORMAT(CreationTime,'yyyy hh:mm:ss tt') AS custom_fmt,
  FORMAT(1234567.891, 'N')              AS num_fmt,    -- 1,234,567.89
  CONVERT(INT, '123')                   AS str_to_int,
  CONVERT(VARCHAR, CreationTime, 32)    AS usa_style,  -- style number 32
  CAST('123' AS INT)                    AS cast_int,
  CAST(CreationTime AS DATE)            AS dt_to_date,
  CAST('2025-08-20' AS DATETIME2)       AS str_to_dt
FROM Sales.Orders;
@@
<div class="tw"><table class="t"><tr><th></th><th>CAST</th><th>CONVERT</th><th>FORMAT</th></tr>
<tr><td>Casting</td><td>Any type → any type</td><td>Any → any</td><td>Any → string only</td></tr>
<tr><td>Format date/time</td><td>No</td><td>Yes (style numbers)</td><td>Yes (format strings)</td></tr>
<tr><td>Format numbers</td><td>No</td><td>No</td><td>Yes</td></tr>
<tr><td>Portable?</td><td>ANSI standard</td><td>SQL Server</td><td>SQL Server</td></tr></table></div>
@@run CAST in SQLite
SELECT CAST('123' AS INT) + 1 AS n, CAST(123 AS TEXT) || 'x' AS s, date('2025-08-20 18:55:45') AS d;
@@
<div class="box tip"><b class="lbl">DE use case</b>Sources deliver different date formats (CSV, API, DB). Standardise them to one format early in the pipeline (silver layer) before analysis.</div>
`);
L('date-calc','DATEADD, DATEDIFF & ISDATE',`
@@tsql
SELECT OrderDate,
  DATEADD(year, 2, OrderDate)        AS two_years_later,
  DATEADD(month, 3, OrderDate)       AS three_months_later,
  DATEADD(day, -10, OrderDate)       AS ten_days_before,
  DATEDIFF(day, OrderDate, ShipDate) AS days_to_ship,
  DATEDIFF(year, BirthDate, GETDATE()) AS age          -- on employees
FROM Sales.Orders;
@@
@@run SQLite: average shipping days per month
SELECT strftime('%m', OrderDate) AS order_month,
       AVG(julianday(ShipDate) - julianday(OrderDate)) AS avg_days_to_ship
FROM orders
GROUP BY strftime('%m', OrderDate);
@@
@@run Time-gap analysis: days since the previous order (uses LAG — see Window chapter)
SELECT OrderID, OrderDate AS current_order,
       LAG(OrderDate) OVER (ORDER BY OrderDate) AS previous_order,
       julianday(OrderDate) - julianday(LAG(OrderDate) OVER (ORDER BY OrderDate)) AS days_between
FROM orders;
@@
<h2>ISDATE — validate before casting</h2>
<p><code>ISDATE(value)</code> returns 1 if SQL Server can read the string as a date (standard format, or a bare year like '2025'), else 0. Use it with CASE to cast safely and to find bad rows:</p>
@@tsql
SELECT order_date,
  CASE WHEN ISDATE(order_date) = 1 THEN CAST(order_date AS DATE)
       ELSE '9999-01-01' END AS new_order_date      -- or NULL
FROM (VALUES ('2025-08-20'),('2025-08-21'),('2025-08'),('2025-08-23')) t(order_date);
-- data quality: WHERE ISDATE(order_date) = 0
@@
@@ex Show EmployeeID, FirstName and age in full years as of 2026-01-01 (column age). Hint: (julianday('2026-01-01') - julianday(BirthDate)) / 365.25, cast to INT.
SELECT EmployeeID, FirstName, CAST((julianday('2026-01-01') - julianday(BirthDate)) / 365.25 AS INT) AS age FROM employees;
@@
`);
L('null-fn','NULL Functions',`
<p><b>NULL</b> means "unknown / no value". It is not zero, not an empty string, not a space. Any comparison with NULL is unknown; any arithmetic with NULL gives NULL.</p>
<div class="tw"><table class="t"><tr><th>Function</th><th>Does</th></tr>
<tr><td><code>ISNULL(v, replacement)</code></td><td>Replace NULL with a value — 2 arguments, SQL Server only (Oracle NVL, MySQL IFNULL), slightly faster</td></tr>
<tr><td><code>COALESCE(v1, v2, v3, …)</code></td><td>Return the first non-NULL from a list — ANSI standard, any number of arguments (preferred)</td></tr>
<tr><td><code>NULLIF(v1, v2)</code></td><td>Return NULL if equal, else v1 — turns a value into NULL</td></tr>
<tr><td><code>IS NULL</code> / <code>IS NOT NULL</code></td><td>Test for NULL — returns true/false</td></tr></table></div>
@@run COALESCE: shipping address, else billing address, else 'N/A'
SELECT OrderID, ShipAddress, BillAddress,
       COALESCE(ShipAddress, BillAddress, 'N/A') AS address
FROM orders;
@@
<h2>When to handle NULLs</h2>
<h3>1. Before aggregations</h3><p>All aggregates ignore NULL (except COUNT(*)). If the business means NULL = 0, replace first:</p>
@@run AVG with and without NULL handling
SELECT CustomerID, Score,
  AVG(Score) OVER ()              AS avg_ignoring_null,   -- 625
  AVG(COALESCE(Score,0)) OVER ()  AS avg_null_as_zero     -- 500
FROM customers;
@@
<h3>2. Before maths and concatenation</h3>
@@run Full name and +10 bonus — NULL poisons the result unless handled
SELECT CustomerID, FirstName || ' ' || LastName AS broken_name,
       FirstName || ' ' || COALESCE(LastName,'') AS full_name,
       Score + 10 AS broken_bonus, COALESCE(Score,0) + 10 AS score_bonus
FROM customers;
@@
<h3>3. Before joining on nullable keys</h3><p><code>NULL = NULL</code> is not true, so rows with NULL keys never match. Use <code>ON a.year = b.year AND ISNULL(a.type,'') = ISNULL(b.type,'')</code>.</p>
<h3>4. Before sorting</h3><p>SQL Server puts NULLs first in ASC, last in DESC. To force NULLs last without a magic big number, sort by a flag:</p>
@@run Lowest to highest score, NULLs last
SELECT CustomerID, Score FROM customers
ORDER BY CASE WHEN Score IS NULL THEN 1 ELSE 0 END, Score;
@@
<h3>NULLIF use case: prevent divide-by-zero</h3>
@@run Price per unit; order 10 has quantity 0
SELECT OrderID, Sales, Quantity, Sales / NULLIF(Quantity, 0) AS price
FROM orders;
@@
<h3>IS NULL use case: anti joins</h3><p>LEFT JOIN + <code>WHERE right.key IS NULL</code> — see <a href="#anti-joins">Anti Joins</a>.</p>
<h2>NULL vs empty string vs blank space</h2>
<div class="tw"><table class="t"><tr><th></th><th>NULL</th><th>Empty string ''</th><th>Blank space ' '</th></tr>
<tr><td>Meaning</td><td>Unknown</td><td>Known, nothing</td><td>Known, a space character</td></tr><tr><td>Type</td><td>Special marker</td><td>String, length 0</td><td>String, length ≥ 1</td></tr><tr><td>Storage / speed</td><td>Best</td><td>Good</td><td>Worst</td></tr><tr><td>Test with</td><td>IS NULL</td><td>= ''</td><td>= ' ' (or TRIM)</td></tr></table></div>
<p>Use <code>DATALENGTH()</code> (SQL Server) or LENGTH to tell them apart — they look identical in a result grid.</p>
<h2>Data policies (pick one with the business)</h2>
@@run Policy 1: trim blanks · Policy 2: everything empty → NULL · Policy 3: everything → 'unknown'
SELECT OrderID, BillAddress,
  TRIM(BillAddress)                                  AS policy1,
  NULLIF(TRIM(BillAddress), '')                      AS policy2,
  COALESCE(NULLIF(TRIM(BillAddress), ''), 'unknown') AS policy3
FROM orders;
@@
<p>The author stores data with <b>policy 2</b> (NULLs save storage and are fastest) and applies <b>policy 3</b> just before showing data to users in reports.</p>
<details class="iq"><summary>Interview: COALESCE vs ISNULL?</summary><p>ISNULL takes exactly 2 arguments, is SQL Server-only, returns the type of the first argument, and is marginally faster. COALESCE takes any number of arguments, is ANSI standard (portable), and returns the highest-precedence type. Prefer COALESCE unless profiling shows a difference.</p></details>
<details class="iq"><summary>Interview: Why does COUNT(column) differ from COUNT(*)?</summary><p>COUNT(*) counts rows. COUNT(column) counts non-NULL values in that column. The difference is the number of NULLs — a quick data-quality check.</p></details>
@@ex Show OrderID and the ShipAddress, replacing NULLs with 'missing' (column ship).
SELECT OrderID, COALESCE(ShipAddress,'missing') AS ship FROM orders;
@@
`);
L('case','CASE Statement',`
<p>CASE builds conditional logic: it evaluates conditions top to bottom and returns the value of the <b>first</b> true condition. <code>ELSE</code> is optional — without it, non-matching rows get NULL. Every THEN/ELSE result must have a compatible data type. CASE works in any clause (SELECT, WHERE, JOIN, GROUP BY, ORDER BY).</p>
@@sql
CASE
  WHEN condition1 THEN result1
  WHEN condition2 THEN result2
  ELSE default_result
END
@@
<h2>Use case 1: categorize data</h2>
@@run Segment orders High / Medium / Low, then total sales per category
SELECT category, SUM(Sales) AS total_sales
FROM (
  SELECT OrderID, Sales,
    CASE WHEN Sales > 50 THEN 'High'
         WHEN Sales > 20 THEN 'Medium'
         ELSE 'Low' END AS category
  FROM orders
) t
GROUP BY category
ORDER BY total_sales DESC;
@@
<h2>Use case 2: map values</h2>
@@run Translate codes into readable text (full form and quick form)
SELECT EmployeeID, Gender,
  CASE WHEN Gender = 'F' THEN 'Female' WHEN Gender = 'M' THEN 'Male' ELSE 'Not Available' END AS gender_full,
  CASE Gender WHEN 'F' THEN 'Female' WHEN 'M' THEN 'Male' ELSE 'n/a' END AS gender_quick
FROM employees;
@@
<p>The <b>quick form</b> (<code>CASE column WHEN value</code>) only supports one column and equality. Prefer the full form — adding any extra logic later forces a rewrite.</p>
<div class="box tip">Before mapping, list every distinct value: <code>SELECT DISTINCT Country FROM customers</code>.</div>
<h2>Use case 3: handle NULLs</h2>
@@run
SELECT CustomerID, Score,
  CASE WHEN Score IS NULL THEN 0 ELSE Score END AS score_clean
FROM customers;
@@
<h2>Use case 4: conditional aggregation</h2>
@@run Per customer: all orders vs orders with sales &gt; 30
SELECT CustomerID,
  COUNT(*) AS total_orders,
  SUM(CASE WHEN Sales > 30 THEN 1 ELSE 0 END) AS high_sales_orders
FROM orders
GROUP BY CustomerID;
@@
<details class="iq"><summary>Interview: Pivot rows into columns without PIVOT?</summary><p>Conditional aggregation: <code>SUM(CASE WHEN month='Jan' THEN sales END) AS jan, SUM(CASE WHEN month='Feb' THEN sales END) AS feb … GROUP BY product</code>. Works in every database.</p></details>
@@ex Count delivered and shipped orders per customer (columns: CustomerID, delivered, shipped).
SELECT CustomerID, SUM(CASE WHEN OrderStatus='Delivered' THEN 1 ELSE 0 END) AS delivered, SUM(CASE WHEN OrderStatus='Shipped' THEN 1 ELSE 0 END) AS shipped FROM orders GROUP BY CustomerID;
@@
`);
