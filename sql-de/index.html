C('ai','12 · SQL with AI','How to use ChatGPT and Copilot well for SQL work');
L('ai-sql','Using AI Assistants for SQL',`
<p>First, a discipline: solve hard tasks yourself first. Struggling is where skill grows, and it's how you learn to spot when the AI is wrong. Ask AI when you're out of ideas — and always test its suggestions.</p>
<div class="tw"><table class="t"><tr><th>ChatGPT-style chat</th><th>GitHub Copilot (in the editor)</th></tr>
<tr><td>Brainstorming, project planning, learning, documentation, architecture discussions, best practices, breaking down complex tasks</td><td>Writing code with ghost-text autocompletion (Tab accepts, Ctrl+→ accepts a word, Ctrl+Enter shows alternatives), inline chat (Ctrl+I), fixing errors, refactoring, adding comments, formatting</td></tr></table></div>
<h2>Prompt structure</h2>
<ol><li><b>Task</b> (mandatory) — what to do.</li><li><b>Context</b> — "I'm a data engineer using SQL Server; tables are…".</li><li><b>Specifications</b> — what to include/exclude, length, format.</li><li><b>Role</b> (nice to have) — "act as a senior SQL expert".</li><li><b>Tone</b> (nice to have) — "conversational, direct".</li></ol>
<h2>Prompts that pay off</h2>
<div class="tw"><table class="t"><tr><th>Goal</th><th>Ask for</th></tr>
<tr><td>Solve a task</td><td>Give the DDL/columns; ask for 3 versions, comments only where needed, and an evaluation of readability vs performance</td></tr>
<tr><td>Readability</td><td>Improve readability, remove redundancy, consolidate CTEs, explain each change</td></tr>
<tr><td>Performance</td><td>Propose optimizations, return the improved query, explain why</td></tr>
<tr><td>Execution plan</td><td>Upload a screenshot; describe it step by step, find bottlenecks, suggest fixes</td></tr>
<tr><td>Debugging</td><td>Paste the error + query; explain the error, find the root cause, suggest a fix</td></tr>
<tr><td>Explain results</td><td>Break down how SQL processes the query step by step</td></tr>
<tr><td>Style</td><td>Uppercase keywords, align aliases, stay compact, follow best practices</td></tr>
<tr><td>Documentation</td><td>Leading purpose comment, comments only where needed, business-rule doc</td></tr>
<tr><td>DDL review</td><td>Naming conventions, data types, PK/FK integrity, indexes, normalization</td></tr>
<tr><td>Test data</td><td>Realistic INSERT statements, small, joinable keys, no NULLs</td></tr>
<tr><td>Migration</td><td>Convert T-SQL to MySQL / Postgres (ISNULL→COALESCE, TOP→LIMIT, GETDATE→NOW)</td></tr>
<tr><td>Learning / interviews</td><td>A road map, concept explanations, comparisons, interactive practice, mock interviews</td></tr></table></div>
<div class="box warn">Check your company's rules before pasting code or schema into a public chatbot.</div>
`);

C('dwh','13 · Data Warehousing & ETL','DWH concepts, ETL methods, SCD, architectures, Medallion, dimensional modelling');
L('dwh-what','What Is a Data Warehouse?',`
<p>Bill Inmon's definition: a data warehouse is a <b>subject-oriented</b> (sales, customers, finance), <b>integrated</b> (combines many sources), <b>time-variant</b> (keeps history) and <b>non-volatile</b> (data isn't deleted or changed once loaded) collection of data designed to support management's decision-making.</p>
<h2>Without data management</h2>
<p>Analysts pull data manually from each system, spend days or weeks transforming it, and share Excel, PowerPoint and Power BI reports each at a different data state. Slow, error-prone, can't handle big data, and integrated cross-system reports are nearly impossible.</p>
<h2>With a data warehouse</h2>
<p>An automated <b>ETL</b> extracts from all sources, transforms and loads into one <b>single point of truth</b>. Reports are integrated, consistent, refreshed in hours or minutes, and can include history. Data engineers build the ETL and warehouse; data analysts build models and reports on top.</p>
<p>Analogy: a restaurant kitchen. Suppliers bring raw ingredients (sources); they are cleaned, chopped and stored (ETL); a perfect dish is assembled on order (reports).</p>
<h2>Data management approaches</h2>
<div class="tw"><table class="t"><tr><th>Approach</th><th>Description</th><th>Choose when</th></tr>
<tr><td><b>Data warehouse</b></td><td>Structured, modelled data</td><td>Structured data; solid foundation for reporting / BI</td></tr>
<tr><td><b>Data lake</b></td><td>Stores structured, semi- and unstructured data (logs, images, video) — flexible, can become a "data swamp"</td><td>Mixed data; ML and advanced analytics</td></tr>
<tr><td><b>Lakehouse</b></td><td>Lake flexibility + warehouse structure (Delta, Iceberg, Hudi)</td><td>Both needs — the modern default</td></tr>
<tr><td><b>Data mesh</b></td><td>Decentralized: each domain builds and shares data products</td><td>Large orgs where a central team is a bottleneck</td></tr></table></div>
`);
L('etl','ETL: Extract, Transform, Load',`
<ul><li><b>Extract</b> — identify and pull the data needed from the source, unchanged.</li><li><b>Transform</b> — clean, integrate, reshape into the format needed for analysis.</li><li><b>Load</b> — insert into the target.</li></ul>
<p>In a layered architecture you don't always use all three between each pair of layers: source → layer 1 may be EL only (raw copy), layer 1 → 2 full ETL, layer 2 → 3 TL, etc. <b>ELT</b> loads raw data first and transforms inside the target engine (common with cloud warehouses).</p>
<h2>Extraction</h2>
<div class="tw"><table class="t"><tr><th>Dimension</th><th>Options</th></tr>
<tr><td>Method</td><td><b>Pull</b> (warehouse fetches) · <b>Push</b> (source sends)</td></tr>
<tr><td>Type</td><td><b>Full</b> (all rows every time) · <b>Incremental</b> (only new/changed rows)</td></tr>
<tr><td>Technique</td><td>Manual · database query · file parsing · API calls · event streaming (Kafka) · CDC · web scraping</td></tr></table></div>
<h2>Transformation types</h2>
<ul><li><b>Data enrichment</b> — add value from other data sets.</li><li><b>Data integration</b> — bring many sources into one model.</li><li><b>Derived columns</b> — new columns from existing ones.</li><li><b>Data normalization &amp; standardization</b> — map codes to friendly values ('M'→'Male').</li><li><b>Business rules &amp; logic</b> — e.g. customer segments.</li><li><b>Data aggregation</b> — change granularity.</li><li><b>Data cleansing</b> — remove duplicates, filter, handle missing data, handle invalid values, remove unwanted spaces, cast data types, detect outliers.</li></ul>
<h2>Load</h2>
<div class="tw"><table class="t"><tr><th>Dimension</th><th>Options</th></tr>
<tr><td>Processing</td><td><b>Batch</b> (scheduled, e.g. nightly) · <b>Stream</b> (each change processed ASAP — real-time)</td></tr>
<tr><td>Full load</td><td>Truncate &amp; insert · Upsert (update + insert) · Drop, create, insert</td></tr>
<tr><td>Incremental load</td><td>Upsert · Append (insert only, e.g. logs) · Merge (update, insert, delete)</td></tr></table></div>
<p>The course project uses: pull, full extraction, file parsing; all transformation types; batch processing, full load with truncate &amp; insert, SCD Type 1.</p>
@@tsql Bronze load pattern used in the course project (full load: truncate + bulk insert)
TRUNCATE TABLE bronze.crm_cust_info;
BULK INSERT bronze.crm_cust_info
FROM 'C:\\datasets\\source_crm\\cust_info.csv'
WITH (FIRSTROW = 2, FIELDTERMINATOR = ',', TABLOCK);
@@
`);
L('scd','Slowly Changing Dimensions (SCD)',`
<p>How to handle history when a dimension attribute changes (a customer moves country).</p>
<div class="tw"><table class="t"><tr><th>Type</th><th>Behaviour</th><th>History</th></tr>
<tr><td><b>SCD 0</b></td><td>Retain original — never update</td><td>Original only</td></tr>
<tr><td><b>SCD 1</b></td><td>Overwrite the old value (upsert)</td><td>Lost</td></tr>
<tr><td><b>SCD 2</b></td><td>Insert a new row; expire the old one (valid_from / valid_to / is_current)</td><td>Full</td></tr>
<tr><td>SCD 3</td><td>Keep previous value in an extra column</td><td>One step</td></tr>
<tr><td>SCD 4 / 6</td><td>History in a separate table / hybrid of 1+2+3</td><td>Varies</td></tr></table></div>
@@run SCD Type 2 step by step: expire changed rows, insert new versions
CREATE TABLE dim_customer (sk INTEGER PRIMARY KEY, customer_id INT, country TEXT,
                           valid_from TEXT, valid_to TEXT, is_current INT);
INSERT INTO dim_customer (customer_id, country, valid_from, valid_to, is_current) VALUES
 (1,'Germany','2024-01-01','9999-12-31',1), (2,'USA','2024-01-01','9999-12-31',1);
CREATE TABLE stg_customer (customer_id INT, country TEXT);
INSERT INTO stg_customer VALUES (1,'Austria'), (2,'USA'), (3,'UK');   -- 1 changed, 3 new

-- 1) expire current rows whose attributes changed
UPDATE dim_customer SET valid_to = '2025-06-30', is_current = 0
WHERE is_current = 1 AND EXISTS (SELECT 1 FROM stg_customer s
      WHERE s.customer_id = dim_customer.customer_id AND s.country <> dim_customer.country);

-- 2) insert new versions + brand-new customers
INSERT INTO dim_customer (customer_id, country, valid_from, valid_to, is_current)
SELECT s.customer_id, s.country, '2025-07-01', '9999-12-31', 1
FROM stg_customer s
LEFT JOIN dim_customer d ON d.customer_id = s.customer_id AND d.is_current = 1
WHERE d.customer_id IS NULL;

SELECT * FROM dim_customer ORDER BY customer_id, valid_from;
@@
<p><code>sk</code> is a <b>surrogate key</b>: a warehouse-generated key, independent of the source's business key, so one customer can have several versions. Facts join to the version that was current at transaction time.</p>
<details class="iq"><summary>Interview: Point-in-time join for SCD2?</summary><p><code>JOIN dim_customer d ON f.customer_id = d.customer_id AND f.order_date &gt;= d.valid_from AND f.order_date &lt; d.valid_to</code> — or resolve the surrogate key during the fact load and store <code>customer_sk</code> in the fact.</p></details>
`);
L('dwh-arch','Data Architecture: Inmon, Kimball, Data Vault, Medallion',`
<div class="tw"><table class="t"><tr><th>Approach</th><th>Layers</th><th>Trade-off</th></tr>
<tr><td><b>Inmon</b></td><td>Staging → Enterprise DWH (3rd normal form, integrated model) → Data marts → BI</td><td>Consistent, slower to build</td></tr>
<tr><td><b>Kimball</b></td><td>Staging → Data marts (star schemas) directly</td><td>Fast delivery; risk of chaos and repeated logic across marts</td></tr>
<tr><td><b>Data Vault</b></td><td>Staging → Raw Vault → Business Vault (rules) → Data marts</td><td>Standards and auditability in the middle layer (hubs, links, satellites)</td></tr>
<tr><td><b>Medallion</b></td><td>Bronze → Silver → Gold</td><td>Easy to understand and build — the course's choice</td></tr></table></div>
<h2>Medallion architecture</h2>
<div class="tw"><table class="t"><tr><th></th><th>Bronze</th><th>Silver</th><th>Gold</th></tr>
<tr><td>Definition</td><td>Raw, unprocessed data as-is from sources</td><td>Cleaned and standardized data</td><td>Business-ready data</td></tr>
<tr><td>Objective</td><td>Traceability and debugging</td><td>Prepare data for analysis</td><td>Provide data for reporting, analytics, ML/AI</td></tr>
<tr><td>Object type</td><td>Tables</td><td>Tables</td><td>Views (virtual marts) or tables</td></tr>
<tr><td>Load</td><td>Full load (truncate &amp; insert)</td><td>Full load (truncate &amp; insert)</td><td>None (views)</td></tr>
<tr><td>Transformations</td><td>None (as-is)</td><td>Cleansing, standardization, normalization, derived columns, enrichment</td><td>Integration, aggregation, business logic</td></tr>
<tr><td>Data model</td><td>None</td><td>None (source-shaped)</td><td>Star schema, flat tables, aggregated tables</td></tr>
<tr><td>Audience</td><td>Data engineers</td><td>Data engineers, analysts</td><td>Analysts, business users</td></tr></table></div>
<p>Course project requirements: build a modern warehouse in SQL Server consolidating sales data from two sources (ERP and CRM, as CSV files), fix data quality, integrate both into one user-friendly model, focus on the latest data (no history), and document the model.</p>
<h2>Separation of concerns &amp; conventions</h2>
<ul><li>Schemas per layer: <code>bronze</code>, <code>silver</code>, <code>gold</code>.</li>
<li>Bronze/silver tables: <code>&lt;sourcesystem&gt;_&lt;entity&gt;</code> (e.g. <code>crm_cust_info</code>); gold: <code>dim_customers</code>, <code>fact_sales</code>.</li>
<li>snake_case, English, no reserved words; surrogate keys <code>&lt;table&gt;_key</code>; technical columns <code>dwh_&lt;name&gt;</code> (e.g. <code>dwh_load_date</code>); load procedures <code>load_&lt;layer&gt;</code>.</li>
<li>Plan the project (epics and tasks, e.g. in Notion) — over 50% of DWH projects fail; a clear plan is the key to success.</li></ul>
<h2>Typical silver-layer cleansing in SQL</h2>
@@run Clean customers: trim names, normalize codes, keep latest record per id
SELECT CustomerID,
       TRIM(FirstName) AS first_name,
       COALESCE(LastName, 'n/a') AS last_name,
       CASE UPPER(TRIM(Country)) WHEN 'USA' THEN 'United States' WHEN 'GERMANY' THEN 'Germany' ELSE 'n/a' END AS country,
       COALESCE(Score, 0) AS score
FROM customers;
@@
`);
L('dim-model','Dimensional Modelling: Star Schema',`
<ul><li><b>Fact table</b> — measurable events (orders, payments): foreign keys to dimensions + numeric measures (sales, quantity) + dates. Long and narrow; usually the biggest tables.</li>
<li><b>Dimension table</b> — descriptive context (customer, product, date, store). Wide and short.</li>
<li><b>Star schema</b> — one fact surrounded by denormalized dimensions; simple, fast joins. <b>Snowflake schema</b> — dimensions normalized into sub-dimensions; less redundancy, more joins.</li>
<li><b>Grain</b> — what one fact row represents ("one row per order line"). Decide it first.</li></ul>
@@run Gold-layer star schema as views over silver-like tables
CREATE VIEW dim_customers AS
SELECT ROW_NUMBER() OVER (ORDER BY CustomerID) AS customer_key,   -- surrogate key
       CustomerID AS customer_id, FirstName AS first_name, COALESCE(LastName,'n/a') AS last_name, Country AS country
FROM customers;
CREATE VIEW dim_products AS
SELECT ROW_NUMBER() OVER (ORDER BY ProductID) AS product_key, ProductID AS product_id, Product AS product_name, Category AS category, Price AS cost
FROM products;
CREATE VIEW fact_sales AS
SELECT o.OrderID AS order_number, dp.product_key, dc.customer_key,
       o.OrderDate AS order_date, o.ShipDate AS shipping_date, o.Sales AS sales_amount, o.Quantity AS quantity
FROM orders o
LEFT JOIN dim_products  dp ON dp.product_id  = o.ProductID
LEFT JOIN dim_customers dc ON dc.customer_id = o.CustomerID;

SELECT dc.country, dp.category, SUM(f.sales_amount) AS revenue
FROM fact_sales f
JOIN dim_customers dc ON dc.customer_key = f.customer_key
JOIN dim_products  dp ON dp.product_key  = f.product_key
GROUP BY dc.country, dp.category ORDER BY revenue DESC;
@@
<details class="iq"><summary>Interview: Fact types?</summary><p><b>Transactional</b> (one row per event), <b>periodic snapshot</b> (state at regular intervals, e.g. daily balance), <b>accumulating snapshot</b> (one row per process updated through milestones, e.g. order → ship → deliver), <b>factless</b> (events with no measures, e.g. attendance). Measures are additive (sales), semi-additive (balance — not across time) or non-additive (ratios).</p></details>
<details class="iq"><summary>Interview: Why surrogate keys instead of natural keys?</summary><p>They decouple the warehouse from source key changes, integrate sources with clashing keys, enable SCD2 (many versions per business key), and are compact integers for fast joins.</p></details>
`);
L('dq-checks','Data Quality Checks in SQL',`
<p>Every layer should be tested. These are the checks the course project runs on silver and gold:</p>
@@run 1. Primary key: nulls or duplicates — expect no rows
SELECT OrderID, COUNT(*) FROM orders_archive
GROUP BY OrderID HAVING COUNT(*) > 1 OR OrderID IS NULL;
@@
@@run 2. Unwanted spaces — expect no rows
SELECT first_name FROM my_customers WHERE first_name <> TRIM(first_name);
@@
@@run 3. Standardization: review distinct values
SELECT DISTINCT OrderStatus FROM orders;
@@
@@run 4. Invalid date order — ship before order
SELECT * FROM orders WHERE ShipDate < OrderDate;
@@
@@run 5. Business rule: sales = quantity × price? (flags mismatches)
SELECT o.OrderID, o.Sales, o.Quantity, p.Price, o.Quantity * p.Price AS expected
FROM orders o JOIN products p ON p.ProductID = o.ProductID
WHERE o.Sales <> o.Quantity * p.Price OR o.Sales IS NULL OR o.Quantity <= 0;
@@
@@run 6. Referential integrity: facts without a dimension — expect no rows
SELECT o.* FROM my_orders o LEFT JOIN my_customers c ON c.id = o.customer_id WHERE c.id IS NULL;
@@
<p>Other checks: row counts source vs target, EXCEPT both ways after migration, out-of-range values (negative prices, birth dates in the future), freshness (max load date).</p>
`);
L('analytics','Exploratory & Advanced Analytics Patterns',`
<p>After the warehouse, the course's analytics projects explore data with a fixed set of question types:</p>
<div class="tw"><table class="t"><tr><th>Analysis</th><th>Question</th><th>SQL tools</th></tr>
<tr><td>Database exploration</td><td>What tables/columns exist?</td><td>INFORMATION_SCHEMA</td></tr>
<tr><td>Dimension exploration</td><td>Which countries/categories?</td><td>DISTINCT</td></tr>
<tr><td>Date exploration</td><td>First/last order, data span</td><td>MIN, MAX, DATEDIFF</td></tr>
<tr><td>Measures (big numbers)</td><td>Total sales, orders, customers</td><td>SUM, COUNT, AVG</td></tr>
<tr><td>Magnitude</td><td>Sales by country/category</td><td>GROUP BY</td></tr>
<tr><td>Ranking</td><td>Top 5 / bottom 5 products</td><td>TOP, RANK, ROW_NUMBER</td></tr>
<tr><td>Change over time</td><td>Trend by month/year</td><td>DATETRUNC, GROUP BY date</td></tr>
<tr><td>Cumulative</td><td>Running total, moving average</td><td>SUM/AVG OVER (ORDER BY)</td></tr>
<tr><td>Performance</td><td>vs average, vs previous year (YoY)</td><td>AVG OVER, LAG</td></tr>
<tr><td>Part-to-whole</td><td>Category share of total</td><td>SUM OVER ()</td></tr>
<tr><td>Data segmentation</td><td>Customer segments (VIP/regular/new)</td><td>CASE, NTILE</td></tr>
<tr><td>Reporting</td><td>Customer and product report views</td><td>CTE + view</td></tr></table></div>
@@run Part-to-whole: category share of total sales
SELECT p.Category, SUM(o.Sales) AS total_sales,
       ROUND(CAST(SUM(o.Sales) AS FLOAT) / SUM(SUM(o.Sales)) OVER () * 100, 2) AS pct_of_total
FROM orders o JOIN products p ON p.ProductID = o.ProductID
GROUP BY p.Category;
@@
@@run Segmentation: customers by spend and lifespan in months
WITH c AS (
  SELECT CustomerID, SUM(Sales) AS spend,
         (strftime('%Y',MAX(OrderDate))-strftime('%Y',MIN(OrderDate)))*12
          + strftime('%m',MAX(OrderDate))-strftime('%m',MIN(OrderDate)) AS lifespan_months
  FROM orders GROUP BY CustomerID)
SELECT *, CASE WHEN lifespan_months >= 1 AND spend > 100 THEN 'VIP'
               WHEN lifespan_months >= 1 THEN 'Regular' ELSE 'New' END AS segment
FROM c;
@@
`);

L('patterns','Must-Know SQL Patterns',`
<p>Most DE SQL rounds reuse a handful of patterns. Practise each until you can write it without thinking.</p>
<h2>1. Top-N per group</h2>
@@run Highest-selling order per customer
SELECT * FROM (
  SELECT CustomerID, OrderID, Sales,
         ROW_NUMBER() OVER (PARTITION BY CustomerID ORDER BY Sales DESC) AS rn
  FROM orders) t
WHERE rn = 1;
@@
<h2>2. Deduplicate keeping the latest</h2>
@@run
SELECT * FROM (
  SELECT *, ROW_NUMBER() OVER (PARTITION BY OrderID ORDER BY CreationTime DESC) AS rn
  FROM orders_archive) t
WHERE rn = 1;
@@
@@tsql Delete duplicates in place (SQL Server)
WITH d AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY OrderID ORDER BY CreationTime DESC) rn
           FROM Sales.OrdersArchive)
DELETE FROM d WHERE rn > 1;
@@
<h2>3. Nth highest value</h2>
@@run Second-highest salary
SELECT DISTINCT Salary FROM (
  SELECT Salary, DENSE_RANK() OVER (ORDER BY Salary DESC) AS dr FROM employees) t
WHERE dr = 2;
@@
<h2>4. Running total and month-over-month</h2>
@@run
SELECT order_month, sales,
       SUM(sales) OVER (ORDER BY order_month) AS running_total,
       sales - LAG(sales) OVER (ORDER BY order_month) AS mom_change
FROM (SELECT strftime('%Y-%m', OrderDate) AS order_month, SUM(Sales) AS sales
      FROM orders GROUP BY strftime('%Y-%m', OrderDate)) m;
@@
<h2>5. Gaps and islands (consecutive streaks)</h2>
@@run Group consecutive login days per user
WITH logins(user_id, d) AS (
  VALUES (1,'2025-01-01'),(1,'2025-01-02'),(1,'2025-01-03'),(1,'2025-01-07'),(1,'2025-01-08'),(2,'2025-01-05')
),
g AS (SELECT user_id, d,
             date(d, '-' || ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY d) || ' days') AS grp
      FROM logins)
SELECT user_id, MIN(d) AS streak_start, MAX(d) AS streak_end, COUNT(*) AS days
FROM g GROUP BY user_id, grp ORDER BY user_id, streak_start;
@@
<h2>6. Pivot with conditional aggregation</h2>
@@run Sales per category by month
SELECT p.Category,
  SUM(CASE WHEN strftime('%m',o.OrderDate)='01' THEN o.Sales ELSE 0 END) AS jan,
  SUM(CASE WHEN strftime('%m',o.OrderDate)='02' THEN o.Sales ELSE 0 END) AS feb,
  SUM(CASE WHEN strftime('%m',o.OrderDate)='03' THEN o.Sales ELSE 0 END) AS mar
FROM orders o JOIN products p ON p.ProductID = o.ProductID
GROUP BY p.Category;
@@
<h2>7. Customers who did X but never Y</h2>
@@run Customers with shipped orders but no delivered orders
SELECT CustomerID FROM orders WHERE OrderStatus = 'Shipped'
EXCEPT
SELECT CustomerID FROM orders WHERE OrderStatus = 'Delivered';
@@
<h2>8. Year-over-year with a self join alternative</h2>
@@run Each product's sales vs product average
SELECT ProductID, OrderID, Sales,
       AVG(Sales) OVER (PARTITION BY ProductID) AS product_avg,
       CASE WHEN Sales > AVG(Sales) OVER (PARTITION BY ProductID) THEN 'Above' ELSE 'Below/Equal' END AS flag
FROM orders;
@@
@@ex Find the customer (CustomerID, total_sales) with the highest total sales. Return one row.
SELECT CustomerID, SUM(Sales) AS total_sales FROM orders GROUP BY CustomerID ORDER BY total_sales DESC LIMIT 1;
@@
@@ex For each category return the most expensive product (columns: Category, Product, Price).
SELECT Category, Product, Price FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY Category ORDER BY Price DESC) rn FROM products) t WHERE rn = 1;
@@
@@ex List employees who earn more than their manager (columns: Employee, Salary, Manager, ManagerSalary).
SELECT e.FirstName AS Employee, e.Salary, m.FirstName AS Manager, m.Salary AS ManagerSalary FROM employees e JOIN employees m ON e.ManagerID = m.EmployeeID WHERE e.Salary > m.Salary;
@@
`);
L('qa-bank','Rapid-Fire Q&A Bank',`
<p>Open each, answer out loud in under a minute, then compare.</p>
<details class="iq"><summary>Logical execution order of a SELECT?</summary><p>FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT (window functions here) → DISTINCT → ORDER BY → TOP/LIMIT.</p></details>
<details class="iq"><summary>WHERE vs HAVING?</summary><p>WHERE filters rows before aggregation and can't use aggregates; HAVING filters groups after aggregation.</p></details>
<details class="iq"><summary>DELETE vs TRUNCATE vs DROP?</summary><p>DELETE removes chosen rows, logged row by row, fires triggers. TRUNCATE removes all rows fast, minimal logging, resets identity, keeps the table. DROP removes table and data.</p></details>
<details class="iq"><summary>UNION vs UNION ALL?</summary><p>UNION removes duplicates (extra sort/hash); UNION ALL keeps all rows and is faster.</p></details>
<details class="iq"><summary>INNER vs LEFT vs FULL join?</summary><p>INNER: matches only. LEFT: all left rows + matches (NULLs otherwise). FULL: all rows from both.</p></details>
<details class="iq"><summary>ROW_NUMBER vs RANK vs DENSE_RANK?</summary><p>ROW_NUMBER is unique, no ties. RANK shares ties and leaves gaps (1,2,2,4). DENSE_RANK shares ties without gaps (1,2,2,3).</p></details>
<details class="iq"><summary>Window function vs GROUP BY?</summary><p>Both aggregate; GROUP BY collapses rows, window functions keep row detail and add ranking/value functions.</p></details>
<details class="iq"><summary>What is a frame clause and what's the default?</summary><p>The subset of rows inside a window used for the calculation. With ORDER BY and no frame, SQL uses RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW — hence running totals.</p></details>
<details class="iq"><summary>Correlated vs non-correlated subquery?</summary><p>Non-correlated runs once independently; correlated references the outer query and runs per outer row.</p></details>
<details class="iq"><summary>EXISTS vs IN? Why is NOT IN dangerous?</summary><p>EXISTS checks for any row and stops early; NOT IN with a NULL in the list returns nothing because comparisons with NULL are unknown. Prefer NOT EXISTS.</p></details>
<details class="iq"><summary>CTE vs subquery vs temp table vs view?</summary><p>Subquery: one-time, one place. CTE: named, reusable within one query, recursive possible. Temp table: materialized in tempdb for the session, indexable. View: stored query reusable by everyone, always fresh, no data stored.</p></details>
<details class="iq"><summary>View vs materialized view vs CTAS?</summary><p>View recalculates every read (fresh, slower). Materialized view stores results with managed refresh. CTAS creates a regular table once — fast reads, stale until rebuilt.</p></details>
<details class="iq"><summary>Clustered vs non-clustered index?</summary><p>Clustered sorts the data physically; leaf = data; one per table. Non-clustered is a separate B-tree with pointers; many per table; one extra hop.</p></details>
<details class="iq"><summary>When is an index not used?</summary><p>Functions or implicit conversions on the column, leading wildcards, skipping the leftmost column of a composite index, low selectivity (optimizer prefers a scan), stale statistics, OR conditions across columns.</p></details>
<details class="iq"><summary>Rowstore vs columnstore?</summary><p>Rowstore: row by row, balanced, OLTP. Columnstore: column segments, compressed, reads only needed columns, fast aggregations, slower writes, OLAP.</p></details>
<details class="iq"><summary>Index seek vs scan, and key lookup?</summary><p>Seek navigates the B-tree to specific rows; scan reads all/a range. A key lookup fetches extra columns from the base table after a non-clustered seek — remove it with a covering index (INCLUDE).</p></details>
<details class="iq"><summary>Nested loops vs merge vs hash join?</summary><p>Nested loops: small inputs or indexed inner side. Merge: both inputs sorted on the key. Hash: large unsorted inputs, builds a hash table on the smaller side.</p></details>
<details class="iq"><summary>Why update statistics?</summary><p>The optimizer estimates row counts from statistics; stale stats lead to bad plans (wrong join type, wrong index).</p></details>
<details class="iq"><summary>Reorganize vs rebuild?</summary><p>Reorganize (10–30% fragmentation): light, online leaf-level defrag. Rebuild (&gt; 30%): recreates the index, removes free space, updates stats.</p></details>
<details class="iq"><summary>What is partitioning and why?</summary><p>Splitting a big table into partitions (usually by date) behind one table name: partition elimination, parallelism, smaller per-partition indexes, easier archiving (switch partitions).</p></details>
<details class="iq"><summary>COALESCE vs ISNULL vs NULLIF?</summary><p>COALESCE returns the first non-NULL of many (ANSI). ISNULL replaces NULL with one value (SQL Server). NULLIF returns NULL if two values are equal (divide-by-zero guard).</p></details>
<details class="iq"><summary>NULL vs empty string vs blank?</summary><p>NULL is unknown; '' is a known empty string (length 0); ' ' is a space (length ≥ 1). Test with IS NULL, = '', = ' '.</p></details>
<details class="iq"><summary>How do aggregates treat NULL?</summary><p>They ignore NULLs (COUNT(*) counts rows). Replace NULLs first if the business treats them as 0.</p></details>
<details class="iq"><summary>Stored procedure vs function?</summary><p>Procedures can modify data, return multiple result sets, use transactions and TRY/CATCH, called with EXEC. Functions return a value or table, are used inside queries, and can't change database state.</p></details>
<details class="iq"><summary>What is a trigger? AFTER vs INSTEAD OF?</summary><p>Code that fires automatically on DML/DDL/logon events. AFTER runs once the change happened; INSTEAD OF replaces the operation (e.g. to make a view updatable).</p></details>
<details class="iq"><summary>Normalization vs denormalization?</summary><p>Normalization (1NF–3NF) removes redundancy for OLTP integrity. Denormalization (star schemas, wide tables) duplicates data for fewer joins and faster analytics.</p></details>
<details class="iq"><summary>OLTP vs OLAP?</summary><p>OLTP: many small transactions, normalized, row storage, write-heavy. OLAP: few large analytical queries, denormalized, columnar, read-heavy.</p></details>
<details class="iq"><summary>ETL vs ELT?</summary><p>ETL transforms before loading (separate engine). ELT loads raw data first and transforms with the target's compute (Snowflake, Redshift, Spark) — the modern lakehouse pattern.</p></details>
<details class="iq"><summary>Full vs incremental load; how to detect changes?</summary><p>Full reloads everything (simple, heavy). Incremental loads only deltas using a watermark column (updated_at), CDC logs, or EXCEPT/hash comparison, then upserts with MERGE.</p></details>
<details class="iq"><summary>SCD Type 1 vs Type 2?</summary><p>Type 1 overwrites (no history). Type 2 inserts a new row with validity dates/current flag and a new surrogate key (full history).</p></details>
<details class="iq"><summary>Inmon vs Kimball vs Medallion?</summary><p>Inmon: 3NF enterprise warehouse then marts. Kimball: dimensional marts directly. Medallion: bronze (raw) → silver (clean) → gold (business-ready).</p></details>
<details class="iq"><summary>Fact vs dimension; star vs snowflake?</summary><p>Facts hold measures and foreign keys; dimensions hold descriptive attributes. Star keeps dimensions denormalized; snowflake normalizes them.</p></details>
<details class="iq"><summary>How do you find and remove duplicates?</summary><p>Find: GROUP BY key HAVING COUNT(*) &gt; 1, or COUNT(*) OVER (PARTITION BY key). Remove: ROW_NUMBER() OVER (PARTITION BY key ORDER BY updated DESC) and delete rn &gt; 1.</p></details>
<details class="iq"><summary>How do you validate a data migration?</summary><p>Row counts, aggregate checksums, and EXCEPT in both directions (both must be empty).</p></details>
<details class="iq"><summary>Your query got slow overnight. What do you check?</summary><p>Execution plan changes (scan instead of seek, nested loops on big inputs), stale statistics, data volume growth, missing/disabled indexes, parameter sniffing, blocking, fragmentation.</p></details>
<details class="iq"><summary>What are ACID properties?</summary><p>Atomicity, Consistency, Isolation, Durability — guarantees for reliable transactions.</p></details>
<details class="iq"><summary>What does DISTINCT cost?</summary><p>A sort or hash over the result — avoid it when data is already unique.</p></details>
<details class="iq"><summary>Why avoid SELECT * in pipelines?</summary><p>Reads unnecessary columns, breaks unions and inserts when columns are added/reordered, and prevents covering indexes.</p></details>
<details class="iq"><summary>How does a recursive CTE stop?</summary><p>When the recursive member returns no rows — via a WHERE condition or an INNER JOIN that runs out of matches; MAXRECURSION (default 100) is the safety net.</p></details>
`);

<script>
(function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done=store.get('sqlde-done',{});
const ALL=[];CH.forEach(c=>c.lessons.forEach(l=>ALL.push(l)));
const byId={};ALL.forEach(l=>byId[l.id]=l);

/* ---------- SQL engine ---------- */
let SQL=null, db=null, sqlErr=null;
function freshDb(){ if(!SQL) return null; const d=new SQL.Database(); d.exec(SEED); return d; }
const ready=(typeof initSqlJs==='function'?initSqlJs({}):Promise.reject(new Error('SQL engine script did not load'))).then(s=>{SQL=s;db=freshDb();renderSchema();}).catch(e=>{sqlErr=e;});
function run(sql,d){ d=d||db; const out=d.exec(sql); return out; }

/* ---------- highlighting ---------- */
const KW=new Set(('SELECT FROM WHERE AND OR NOT IN IS NULL AS ON JOIN INNER LEFT RIGHT FULL OUTER CROSS GROUP BY ORDER HAVING DISTINCT TOP LIMIT OFFSET UNION ALL EXCEPT INTERSECT INSERT INTO VALUES UPDATE SET DELETE TRUNCATE CREATE ALTER DROP TABLE VIEW INDEX ADD COLUMN PRIMARY KEY FOREIGN REFERENCES CONSTRAINT DEFAULT UNIQUE CHECK CASE WHEN THEN ELSE END WITH RECURSIVE OVER PARTITION ROWS RANGE BETWEEN UNBOUNDED PRECEDING FOLLOWING CURRENT ROW ASC DESC LIKE EXISTS ANY SOME BEGIN PROCEDURE PROC EXEC EXECUTE DECLARE IF PRINT TRY CATCH TRIGGER AFTER INSTEAD OF FOR CLUSTERED NONCLUSTERED COLUMNSTORE INCLUDE USE GO OPTION FUNCTION SCHEME FILEGROUP FILE DATABASE MERGE MATCHED SOURCE TARGET OUTPUT RETURN INT VARCHAR NVARCHAR CHAR DATE DATETIME DATETIME2 DECIMAL FLOAT BIT IDENTITY TRANSACTION COMMIT ROLLBACK GRANT REVOKE DENY STATISTICS REBUILD REORGANIZE LOOP HASH').split(' '));
const FN=new Set('COUNT SUM AVG MIN MAX ROUND ABS CONCAT UPPER LOWER TRIM LTRIM RTRIM REPLACE LEN LENGTH LEFT RIGHT SUBSTRING SUBSTR GETDATE DAY MONTH YEAR DATEPART DATENAME DATETRUNC EOMONTH FORMAT CONVERT CAST DATEADD DATEDIFF ISDATE ISNULL COALESCE NULLIF IFNULL ROW_NUMBER RANK DENSE_RANK NTILE CUME_DIST PERCENT_RANK LAG LEAD FIRST_VALUE LAST_VALUE STRFTIME DATE JULIANDAY OBJECT_ID ERROR_MESSAGE ERROR_NUMBER ERROR_LINE ERROR_PROCEDURE DATALENGTH NOW STRING_AGG GROUP_CONCAT'.split(' '));
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(src){
  let out='',i=0;const n=src.length;
  while(i<n){const c=src[i];
    if(c==='-'&&src[i+1]==='-'){let j=src.indexOf('\n',i);if(j<0)j=n;out+='<span class="cm">'+esc(src.slice(i,j))+'</span>';i=j;continue;}
    if(c==='/'&&src[i+1]==='*'){let j=src.indexOf('*/',i+2);j=j<0?n:j+2;out+='<span class="cm">'+esc(src.slice(i,j))+'</span>';i=j;continue;}
    if(c==="'"){let j=i+1;while(j<n){if(src[j]==="'"){if(src[j+1]==="'"){j+=2;continue;}break;}j++;}j=Math.min(n,j+1);out+='<span class="st">'+esc(src.slice(i,j))+'</span>';i=j;continue;}
    if(/[A-Za-z_@#]/.test(c)){let j=i;while(j<n&&/[A-Za-z0-9_@#]/.test(src[j]))j++;const w=src.slice(i,j),u=w.toUpperCase();
      out+= KW.has(u)?'<span class="kw">'+esc(w)+'</span>':FN.has(u)&&src[j]==='('?'<span class="fnc">'+esc(w)+'</span>':esc(w);i=j;continue;}
    if(/[0-9]/.test(c)){let j=i;while(j<n&&/[0-9.]/.test(src[j]))j++;out+='<span class="nm">'+src.slice(i,j)+'</span>';i=j;continue;}
    out+=esc(c);i++;}
  return out;
}

/* ---------- Venn ---------- */
function venn(type){
  const A='M42 39m-30 0a30 30 0 1 0 60 0a30 30 0 1 0 -60 0',B='M78 39m-30 0a30 30 0 1 0 60 0a30 30 0 1 0 -60 0';
  const id='v'+Math.random().toString(36).slice(2,7);
  const fill='var(--accent)';
  let shapes='';
  const left=`<path d="${A}" fill="${fill}"/>`, right=`<path d="${B}" fill="${fill}"/>`;
  const both=`<clipPath id="${id}a"><path d="${A}"/></clipPath><path d="${B}" clip-path="url(#${id}a)" fill="${fill}"/>`;
  const leftOnly=`<mask id="${id}m"><rect width="120" height="78" fill="#fff"/><path d="${B}" fill="#000"/></mask><path d="${A}" mask="url(#${id}m)" fill="${fill}"/>`;
  const rightOnly=`<mask id="${id}n"><rect width="120" height="78" fill="#fff"/><path d="${A}" fill="#000"/></mask><path d="${B}" mask="url(#${id}n)" fill="${fill}"/>`;
  const map={inner:both,left:left,right:right,full:left+right,leftanti:leftOnly,rightanti:rightOnly,fullanti:leftOnly+rightOnly,none:''};
  shapes=map[type]||'';
  return `<svg viewBox="0 0 120 78" role="img" aria-label="${type} join"><defs></defs>${shapes}<path d="${A}" fill="none" stroke="var(--fg)" stroke-width="1.5"/><path d="${B}" fill="none" stroke="var(--fg)" stroke-width="1.5"/><text x="26" y="43" font-size="12" fill="var(--fg)" font-weight="700">A</text><text x="88" y="43" font-size="12" fill="var(--fg)" font-weight="700">B</text></svg>`;
}

/* ---------- body parser ---------- */
let exCount=0;
function renderBody(src){
  const lines=src.split('\n');let html='',buf=null,mode=null,arg='';
  for(const ln of lines){
    if(buf===null){
      const m=ln.match(/^@@(run|sql|tsql|ex)\s*(.*)$/);
      if(m){mode=m[1];arg=m[2];buf=[];continue;}
      html+=ln+'\n';
    }else{
      if(ln.trim()==='@@'){html+=block(mode,arg,buf.join('\n').replace(/\s+$/,''));buf=null;continue;}
      buf.push(ln);
    }
  }
  html=html.replace(/\{\{venn:([a-z ,]+)\}\}/g,(m,t)=>'<div class="venns">'+t.split(',').map(x=>{x=x.trim();return `<figure>${venn(x)}<figcaption>${x.replace('anti',' anti')}</figcaption></figure>`}).join('')+'</div>');
  return html;
}
function block(mode,arg,code){
  if(mode==='ex'){const i=exCount++;return `<div class="exer" data-ex="${i}"><div class="q"><small>Exercise</small>${arg}</div><textarea spellcheck="false" aria-label="Your answer">-- write your query here\n</textarea><div class="bar"><button class="btn" data-act="run">Run</button><button class="btn" data-act="check">Check answer</button><button class="btn ghost" data-act="sol">Show solution</button><span class="verdict"></span></div><div class="res"></div><script type="text/plain" class="sol">${esc(code)}<\/script></div>`;}
  const label=mode==='run'?'Example':mode==='tsql'?(arg||'T-SQL (SQL Server)'):(arg||'Syntax');
  const tag=mode==='run'?'runs here':mode==='tsql'?'SQL Server':'';
  const enc=encodeURIComponent(code);
  return `<div class="ex ${mode==='tsql'?'ts':''}"><div class="exh">${mode==='run'&&arg?arg:label}<span class="tag">${tag}</span></div><pre>${hl(code)}</pre><div class="exf">${mode==='run'?`<button class="btn" data-try="${enc}">Try it Yourself »</button>`:''}</div></div>`;
}

/* ---------- results ---------- */
function table(res){
  if(!res.length) return '<div class="meta">Statement executed. No rows returned.</div>';
  return res.map(r=>`<div class="meta">${r.values.length} row${r.values.length===1?'':'s'}</div><table><thead><tr>${r.columns.map(c=>'<th>'+esc(c)+'</th>').join('')}</tr></thead><tbody>${r.values.map(v=>'<tr>'+v.map(x=>x===null?'<td class="null">NULL</td>':'<td>'+esc(String(x))+'</td>').join('')+'</tr>').join('')}</tbody></table>`).join('');
}
function engineMsg(){return sqlErr?'<div class="err">The SQL engine could not load ('+esc(sqlErr.message)+'). Reading still works; the Try-it editors need it.</div>':'<div class="meta">Loading SQL engine…</div>';}

/* ---------- playground ---------- */
function openPg(sql){ $('#pgwrap').hidden=false; if(sql!=null) $('#pgSql').value=sql; $('#pgSql').focus(); if(sql!=null) pgRun(); }
function pgRun(){ const box=$('#pgRes'); if(!db){box.innerHTML=engineMsg();ready.then(()=>{if(db)pgRun();});return;}
  try{box.innerHTML=table(run($('#pgSql').value));}catch(e){box.innerHTML='<div class="err">'+esc(e.message)+'</div>';} renderSchema(); }
function renderSchema(){ if(!db) return; try{
  const t=db.exec("SELECT name FROM sqlite_master WHERE type IN ('table','view') AND name NOT LIKE 'sqlite_%' ORDER BY name");
  const names=t.length?t[0].values.map(v=>v[0]):[];
  $('#schema').innerHTML='<div style="cursor:default">Tables — click to preview:</div>'+names.map(n=>{const c=db.exec(`PRAGMA table_info("${n}")`);const cols=c.length?c[0].values.map(v=>v[1]).join(', '):'';return `<div data-tbl="${n}"><b>${n}</b> (${cols})</div>`}).join('');
}catch(e){} }
$('#openPg').onclick=()=>openPg(null);
$('#pgClose').onclick=()=>{$('#pgwrap').hidden=true;};
$('#pgRun').onclick=pgRun;
$('#pgReset').onclick=()=>{ if(SQL){db.close();db=freshDb();$('#pgRes').innerHTML='<div class="meta">Database reset to the original sample data.</div>';renderSchema();}};
$('#pgSql').addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();pgRun();} if(e.key==='Tab'){e.preventDefault();const t=e.target,s=t.selectionStart;t.value=t.value.slice(0,s)+'  '+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+2;} });
$('#schema').addEventListener('click',e=>{const d=e.target.closest('[data-tbl]');if(d){$('#pgSql').value='SELECT * FROM '+d.dataset.tbl+';';pgRun();}});
$('#pgwrap').addEventListener('click',e=>{if(e.target.id==='pgwrap')$('#pgwrap').hidden=true;});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#pgwrap').hidden=true; if(e.key==='/'&&document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#search').focus();}});

/* ---------- exercises ---------- */
function norm(res){ if(!res.length) return {cols:0,rows:[]}; const r=res[res.length-1]; return {cols:r.columns.length,rows:r.values.map(v=>JSON.stringify(v.map(x=>typeof x==='number'?Math.round(x*1000)/1000:x)))}; }
$('#page').addEventListener('click',e=>{
  const t=e.target.closest('[data-try]'); if(t){openPg(decodeURIComponent(t.dataset.try));return;}
  const b=e.target.closest('[data-act]'); if(!b) return; const ex=b.closest('.exer'); const res=ex.querySelector('.res'), v=ex.querySelector('.verdict'), ta=ex.querySelector('textarea');
  const sol=ex.querySelector('.sol').textContent.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
  if(b.dataset.act==='sol'){ ta.value=sol; v.textContent=''; return; }
  if(!db){res.innerHTML=engineMsg();return;}
  const d=freshDb();
  try{ const mine=run(ta.value,d); res.innerHTML=table(mine);
    if(b.dataset.act==='check'){ const sd=freshDb(); let want; try{want=norm(run(sol,sd));}finally{sd.close();} const got=norm(mine); const ordered=/order\s+by/i.test(sol.replace(/over\s*\([^)]*\)/gi,''));
      const a=ordered?got.rows:[...got.rows].sort(), w=ordered?want.rows:[...want.rows].sort();
      const ok=got.cols===want.cols&&a.length===w.length&&a.every((x,i)=>x===w[i]);
      v.className='verdict '+(ok?'ok':'no'); v.textContent=ok?'✔ Correct — result matches.':'✘ Not yet — expected '+want.rows.length+' row(s) × '+want.cols+' column(s).';
      if(ok){ const l=byId[curId]; if(l){done[l.id]=1;store.set('sqlde-done',done);renderSide();} } }
  }catch(err){ res.innerHTML='<div class="err">'+esc(err.message)+'</div>'; v.textContent=''; } finally{d.close();}
});
$('#page').addEventListener('keydown',e=>{ if(e.target.tagName==='TEXTAREA'&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();e.target.closest('.exer').querySelector('[data-act=run]').click();}});

/* ---------- quiz ---------- */
function renderQuiz(l){ return '<div class="quiz">'+l.quiz.map((q,i)=>`<div class="qq" data-a="${q.a}"><p>${i+1}. ${q.q}</p>${q.o.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}<div class="why" hidden>${q.w||''}</div></div>`).join('')+'<p><button class="btn" id="grade">Check my answers</button> <span id="score" class="verdict"></span></p></div>'; }
document.addEventListener('click',e=>{ if(e.target.id!=='grade') return; let s=0; const qs=[...document.querySelectorAll('.qq')]; qs.forEach(q=>{const a=+q.dataset.a;const sel=q.querySelector('input:checked');q.querySelectorAll('label').forEach((lb,j)=>{lb.classList.remove('good','bad');if(j===a)lb.classList.add('good');});if(sel&&+sel.value===a)s++;else if(sel)sel.parentElement.classList.add('bad');q.querySelector('.why').hidden=false;});
  const el=$('#score'); el.textContent=`Score: ${s} / ${qs.length}`; el.className='verdict '+(s===qs.length?'ok':'no'); if(s>=Math.ceil(qs.length*0.7)){done[curId]=1;store.set('sqlde-done',done);renderSide();} });

/* ---------- sidebar ---------- */
let closed=store.get('sqlde-closed',{});
function renderSide(filter){
  const f=(filter||'').toLowerCase().trim();
  $('#side').innerHTML='<div class="chap"><ul><li><a href="#home" class="'+(curId==='home'?'on':'')+'"><span class="ck">⌂</span>Home &amp; how to use</a></li></ul></div>'+CH.map(c=>{
    const ls=c.lessons.filter(l=>!f||l.title.toLowerCase().includes(f)||(l.body||'').toLowerCase().includes(f));
    if(!ls.length) return '';
    return `<div class="chap ${closed[c.id]&&!f?'closed':''}" data-c="${c.id}"><button aria-expanded="${!(closed[c.id]&&!f)}">${c.title}<span>${c.lessons.filter(l=>done[l.id]).length}/${c.lessons.length}</span></button><ul>${ls.map(l=>`<li><a href="#${l.id}" class="${l.id===curId?'on':''}"><span class="ck">${done[l.id]?'✔':''}</span>${l.title}</a></li>`).join('')}</ul></div>`;}).join('');
  const n=ALL.filter(l=>done[l.id]).length; $('#prog').textContent=`${n}/${ALL.length} done`;
}
$('#side').addEventListener('click',e=>{const b=e.target.closest('.chap>button');if(b){const c=b.parentElement.dataset.c;closed[c]=!closed[c];store.set('sqlde-closed',closed);renderSide($('#search').value);}
  if(e.target.closest('a')) $('#side').classList.remove('open');});
$('#search').addEventListener('input',e=>renderSide(e.target.value));
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#themeBtn').onclick=()=>{const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';store.set('sqlde-theme',r.dataset.theme);};
const th=store.get('sqlde-theme',null); if(th) document.documentElement.dataset.theme=th;

/* ---------- routing ---------- */
let curId='home';
function home(){
  return `<div class="eyebrow">Interview reference · ${ALL.length} lessons</div><h1>SQL for Data Engineers</h1>
  <p>One place for every SQL concept a data engineering interview can touch: from <code>SELECT</code> to window functions, CTEs, views, stored procedures, indexes, execution plans, partitioning and data-warehouse design (ETL, SCD, Medallion). It follows the full course by Baraa Khatib Salkini and adds the data-engineering patterns interviewers ask about next.</p>
  <div class="box tip"><b class="lbl">How to use this page</b><ul style="margin:4px 0"><li><b>Read</b> lessons in order from the left menu, or search with <kbd>/</kbd>.</li><li><b>Try it Yourself »</b> opens a live SQL editor on a sample database, right in your browser. Press <kbd>Ctrl</kbd>+<kbd>Enter</kbd> to run.</li><li><b>Exercises</b> check your query against the expected result. <b>Quizzes</b> close each chapter.</li><li><b>Purple boxes</b> are interview questions with model answers — open, answer aloud, compare.</li><li>Lessons you pass are ticked ✔ and remembered in this browser.</li></ul></div>
  <div class="box note"><b class="lbl">Dialect note</b>Lessons teach <b>SQL Server (T-SQL)</b> syntax, as the course does. The playground runs <b>SQLite</b>, so runnable examples use portable SQL (<code>LIMIT</code> instead of <code>TOP</code>, <code>strftime</code> for dates). Blue-edged boxes marked <i>SQL Server</i> are read-only T-SQL.</div>
  <h2>Chapters</h2><div class="home-grid">${CH.map(c=>`<a href="#${c.lessons[0].id}"><b>${c.title}</b><span>${c.blurb}</span></a>`).join('')}</div>
  <h2>Sample database</h2><p>Every example uses the course's <i>SalesDB</i> (schema prefix dropped) plus the small <i>MyDatabase</i> tables:</p>
  <div class="tw"><table class="t"><tr><th>Table</th><th>Columns</th><th>Rows</th></tr>
  <tr><td><code>my_customers</code></td><td>id, first_name, country, score</td><td>5</td></tr>
  <tr><td><code>my_orders</code></td><td>order_id, customer_id, order_date, sales</td><td>4 (one points to a missing customer 6)</td></tr>
  <tr><td><code>customers</code></td><td>CustomerID, FirstName, LastName, Country, Score</td><td>5</td></tr>
  <tr><td><code>employees</code></td><td>EmployeeID, FirstName, LastName, Department, BirthDate, Gender, Salary, ManagerID</td><td>5 (self-referencing hierarchy)</td></tr>
  <tr><td><code>products</code></td><td>ProductID, Product, Category, Price</td><td>5</td></tr>
  <tr><td><code>orders</code></td><td>OrderID, ProductID, CustomerID, SalesPersonID, OrderDate, ShipDate, OrderStatus, ShipAddress, BillAddress, Quantity, Sales, CreationTime</td><td>10</td></tr>
  <tr><td><code>orders_archive</code></td><td>same as orders (no addresses) — contains duplicates on purpose</td><td>10</td></tr></table></div>
  <p><button class="btn" data-try="${encodeURIComponent('SELECT * FROM orders;')}">Open the playground »</button></p>`;
}
function show(id){
  exCount=0; curId=byId[id]?id:'home'; const l=byId[curId];
  let html;
  if(!l) html=home();
  else{ const i=ALL.indexOf(l), p=ALL[i-1], n=ALL[i+1];
    const nav=`<div class="navbtns">${p?`<a class="btn" href="#${p.id}">❮ Previous</a>`:'<span></span>'}${n?`<a class="btn" href="#${n.id}">Next ❯</a>`:'<span></span>'}</div>`;
    html=`<div class="eyebrow">${l.ch.title}</div><h1>${l.title}</h1>${nav}${l.quiz?renderQuiz(l):renderBody(l.body)}<div class="done-row"><button class="btn ghost" id="markDone">${done[l.id]?'✔ Completed — undo':'Mark lesson complete'}</button></div>${nav}`; }
  $('#page').innerHTML=html; renderSide($('#search').value); window.scrollTo(0,0);
  const md=$('#markDone'); if(md) md.onclick=()=>{ if(done[curId]) delete done[curId]; else done[curId]=1; store.set('sqlde-done',done); show(curId); };
  document.querySelectorAll('.exer textarea').forEach(ta=>ta.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart;ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=s+2;}}));
}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||'home');
})();
</script>
