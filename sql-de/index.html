C('window','9 · Aggregates & Window Functions','COUNT/SUM/AVG, OVER(), frames, ranking and value functions');
L('aggregates','Aggregate Functions',`
<p>Aggregate functions take many rows and return one value.</p>
@@run The big numbers of the business
SELECT
  COUNT(*)    AS total_orders,   -- 10
  SUM(Sales)  AS total_sales,    -- 380
  AVG(Sales)  AS avg_sales,      -- 38
  MAX(Sales)  AS highest_sales,  -- 90
  MIN(Sales)  AS lowest_sales    -- 10
FROM orders;
@@
<p>Add <code>GROUP BY</code> to break the big numbers down by a dimension:</p>
@@run Same numbers per customer
SELECT CustomerID, COUNT(*) AS total_orders, SUM(Sales) AS total_sales, AVG(Sales) AS avg_sales, MAX(Sales) AS highest, MIN(Sales) AS lowest
FROM orders GROUP BY CustomerID;
@@
`);
L('window-basics','Window Functions vs GROUP BY',`
<p>A <b>window function</b> performs a calculation (like an aggregation) over a subset of rows <b>without losing row-level detail</b>. GROUP BY squeezes rows into one per group; a window function keeps every row and adds the result beside it.</p>
@@run GROUP BY: 4 rows, one per product — details lost
SELECT ProductID, SUM(Sales) AS total_sales FROM orders GROUP BY ProductID;
@@
@@run Window: 10 rows, every order keeps its details plus the product total
SELECT OrderID, OrderDate, ProductID, Sales,
       SUM(Sales) OVER (PARTITION BY ProductID) AS total_sales_by_product
FROM orders;
@@
<div class="box warn"><b class="lbl">Why GROUP BY fails here</b>Adding OrderID and OrderDate to a GROUP BY changes the granularity to one row per order — the "total" becomes each order's own sales. You can't have aggregation and detail together with GROUP BY.</div>
<div class="tw"><table class="t"><tr><th></th><th>GROUP BY</th><th>Window functions</th></tr>
<tr><td>Rows returned</td><td>One per group</td><td>All input rows</td></tr>
<tr><td>Functions</td><td>Aggregates only</td><td>Aggregates + ranking + value (LAG/LEAD…)</td></tr>
<tr><td>Use for</td><td>Simple aggregations</td><td>Aggregation + detail, advanced analytics</td></tr></table></div>
<h2>Function families</h2>
<div class="tw"><table class="t"><tr><th>Family</th><th>Functions</th><th>Expression</th><th>ORDER BY</th><th>Frame</th></tr>
<tr><td>Aggregate</td><td>COUNT, SUM, AVG, MIN, MAX</td><td>Required (COUNT any type, others numeric)</td><td>Optional</td><td>Optional</td></tr>
<tr><td>Ranking</td><td>ROW_NUMBER, RANK, DENSE_RANK, CUME_DIST, PERCENT_RANK</td><td>Empty</td><td>Required</td><td>Not allowed</td></tr>
<tr><td></td><td>NTILE(n)</td><td>A number</td><td>Required</td><td>Not allowed</td></tr>
<tr><td>Value (analytic)</td><td>LAG, LEAD</td><td>Any type</td><td>Required</td><td>Not allowed</td></tr>
<tr><td></td><td>FIRST_VALUE, LAST_VALUE</td><td>Any type</td><td>Required</td><td>Optional (LAST_VALUE: should be set)</td></tr></table></div>
`);
L('window-syntax','Window Syntax: PARTITION BY, ORDER BY, Frame',`
@@sql
AVG(Sales) OVER (
    PARTITION BY Category          -- divide rows into windows
    ORDER BY OrderDate             -- sort within each window
    ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW   -- frame: subset inside window
)
@@
<h2>PARTITION BY</h2><p>Without it, the whole result is one window. With it, each distinct value (or combination of values) is a separate window and the calculation restarts per window.</p>
@@run Three granularities in one query
SELECT OrderID, ProductID, OrderStatus, Sales,
  SUM(Sales) OVER ()                                  AS total_sales,
  SUM(Sales) OVER (PARTITION BY ProductID)            AS sales_by_product,
  SUM(Sales) OVER (PARTITION BY ProductID, OrderStatus) AS sales_by_product_status
FROM orders;
@@
<h2>ORDER BY</h2>
@@run Rank orders by sales, highest first
SELECT OrderID, OrderDate, Sales, RANK() OVER (ORDER BY Sales DESC) AS sales_rank
FROM orders;
@@
<h2>Frame clause</h2>
<p>A frame defines which rows <i>inside</i> each window take part in the calculation. Syntax: <code>ROWS|RANGE BETWEEN &lt;lower&gt; AND &lt;upper&gt;</code>. Lower: <code>CURRENT ROW</code>, <code>n PRECEDING</code>, <code>UNBOUNDED PRECEDING</code>. Upper: <code>CURRENT ROW</code>, <code>n FOLLOWING</code>, <code>UNBOUNDED FOLLOWING</code>. Requires ORDER BY; the lower boundary must come before the upper.</p>
<div class="tw"><table class="t"><tr><th>Frame</th><th>Rows used for current row</th></tr>
<tr><td>CURRENT ROW AND 2 FOLLOWING</td><td>This row + next 2</td></tr><tr><td>CURRENT ROW AND UNBOUNDED FOLLOWING</td><td>This row to the end</td></tr><tr><td>1 PRECEDING AND CURRENT ROW</td><td>Previous + this</td></tr><tr><td>UNBOUNDED PRECEDING AND CURRENT ROW</td><td>Start to this row (running total)</td></tr><tr><td>1 PRECEDING AND 1 FOLLOWING</td><td>Neighbours on both sides</td></tr><tr><td>UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING</td><td>Whole window</td></tr></table></div>
@@run Frame inside partitions — this row plus the next two orders of the same status
SELECT OrderID, OrderDate, OrderStatus, Sales,
  SUM(Sales) OVER (PARTITION BY OrderStatus ORDER BY OrderDate
                   ROWS BETWEEN CURRENT ROW AND 2 FOLLOWING) AS total_sales
FROM orders;
@@
<div class="box warn"><b class="lbl">Hidden default frame</b>ORDER BY with an aggregate silently applies <code>RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</code> — that's why <code>SUM(x) OVER (ORDER BY d)</code> gives a running total. Shortcut <code>ROWS 2 PRECEDING</code> works only with PRECEDING.</div>
<details class="iq"><summary>Interview: ROWS vs RANGE?</summary><p>ROWS counts physical rows. RANGE groups rows with the same ORDER BY value (peers) together. With duplicate dates, a RANGE running total jumps by both rows at once; ROWS adds them one by one. Specify ROWS explicitly when you mean rows — it is also faster in SQL Server.</p></details>
<h2>Rules</h2>
<ol><li>Window functions are allowed only in <b>SELECT</b> and <b>ORDER BY</b> — not WHERE, GROUP BY or HAVING. Filter with a subquery/CTE.</li>
<li>You can't nest a window function inside another.</li>
<li>They run <b>after</b> WHERE filtering.</li>
<li>With GROUP BY in the same query, use only columns that are in the GROUP BY (or aggregated).</li></ol>
@@run Window + GROUP BY: rank customers by total sales
SELECT CustomerID, SUM(Sales) AS total_sales,
       RANK() OVER (ORDER BY SUM(Sales) DESC) AS rank_customers
FROM orders
GROUP BY CustomerID;
@@
`);
L('window-agg','Window Aggregates & Use Cases',`
<h2>COUNT</h2>
<p><code>COUNT(*)</code>/<code>COUNT(1)</code> count rows (NULLs included); <code>COUNT(column)</code> ignores NULLs; COUNT accepts any data type.</p>
@@run Orders per customer beside each order
SELECT OrderID, OrderDate, CustomerID,
  COUNT(*) OVER ()                         AS total_orders,
  COUNT(*) OVER (PARTITION BY CustomerID)  AS orders_by_customer
FROM orders;
@@
@@run Data quality: how many scores are missing?
SELECT *, COUNT(*) OVER () AS total_customers, COUNT(Score) OVER () AS total_scores
FROM customers;
@@
<h3>Use case: find duplicates in a primary key</h3>
@@run Primary key check on orders_archive — anything &gt; 1 is a duplicate
SELECT * FROM (
  SELECT OrderID, COUNT(*) OVER (PARTITION BY OrderID) AS check_pk
  FROM orders_archive
) t WHERE check_pk > 1;
@@
<h2>SUM — part-to-whole (percentage of total)</h2>
@@run Each order's share of total sales
SELECT OrderID, ProductID, Sales,
  SUM(Sales) OVER () AS total_sales,
  ROUND(CAST(Sales AS FLOAT) / SUM(Sales) OVER () * 100, 2) AS pct_of_total
FROM orders;
@@
<h2>AVG — compare to average</h2>
@@run Orders above the overall average
SELECT * FROM (
  SELECT OrderID, ProductID, Sales, AVG(Sales) OVER () AS avg_sales FROM orders
) t WHERE Sales > avg_sales;
@@
<h2>MIN / MAX — extremes and deviation</h2>
@@run Distance of each sale from the lowest and highest
SELECT OrderID, Sales,
  MIN(Sales) OVER () AS lowest, MAX(Sales) OVER () AS highest,
  Sales - MIN(Sales) OVER () AS deviation_from_min,
  MAX(Sales) OVER () - Sales AS deviation_from_max
FROM orders;
@@
@@run Employees with the highest salary
SELECT * FROM (SELECT *, MAX(Salary) OVER () AS highest_salary FROM employees) t
WHERE Salary = highest_salary;
@@
`);
L('running-rolling','Running Total, Rolling Total & Moving Average',`
<p>Both aggregate a sequence over time and update as each new row arrives.</p>
<ul><li><b>Running total</b> — everything from the first row to the current row; nothing is dropped. Frame: <code>UNBOUNDED PRECEDING AND CURRENT ROW</code> (the default with ORDER BY). Good for tracking against targets.</li>
<li><b>Rolling total</b> — a fixed window (e.g. last 3 months). The oldest row drops off as a new one enters. Frame: <code>2 PRECEDING AND CURRENT ROW</code>. Good for focused, recent trend analysis.</li></ul>
@@run Running vs rolling (3-order) totals
SELECT OrderID, OrderDate, Sales,
  SUM(Sales) OVER (ORDER BY OrderDate)                                         AS running_total,
  SUM(Sales) OVER (ORDER BY OrderDate ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS rolling_3
FROM orders;
@@
@@run Moving average per product, and a rolling average of current + next order
SELECT OrderID, ProductID, OrderDate, Sales,
  AVG(Sales) OVER (PARTITION BY ProductID ORDER BY OrderDate) AS moving_avg,
  AVG(Sales) OVER (PARTITION BY ProductID ORDER BY OrderDate
                   ROWS BETWEEN CURRENT ROW AND 1 FOLLOWING)  AS rolling_avg
FROM orders;
@@
<h2>Use-case summary</h2>
<div class="tw"><table class="t"><tr><th>Window definition</th><th>Analysis</th></tr>
<tr><td><code>OVER ()</code></td><td>Overall total</td></tr><tr><td><code>OVER (PARTITION BY x)</code></td><td>Total per group — compare categories</td></tr><tr><td><code>OVER (ORDER BY d)</code></td><td>Running total — progress over time</td></tr><tr><td><code>OVER (ORDER BY d ROWS n PRECEDING)</code></td><td>Rolling total — fixed recent window</td></tr></table></div>
@@ex Show OrderID, OrderDate, Sales and the cumulative (running) sales ordered by OrderDate (column running_sales).
SELECT OrderID, OrderDate, Sales, SUM(Sales) OVER (ORDER BY OrderDate) AS running_sales FROM orders;
@@
`);
L('ranking','Ranking Functions',`
<p>Two ranking methods: <b>integer-based</b> (ROW_NUMBER, RANK, DENSE_RANK, NTILE) — answers "top 3"; <b>percentage-based</b> (CUME_DIST, PERCENT_RANK) — answers "top 20%". All require ORDER BY, take no expression (except NTILE), and don't allow frames.</p>
@@run ROW_NUMBER vs RANK vs DENSE_RANK on sales (note the ties at 60 and 20)
SELECT OrderID, Sales,
  ROW_NUMBER() OVER (ORDER BY Sales DESC) AS row_num,
  RANK()       OVER (ORDER BY Sales DESC) AS rnk,
  DENSE_RANK() OVER (ORDER BY Sales DESC) AS dense_rnk
FROM orders;
@@
<div class="tw"><table class="t"><tr><th></th><th>ROW_NUMBER</th><th>RANK</th><th>DENSE_RANK</th></tr>
<tr><td>Unique numbers</td><td>Yes</td><td>No — ties share</td><td>No — ties share</td></tr>
<tr><td>Handles ties</td><td>No</td><td>Yes</td><td>Yes</td></tr>
<tr><td>Gaps after ties</td><td>No</td><td>Yes (1,2,2,4)</td><td>No (1,2,2,3)</td></tr></table></div>
<p>RANK is like the Olympics: two golds, no silver, next is bronze.</p>
<h2>ROW_NUMBER use cases</h2>
@@run Top-N per group: highest sale for each product
SELECT * FROM (
  SELECT OrderID, ProductID, Sales,
         ROW_NUMBER() OVER (PARTITION BY ProductID ORDER BY Sales DESC) AS rank_by_product
  FROM orders
) t WHERE rank_by_product = 1;
@@
@@run Bottom-N: lowest 2 customers by total sales
SELECT * FROM (
  SELECT CustomerID, SUM(Sales) AS total_sales,
         ROW_NUMBER() OVER (ORDER BY SUM(Sales)) AS rank_customers
  FROM orders GROUP BY CustomerID
) t WHERE rank_customers <= 2;
@@
@@run Generate unique IDs for a table without a key (pagination, exports)
SELECT ROW_NUMBER() OVER (ORDER BY OrderID, OrderDate) AS unique_id, * FROM orders_archive;
@@
@@run Deduplicate: keep the latest version of each order (most common DE interview SQL)
SELECT * FROM (
  SELECT *, ROW_NUMBER() OVER (PARTITION BY OrderID ORDER BY CreationTime DESC) AS rn
  FROM orders_archive
) t WHERE rn = 1;          -- rn > 1 = the bad rows to report or delete
@@
<h2>NTILE(n) — buckets</h2>
<p>Divides rows into n roughly equal groups. Bucket size = rows ÷ n; when uneven, <b>larger groups come first</b> (10 rows into 3 → 4, 3, 3).</p>
@@run Segment orders into High / Medium / Low
SELECT *, CASE buckets WHEN 1 THEN 'High' WHEN 2 THEN 'Medium' ELSE 'Low' END AS segment
FROM (SELECT OrderID, Sales, NTILE(3) OVER (ORDER BY Sales DESC) AS buckets FROM orders) t;
@@
<p>Data engineers use NTILE for <b>load balancing</b>: split a huge table into batches (by primary key) and export/load one bucket at a time instead of one giant transfer that stresses the network.</p>
<h2>CUME_DIST and PERCENT_RANK</h2>
<div class="tw"><table class="t"><tr><th></th><th>Formula</th><th>Ties take</th><th>Nature</th></tr>
<tr><td>CUME_DIST</td><td>position ÷ number of rows</td><td>Last position of the tie</td><td>Inclusive — distribution</td></tr>
<tr><td>PERCENT_RANK</td><td>(position − 1) ÷ (rows − 1)</td><td>First position of the tie</td><td>Exclusive — relative position, 0..1</td></tr></table></div>
@@run Products within the highest 40% of prices
SELECT * FROM (
  SELECT Product, Price,
         CUME_DIST()    OVER (ORDER BY Price DESC) AS dist_rank,
         PERCENT_RANK() OVER (ORDER BY Price DESC) AS pct_rank
  FROM products
) t WHERE dist_rank <= 0.4;
@@
@@ex Rank customers by total sales with DENSE_RANK, highest first (columns: CustomerID, total_sales, rnk).
SELECT CustomerID, SUM(Sales) AS total_sales, DENSE_RANK() OVER (ORDER BY SUM(Sales) DESC) AS rnk FROM orders GROUP BY CustomerID;
@@
@@ex From orders_archive, return only the duplicate (older) rows: every row except the latest CreationTime per OrderID. Columns: OrderID, CreationTime.
SELECT OrderID, CreationTime FROM (SELECT OrderID, CreationTime, ROW_NUMBER() OVER (PARTITION BY OrderID ORDER BY CreationTime DESC) rn FROM orders_archive) t WHERE rn > 1;
@@
`);
L('value-fn','Value Functions: LAG, LEAD, FIRST_VALUE, LAST_VALUE',`
<p>Access a value from <b>another row</b> without self-joins.</p>
@@sql
LEAD(expression, offset = 1, default = NULL) OVER (PARTITION BY … ORDER BY …)
LAG (expression, offset = 1, default = NULL) OVER (…)
@@
@@run Next and previous month's sales, 2 months ahead/ago with default 0
SELECT month, sales,
  LEAD(sales)       OVER (ORDER BY month) AS next_month,
  LAG(sales)        OVER (ORDER BY month) AS prev_month,
  LEAD(sales, 2, 0) OVER (ORDER BY month) AS two_ahead,
  LAG(sales, 2, 0)  OVER (ORDER BY month) AS two_ago
FROM (SELECT 1 AS month, 20 AS sales UNION ALL SELECT 2,10 UNION ALL SELECT 3,30 UNION ALL SELECT 4,5) m;
@@
<h2>Use case: month-over-month (time-series) analysis</h2>
@@run MoM % change
SELECT *, current_sales - prev_sales AS mom_change,
       ROUND(CAST(current_sales - prev_sales AS FLOAT) / prev_sales * 100, 1) AS mom_pct
FROM (
  SELECT CAST(strftime('%m', OrderDate) AS INT) AS order_month,
         SUM(Sales) AS current_sales,
         LAG(SUM(Sales)) OVER (ORDER BY CAST(strftime('%m', OrderDate) AS INT)) AS prev_sales
  FROM orders GROUP BY CAST(strftime('%m', OrderDate) AS INT)
) t;
@@
<h2>Use case: customer retention (average days between orders)</h2>
@@run Rank customers by loyalty: shortest average gap first
SELECT CustomerID,
       AVG(days_until_next) AS avg_days,
       RANK() OVER (ORDER BY COALESCE(AVG(days_until_next), 999999)) AS rank_avg
FROM (
  SELECT OrderID, CustomerID, OrderDate,
         julianday(LEAD(OrderDate) OVER (PARTITION BY CustomerID ORDER BY OrderDate)) - julianday(OrderDate) AS days_until_next
  FROM orders
) t GROUP BY CustomerID;
@@
<h2>FIRST_VALUE &amp; LAST_VALUE</h2>
<p>LAST_VALUE with the default frame returns the current row (the frame stops at CURRENT ROW). Fix the frame — or flip the sort and use FIRST_VALUE.</p>
@@run Lowest and highest sale per product, and distance from the lowest
SELECT OrderID, ProductID, Sales,
  FIRST_VALUE(Sales) OVER (PARTITION BY ProductID ORDER BY Sales) AS lowest,
  LAST_VALUE(Sales)  OVER (PARTITION BY ProductID ORDER BY Sales
                           ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING) AS highest,
  FIRST_VALUE(Sales) OVER (PARTITION BY ProductID ORDER BY Sales DESC) AS highest2,
  Sales - FIRST_VALUE(Sales) OVER (PARTITION BY ProductID ORDER BY Sales) AS diff_from_lowest
FROM orders;
@@
<details class="iq"><summary>Interview: Find the second-highest salary.</summary><p><code>SELECT Salary FROM (SELECT Salary, DENSE_RANK() OVER (ORDER BY Salary DESC) dr FROM employees) t WHERE dr = 2;</code> DENSE_RANK handles ties so duplicates of the top salary don't push the answer. Alternative: <code>SELECT MAX(Salary) FROM employees WHERE Salary &lt; (SELECT MAX(Salary) FROM employees)</code>.</p></details>
<details class="iq"><summary>Interview: Find gaps/consecutive streaks (gaps-and-islands).</summary><p>Subtract a ROW_NUMBER from the date (or id): <code>DATEADD(day, -ROW_NUMBER() OVER (PARTITION BY user ORDER BY d), d)</code>. Consecutive dates get the same "island" value; GROUP BY it to get streak start, end and length.</p></details>
@@ex For each order show OrderID, OrderDate, Sales and the previous order's Sales by date (column prev_sales).
SELECT OrderID, OrderDate, Sales, LAG(Sales) OVER (ORDER BY OrderDate) AS prev_sales FROM orders;
@@
`);

C('advanced','10 · Advanced Techniques','Subqueries, CTEs, views, CTAS, temp tables, stored procedures, triggers');
L('why-advanced','Why Advanced Techniques?',`
<p>In real projects many people hit the same database: financial analysts, risk managers, data engineers building ETL into a warehouse, analysts preparing Power BI data, data scientists building features. Left alone, this produces five problems:</p>
<ol><li><b>Redundancy</b> — the same complex logic rewritten in many queries, not always correctly.</li>
<li><b>Performance</b> — huge queries everywhere; 5-hour loads, 40-minute reports.</li>
<li><b>Complexity</b> — everyone must learn the physical data model and keeps asking the database team how tables connect.</li>
<li><b>Database stress</b> — repeated heavy queries bring the server down.</li>
<li><b>Security</b> — everyone has direct access to physical tables and sensitive columns.</li></ol>
<p>Five techniques solve these: <b>subqueries</b>, <b>CTEs</b>, <b>views</b>, <b>temporary tables</b> and <b>CTAS</b>.</p>
<h2>How the database works underneath</h2>
<div class="tw"><table class="t"><tr><th>Storage</th><th>What lives there</th></tr>
<tr><td><b>Disk — user data</b></td><td>Your tables (permanent, large, slow)</td></tr>
<tr><td><b>Disk — system catalog</b></td><td>Metadata: data about data (table and column names, types, view definitions). Browse it with <code>INFORMATION_SCHEMA.COLUMNS</code> / <code>sys.tables</code></td></tr>
<tr><td><b>Disk — temp storage</b></td><td>Temporary tables (<code>tempdb</code> in SQL Server), cleaned up when the session ends</td></tr>
<tr><td><b>Cache (memory)</b></td><td>Short-term, very fast: intermediate results of subqueries and CTEs, cached execution plans</td></tr></table></div>
@@run SQLite's catalog (SQL Server: SELECT * FROM INFORMATION_SCHEMA.COLUMNS)
SELECT name, type, sql FROM sqlite_master WHERE type = 'table';
@@
`);
L('subquery-basics','Subqueries: Concept & Result Types',`
<p>A <b>subquery</b> is a query inside another query (the <b>main</b> or outer query). It runs first, its result is held as an intermediate result in memory, the main query uses it, and then it is destroyed. It is visible only to its own main query, and is used only once, in one place.</p>
<p>Purpose: break a complex task into steps (join → filter → transform → aggregate), each a subquery feeding the next.</p>
<div class="tw"><table class="t"><tr><th>Result type</th><th>Shape</th><th>Example</th></tr>
<tr><td><b>Scalar</b></td><td>One value</td><td><code>SELECT AVG(Sales) FROM orders</code></td></tr>
<tr><td><b>Row</b></td><td>One column, many rows</td><td><code>SELECT CustomerID FROM orders</code></td></tr>
<tr><td><b>Table</b></td><td>Many columns and rows</td><td><code>SELECT OrderID, OrderDate FROM orders</code></td></tr></table></div>
<p>Other categories: by <b>location</b> (SELECT, FROM, JOIN, WHERE) and by <b>dependency</b> (non-correlated vs correlated).</p>
`);
L('subquery-from','Subquery in FROM, SELECT and JOIN',`
<h2>In FROM — a temporary table for the main query</h2>
<p>SQL Server requires an alias for a subquery in FROM.</p>
@@run Products priced above the average price
SELECT * FROM (
    SELECT ProductID, Price, AVG(Price) OVER () AS avg_price
    FROM products
) t
WHERE Price > avg_price;
@@
@@run Rank customers by total sales
SELECT *, RANK() OVER (ORDER BY total_sales DESC) AS customer_rank
FROM (SELECT CustomerID, SUM(Sales) AS total_sales FROM orders GROUP BY CustomerID) t;
@@
<h2>In SELECT — must be scalar</h2>
@@run Product details beside the total number of orders
SELECT ProductID, Product, Price,
       (SELECT COUNT(*) FROM orders) AS total_orders
FROM products;
@@
<h2>In JOIN — prepare data before joining</h2>
@@run All customer details with their total orders
SELECT c.*, o.total_orders
FROM customers c
LEFT JOIN (SELECT CustomerID, COUNT(*) AS total_orders FROM orders GROUP BY CustomerID) o
       ON c.CustomerID = o.CustomerID;
@@
<div class="box tip"><b class="lbl">Debug tip</b>Highlight only the subquery (no parentheses) and execute it to see the intermediate result.</div>
`);
L('subquery-where','Subquery in WHERE: Comparison, IN, ANY, ALL',`
<h2>Comparison operators — scalar subquery required</h2>
@@run Products more expensive than average
SELECT ProductID, Price FROM products
WHERE Price > (SELECT AVG(Price) FROM products);
@@
<h2>IN — row subquery (list)</h2>
@@run Orders placed by customers in Germany
SELECT * FROM orders
WHERE CustomerID IN (SELECT CustomerID FROM customers WHERE Country = 'Germany');
@@
<p>Use <code>NOT IN</code> for the opposite — but beware NULLs in the list (see <a href="#in">IN</a>).</p>
<h2>ANY / ALL</h2>
<p><code>&gt; ANY (list)</code>: true if greater than at least one value. <code>&gt; ALL (list)</code>: true if greater than every value. (Not supported in SQLite — rewrite with MIN/MAX.)</p>
@@tsql
-- female employees earning more than ANY male employee
SELECT EmployeeID, FirstName, Salary FROM Sales.Employees
WHERE Gender = 'F'
  AND Salary > ANY (SELECT Salary FROM Sales.Employees WHERE Gender = 'M');  -- Mary
-- … than ALL male employees → no rows (Michael earns 90k)
@@
@@run Equivalent rewrite: &gt; ANY = &gt; MIN, &gt; ALL = &gt; MAX
SELECT EmployeeID, FirstName, Salary FROM employees
WHERE Gender = 'F' AND Salary > (SELECT MIN(Salary) FROM employees WHERE Gender = 'M');
@@
`);
L('correlated','Correlated Subqueries & EXISTS',`
<div class="tw"><table class="t"><tr><th></th><th>Non-correlated</th><th>Correlated</th></tr>
<tr><td>Depends on main query</td><td>No — standalone</td><td>Yes — uses a main-query column</td></tr>
<tr><td>Executes</td><td>Once</td><td>Once per main-query row</td></tr>
<tr><td>Run it alone?</td><td>Yes</td><td>No</td></tr>
<tr><td>Readability / speed</td><td>Easier, faster</td><td>Harder, slower</td></tr>
<tr><td>Use for</td><td>Static comparisons</td><td>Row-by-row comparisons, existence checks</td></tr></table></div>
@@run Correlated: each customer's total orders
SELECT c.*,
       (SELECT COUNT(*) FROM orders o WHERE o.CustomerID = c.CustomerID) AS total_orders
FROM customers c;
@@
<h2>EXISTS</h2>
<p>Checks whether the subquery returns <i>any</i> row. For each main-query row the subquery runs; result → row kept, no result → row dropped. What you SELECT inside doesn't matter, so the convention is <code>SELECT 1</code>.</p>
@@run Orders by German customers, with EXISTS
SELECT * FROM orders o
WHERE EXISTS (SELECT 1 FROM customers c
              WHERE c.Country = 'Germany' AND c.CustomerID = o.CustomerID);
@@
@@run NOT EXISTS: orders by customers NOT from Germany
SELECT * FROM orders o
WHERE NOT EXISTS (SELECT 1 FROM customers c
                  WHERE c.Country = 'Germany' AND c.CustomerID = o.CustomerID);
@@
<details class="iq"><summary>Interview: IN vs EXISTS vs JOIN for filtering?</summary><p>All three can filter one table by another. EXISTS stops at the first match and handles NULLs safely (NOT EXISTS has no NULL trap, unlike NOT IN). JOIN may duplicate rows if the other side has many matches. On large tables the course recommends avoiding IN; EXISTS often wins, JOIN is fine when performance is equal and it reads better — always check the plan.</p></details>
@@ex Using EXISTS, list customers (all columns) who have at least one order with Sales &gt; 50.
SELECT * FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.CustomerID = c.CustomerID AND o.Sales > 50);
@@
`);
L('cte','CTE — Common Table Expressions',`
<p>A CTE is a temporary named result set (a virtual table) defined with <code>WITH</code> and usable <b>multiple times</b> within one query. Subqueries are written bottom-up and used once; CTEs read top-down and can be reused.</p>
@@sql
WITH cte_name AS (
    SELECT …            -- CTE query
)
SELECT … FROM cte_name; -- main query
@@
<div class="box warn">ORDER BY is not allowed inside a CTE (or view, or subquery) — sort in the main query.</div>
<h2>Types</h2>
<ul><li><b>Standalone</b> — queries the database directly, runs independently.</li><li><b>Multiple standalone</b> — several CTEs separated by <b>commas</b> (only the first uses WITH; no comma after the last).</li><li><b>Nested</b> — a CTE that selects from another CTE; can't run alone.</li><li><b>Recursive</b> — references itself to loop (next lesson).</li></ul>
<h2>Step-by-step customer report</h2>
@@run Total sales, last order, rank and segment per customer — 4 CTEs
WITH cte_total_sales AS (            -- step 1: standalone
    SELECT CustomerID, SUM(Sales) AS total_sales
    FROM orders GROUP BY CustomerID
),
cte_last_order AS (                  -- step 2: standalone
    SELECT CustomerID, MAX(OrderDate) AS last_order
    FROM orders GROUP BY CustomerID
),
cte_customer_rank AS (               -- step 3: nested (reuses step 1)
    SELECT CustomerID, total_sales,
           RANK() OVER (ORDER BY total_sales DESC) AS customer_rank
    FROM cte_total_sales
),
cte_customer_segments AS (           -- step 4: nested (reuses step 1 again)
    SELECT CustomerID,
           CASE WHEN total_sales > 100 THEN 'High'
                WHEN total_sales > 80  THEN 'Medium'
                ELSE 'Low' END AS customer_segment
    FROM cte_total_sales
)
SELECT c.CustomerID, c.FirstName, c.LastName,
       cts.total_sales, clo.last_order, ccr.customer_rank, ccs.customer_segment
FROM customers c
LEFT JOIN cte_total_sales       cts ON cts.CustomerID = c.CustomerID
LEFT JOIN cte_last_order        clo ON clo.CustomerID = c.CustomerID
LEFT JOIN cte_customer_rank     ccr ON ccr.CustomerID = c.CustomerID
LEFT JOIN cte_customer_segments ccs ON ccs.CustomerID = c.CustomerID
ORDER BY c.CustomerID;
@@
<p>Benefits: <b>readability</b> (clear sections), <b>modularity</b> (self-contained pieces), <b>reusability</b> (write once, use in many places in the query), and recursion.</p>
<div class="box note"><b class="lbl">Don't overuse</b>A new CTE for every column produces 20 nested CTEs nobody can read. Consolidate; aim for 3–5 CTEs per query.</div>
@@ex With a CTE, find customers whose total sales are above the average customer total (columns: CustomerID, total_sales).
WITH t AS (SELECT CustomerID, SUM(Sales) AS total_sales FROM orders GROUP BY CustomerID) SELECT CustomerID, total_sales FROM t WHERE total_sales > (SELECT AVG(total_sales) FROM t);
@@
`);
L('recursive-cte','Recursive CTE',`
<p>A recursive CTE references itself to iterate until a condition stops it. Used for sequences and <b>hierarchies</b> (org charts, bill of materials, folder trees).</p>
@@sql
WITH cte AS (
    SELECT …                -- anchor query: runs ONCE, first step
    UNION ALL
    SELECT … FROM cte       -- recursive query: repeats, references itself
    WHERE <break condition> -- or an INNER JOIN that runs out of matches
)
SELECT * FROM cte
OPTION (MAXRECURSION 5000);  -- SQL Server: default limit 100
@@
@@run Generate numbers 1 to 20
WITH RECURSIVE series AS (
    SELECT 1 AS my_number               -- anchor
    UNION ALL
    SELECT my_number + 1 FROM series    -- recursive
    WHERE my_number < 20                -- stop (< 20, not <= 20, or you get 21)
)
SELECT * FROM series;
@@
@@run Employee hierarchy with levels
WITH RECURSIVE cte_emp_hierarchy AS (
    SELECT EmployeeID, FirstName, ManagerID, 1 AS level
    FROM employees WHERE ManagerID IS NULL          -- anchor: the top boss
    UNION ALL
    SELECT e.EmployeeID, e.FirstName, e.ManagerID, ceh.level + 1
    FROM employees e
    INNER JOIN cte_emp_hierarchy ceh ON e.ManagerID = ceh.EmployeeID
)
SELECT * FROM cte_emp_hierarchy;
@@
<p>Iteration 1: Frank (level 1). Iteration 2: employees whose manager is 1 → Kevin, Mary (level 2). Iteration 3: managers 2 or 3 → Michael, Carol (level 3). Iteration 4: managers 4 or 5 → none, loop ends. (SQL Server writes <code>WITH</code>, not <code>WITH RECURSIVE</code>.)</p>
@@ex Generate a calendar of the dates from 2025-01-01 to 2025-01-10 (single column d). Hint: date(d, '+1 day').
WITH RECURSIVE cal AS (SELECT '2025-01-01' AS d UNION ALL SELECT date(d,'+1 day') FROM cal WHERE d < '2025-01-10') SELECT d FROM cal;
@@
`);
L('views','Views',`
<p>A <b>view</b> is a virtual table stored in the database as a <b>saved query</b>, with no data of its own. Each time you select from it, the database runs the view's query against the underlying tables, so it always shows fresh data.</p>
<h2>Three-level database architecture</h2>
<div class="tw"><table class="t"><tr><th>Level</th><th>Who</th><th>Deals with</th></tr>
<tr><td><b>Physical</b> (internal)</td><td>DBAs</td><td>Data files, pages, partitions, logs, caches</td></tr>
<tr><td><b>Logical</b> (conceptual)</td><td>Developers, data engineers</td><td>Tables, relationships, indexes, procedures</td></tr>
<tr><td><b>View</b> (external)</td><td>End users, BI tools</td><td>Views only — highest abstraction</td></tr></table></div>
@@tsql Create, update and drop
CREATE VIEW Sales.V_Monthly_Summary AS (
    SELECT DATETRUNC(month, OrderDate) AS OrderMonth,
           SUM(Sales) AS TotalSales, COUNT(OrderID) AS TotalOrders, SUM(Quantity) AS TotalQuantities
    FROM Sales.Orders
    GROUP BY DATETRUNC(month, OrderDate)
);
-- update: SQL Server has CREATE OR ALTER VIEW (2016 SP1+); or drop and recreate:
IF OBJECT_ID('Sales.V_Monthly_Summary', 'V') IS NOT NULL
    DROP VIEW Sales.V_Monthly_Summary;
GO
DROP VIEW Sales.V_Monthly_Summary;
@@
@@run Create a view, then query it like a table
CREATE VIEW v_monthly_summary AS
SELECT strftime('%Y-%m', OrderDate) AS order_month,
       SUM(Sales) AS total_sales, COUNT(OrderID) AS total_orders, SUM(Quantity) AS total_quantities
FROM orders GROUP BY strftime('%Y-%m', OrderDate);

SELECT order_month, total_sales,
       SUM(total_sales) OVER (ORDER BY order_month) AS running_total
FROM v_monthly_summary;
@@
<p>Without a schema, objects land in <code>dbo</code>. Dropping a view loses only the query and metadata — never data.</p>
<h2>View use cases</h2>
<ol><li><b>Central reusable logic</b> — persist logic shared by many queries (CTE reuses within one query; a view across all queries).</li>
<li><b>Hide complexity</b> — offer a friendly, combined object instead of a complex physical model.</li>
<li><b>Security</b> — column-level (omit sensitive columns) and row-level (filter rows) protection per audience.</li>
<li><b>Flexibility</b> — refactor physical tables freely while the view keeps the users' contract.</li>
<li><b>Multiple languages</b> — translated view and column names for international teams.</li>
<li><b>Virtual data marts</b> — views on top of the warehouse instead of copying data.</li></ol>
@@run Combined order details view with row-level security (EU team: no USA customers)
CREATE VIEW v_order_details_eu AS
SELECT o.OrderID, o.OrderDate, p.Product, p.Category,
       COALESCE(c.FirstName,'') || ' ' || COALESCE(c.LastName,'') AS CustomerName, c.Country,
       COALESCE(e.FirstName,'') || ' ' || COALESCE(e.LastName,'') AS SalesName,
       o.Sales, o.Quantity
FROM orders o
LEFT JOIN products  p ON p.ProductID  = o.ProductID
LEFT JOIN customers c ON c.CustomerID = o.CustomerID
LEFT JOIN employees e ON e.EmployeeID = o.SalesPersonID
WHERE c.Country <> 'USA';
SELECT * FROM v_order_details_eu;
@@
<div class="tw"><table class="t"><tr><th></th><th>Table</th><th>View</th></tr>
<tr><td>Stores data</td><td>Yes (persisted)</td><td>No (only the query)</td></tr><tr><td>Speed</td><td>Faster</td><td>Slower (runs its query each time)</td></tr><tr><td>Maintenance</td><td>Hard to change</td><td>Easy — change the query</td></tr><tr><td>Read / write</td><td>Both</td><td>Read (mostly)</td></tr></table></div>
<details class="iq"><summary>Interview: What is a materialized / indexed view?</summary><p>A view whose result is physically stored and refreshed (Postgres/Snowflake/Redshift materialized views; SQL Server indexed views with SCHEMABINDING and a unique clustered index). You get table-like read speed with view-like logic, at the cost of refresh/maintenance on writes.</p></details>
`);
L('ctas-temp','CTAS & Temporary Tables',`
<h2>Two ways to create tables</h2>
<ul><li><b>CREATE + INSERT</b> — define the structure from scratch, then insert data.</li><li><b>CTAS</b> (Create Table As Select) — create a new table from the result of a query: structure and data in one step.</li></ul>
@@tsql SQL Server uses SELECT … INTO (others: CREATE TABLE … AS SELECT)
SELECT DATENAME(month, OrderDate) AS OrderMonth, COUNT(OrderID) AS TotalOrders
INTO Sales.MonthlyOrders
FROM Sales.Orders
GROUP BY DATENAME(month, OrderDate);

-- refresh: drop and recreate (T-SQL)
IF OBJECT_ID('Sales.MonthlyOrders', 'U') IS NOT NULL DROP TABLE Sales.MonthlyOrders;
GO
@@
@@run CTAS in portable syntax
CREATE TABLE monthly_orders AS
SELECT strftime('%m', OrderDate) AS order_month, COUNT(OrderID) AS total_orders
FROM orders GROUP BY strftime('%m', OrderDate);
SELECT * FROM monthly_orders;
@@
<h2>View vs CTAS</h2>
<p>A view runs its query on every read — always fresh, can be slow. A CTAS table runs the query once and stores the result — fast to read, but <b>stale</b> until you rebuild it (a view is a pizza made fresh to order; a CTAS table is a frozen pizza).</p>
<p>CTAS use cases: a view that's too slow (prepare data at night so morning reports are fast); a frozen <b>snapshot</b> to analyse a data-quality bug while the source keeps changing; <b>physical data marts</b> when virtual (view) marts are too slow.</p>
<h2>Temporary tables</h2>
<p>Stored in <code>tempdb</code>; dropped automatically when the session ends. Prefix the name with <code>#</code>.</p>
@@tsql
SELECT * INTO #Orders FROM Sales.Orders;       -- copy into a temp table
DELETE FROM #Orders WHERE OrderStatus = 'Delivered';
SELECT * INTO Sales.OrdersTest FROM #Orders;   -- persist the result if needed
-- close the session → #Orders is gone, Sales.OrdersTest remains
@@
<p>Use for intermediate ETL steps (extract → transform → load) where you don't care to keep the copy. <code>##global</code> temp tables are visible to all sessions.</p>
`);
L('techniques-compare','Comparing the Five Techniques',`
<div class="tw"><table class="t"><tr><th></th><th>Subquery</th><th>CTE</th><th>Temp table</th><th>CTAS</th><th>View</th></tr>
<tr><td>Storage</td><td>Memory (cache)</td><td>Memory (cache)</td><td>Disk (tempdb)</td><td>Disk</td><td>None (query only)</td></tr>
<tr><td>Lifetime</td><td>Temporary</td><td>Temporary</td><td>Temporary</td><td>Permanent</td><td>Permanent</td></tr>
<tr><td>Dropped when</td><td>Query ends</td><td>Query ends</td><td>Session ends</td><td>You DROP it</td><td>You DROP it</td></tr>
<tr><td>Scope</td><td>One query</td><td>One query</td><td>Many queries (session)</td><td>Many queries</td><td>Many queries</td></tr>
<tr><td>Reusability</td><td>Limited (one place)</td><td>Limited (one query)</td><td>Medium</td><td>High</td><td>High</td></tr>
<tr><td>Up to date</td><td>Yes</td><td>Yes</td><td>No</td><td>No</td><td>Yes</td></tr></table></div>
<p>The author's ranking: views first, then CTEs (max ~5 per query), subqueries, CTAS when a view is too slow, temp tables rarely.</p>
<details class="iq"><summary>Interview: CTE vs temp table vs table variable?</summary><p>A CTE is just a named query — not materialized in SQL Server, re-evaluated if referenced twice, no indexes, gone after the statement. A <b>#temp table</b> is materialized in tempdb, has statistics, can be indexed and reused across statements in the session — better for large intermediate results reused several times. A <b>@table variable</b> lives in tempdb too but historically had poor cardinality estimates; good for small sets.</p></details>
<details class="iq"><summary>Interview: Subquery vs CTE performance?</summary><p>In SQL Server they usually compile to the same plan — CTEs are mainly for readability and reuse. Performance differences come from structure (e.g. aggregating before joining), not from the syntax choice.</p></details>
`);
L('stored-procs','Stored Procedures',`
<p>A <b>stored procedure</b> saves multiple SQL statements as a named program inside the database. Instead of handing colleagues scripts to run in the right order, they run <code>EXEC procedure_name</code>. Procedures support parameters, variables, IF/ELSE, loops and error handling. Code is pre-compiled and lives next to the data.</p>
<p>Trade-off: Python/Spark offer version control, testing and easier complex logic. The author's opinion: for big projects prefer orchestrated Python (Databricks, Snowflake…) over stored-procedure-based projects, which become hard to debug and test.</p>
@@tsql A complete procedure: parameter with default, variables, IF/ELSE, TRY/CATCH
CREATE PROCEDURE GetCustomerSummary @Country NVARCHAR(50) = 'USA'
AS
BEGIN
  BEGIN TRY
    DECLARE @TotalCustomers INT, @AvgScore FLOAT;

    -- ===== Step 1: prepare & clean data =====
    IF EXISTS (SELECT 1 FROM Sales.Customers WHERE Score IS NULL AND Country = @Country)
    BEGIN
        PRINT('Updating NULL scores to 0');
        UPDATE Sales.Customers SET Score = 0 WHERE Score IS NULL AND Country = @Country;
    END
    ELSE
    BEGIN
        PRINT('No NULL scores found');
    END;

    -- ===== Step 2: generate summary reports =====
    SELECT @TotalCustomers = COUNT(*), @AvgScore = AVG(Score)
    FROM Sales.Customers WHERE Country = @Country;

    PRINT 'Total Customers from ' + @Country + ': ' + CAST(@TotalCustomers AS NVARCHAR);
    PRINT 'Average Score from '  + @Country + ': ' + CAST(@AvgScore AS NVARCHAR);

    SELECT COUNT(o.OrderID) AS TotalOrders, SUM(o.Sales) AS TotalSales
    FROM Sales.Orders o JOIN Sales.Customers c ON c.CustomerID = o.CustomerID
    WHERE c.Country = @Country;
  END TRY
  BEGIN CATCH
    PRINT 'An error occurred.';
    PRINT 'Error Message: '   + ERROR_MESSAGE();
    PRINT 'Error Number: '    + CAST(ERROR_NUMBER() AS NVARCHAR);
    PRINT 'Error Line: '      + CAST(ERROR_LINE() AS NVARCHAR);
    PRINT 'Error Procedure: ' + ERROR_PROCEDURE();
  END CATCH
END
GO
EXEC GetCustomerSummary;                       -- default USA
EXEC GetCustomerSummary @Country = 'Germany';
ALTER PROCEDURE …   -- change it;   DROP PROCEDURE GetCustomerSummary;  -- remove it
@@
<ul><li><b>Parameter</b> — input from the caller (<code>@Country</code>), optional default.</li>
<li><b>Variable</b> — value held inside the procedure: <i>declare → assign (SELECT @v = …) → use</i>. PRINT needs strings, so CAST numbers.</li>
<li><b>Control flow</b> — IF/ELSE; check with EXISTS before an expensive UPDATE.</li>
<li><b>Error handling</b> — TRY runs the code; on any error control jumps to CATCH.</li></ul>
<div class="box tip">End each statement with a semicolon and indent each BEGIN/END block — procedures get long fast.</div>
`);
L('triggers','Triggers',`
<p>A <b>trigger</b> is a special stored procedure that runs automatically in response to an event on a table.</p>
<ul><li><b>DML triggers</b> — INSERT, UPDATE, DELETE. Timing: <code>AFTER</code> the event, or <code>INSTEAD OF</code> it.</li><li><b>DDL triggers</b> — CREATE, ALTER, DROP.</li><li><b>Logon triggers</b> — login events.</li></ul>
<p>Classic use case: an <b>audit log</b> of every new employee for compliance.</p>
@@tsql
CREATE TABLE Sales.EmployeeLogs (
    LogID INT IDENTITY(1,1) PRIMARY KEY,
    EmployeeID INT, LogMessage VARCHAR(255), LogDate DATE);

CREATE TRIGGER trg_AfterInsertEmployee ON Sales.Employees
AFTER INSERT
AS
BEGIN
    INSERT INTO Sales.EmployeeLogs (EmployeeID, LogMessage, LogDate)
    SELECT EmployeeID,
           'New Employee Added = ' + CAST(EmployeeID AS VARCHAR),
           GETDATE()
    FROM INSERTED;          -- virtual table holding the new rows (DELETED holds old rows)
END
@@
@@run The same audit trigger in SQLite (NEW instead of INSERTED)
CREATE TABLE employee_logs (log_id INTEGER PRIMARY KEY, employee_id INT, log_message TEXT, log_date TEXT);
CREATE TRIGGER trg_after_insert_employee AFTER INSERT ON employees
BEGIN
  INSERT INTO employee_logs (employee_id, log_message, log_date)
  VALUES (NEW.EmployeeID, 'New Employee Added = ' || NEW.EmployeeID, date('now'));
END;
INSERT INTO employees VALUES (6,'Maria','Doe','HR','1988-01-12','F',80000,3);
SELECT * FROM employee_logs;
@@
<details class="iq"><summary>Interview: Downsides of triggers?</summary><p>Hidden logic (writes cause side effects nobody sees), slower DML, harder debugging, and recursion/ordering issues. In modern pipelines prefer explicit audit columns, CDC or temporal tables.</p></details>
`);

L('idx-intro','Indexes & Data Pages',`
<p>An <b>index</b> is a data structure that gives quick access to rows — like the index at the back of a book, or a hotel's room map instead of checking every floor.</p>
<h2>How a table is stored</h2>
<p>Data isn't stored as a grid. It sits in <b>data files</b> on disk, organized into <b>pages</b> of 8 KB — the unit SQL Server reads and writes. A data page has a <b>header</b> (96 bytes, page ID like <code>1:150</code> = file:page), <b>data rows</b>, and an <b>offset array</b> pointing to where each row starts.</p>
<h2>Heap table (no index)</h2>
<p>Rows land in pages in insert order, unsorted. Inserts are fast; finding customer 14 means reading every page and every row — a <b>full table scan</b>. Fast writes, slow reads.</p>
<h2>Index types</h2>
<div class="tw"><table class="t"><tr><th>Category</th><th>Types</th></tr>
<tr><td>Structure</td><td>Clustered, Non-clustered</td></tr>
<tr><td>Storage</td><td>Rowstore, Columnstore</td></tr>
<tr><td>Function</td><td>Unique, Filtered</td></tr></table></div>
`);
L('idx-clustered','Clustered vs Non-Clustered Index',`
<h2>Clustered index</h2>
<p>Physically sorts the data pages by the key, then builds a <b>B-tree</b> (balanced tree): root node → intermediate nodes → leaf nodes. Root and intermediate levels are <b>index pages</b> holding key → page pointers (one per <i>cluster</i> of rows, hence the name). The <b>leaf level contains the actual data pages</b>. Finding ID 14: root says 11–20 → index page says 11–15 → data page 1:102. Like a book's table of contents — chapters are physically in that order.</p>
<h2>Non-clustered index</h2>
<p>Leaves the data where it is and builds a separate B-tree. Its leaf level holds <b>index pages with a row locator (RID: file:page:offset)</b> for every row — or the clustered key if the table has a clustered index. One extra hop compared with clustered. Like the index at the back of a book.</p>
<div class="tw"><table class="t"><tr><th></th><th>Clustered</th><th>Non-clustered</th></tr>
<tr><td>Data</td><td>Physically sorted; leaf = data pages</td><td>Separate structure with pointers</td></tr>
<tr><td>Per table</td><td><b>One</b> (data can be sorted one way)</td><td>Many</td></tr>
<tr><td>Read speed</td><td>Faster</td><td>Slower (extra layer)</td></tr>
<tr><td>Write speed</td><td>Slower (keeps physical order)</td><td>Faster than clustered</td></tr>
<tr><td>Storage</td><td>Efficient</td><td>Extra space</td></tr>
<tr><td>Use for</td><td>Unique, rarely-updated keys — primary keys; date ranges</td><td>Columns in WHERE, JOIN keys (foreign keys), exact lookups</td></tr></table></div>
@@tsql
CREATE [UNIQUE] [CLUSTERED | NONCLUSTERED] INDEX index_name ON table_name (column1 [ASC|DESC], …);

SELECT * INTO Sales.DBCustomers FROM Sales.Customers;   -- heap copy, no indexes
CREATE CLUSTERED INDEX idx_DBCustomers_CustomerID ON Sales.DBCustomers (CustomerID);
CREATE NONCLUSTERED INDEX idx_DBCustomers_LastName ON Sales.DBCustomers (LastName);
CREATE INDEX idx_DBCustomers_FirstName ON Sales.DBCustomers (FirstName);  -- default = nonclustered
DROP INDEX idx_DBCustomers_CustomerID ON Sales.DBCustomers;
EXEC sp_helpindex 'Sales.DBCustomers';                  -- list indexes
@@
<p>Naming convention: <code>idx_&lt;table&gt;_&lt;column(s)&gt;</code>. A primary key creates a clustered index by default in SQL Server.</p>
<h2>Composite index &amp; leftmost prefix rule</h2>
@@tsql
CREATE INDEX idx_DBCustomers_CountryScore ON Sales.DBCustomers (Country, Score);
-- used:     WHERE Country = 'USA' AND Score > 500
-- used:     WHERE Country = 'USA'            (leftmost column present)
-- NOT used: WHERE Score > 500                (leftmost column skipped)
@@
<p>Index (A, B, C, D) helps filters on A; A,B; A,B,C — but not B alone, nor A,C (skipping B). Order the index columns the way your queries filter.</p>
@@run Indexes in SQLite — EXPLAIN QUERY PLAN shows SCAN vs SEARCH
CREATE INDEX idx_orders_customer ON orders (CustomerID);
EXPLAIN QUERY PLAN SELECT * FROM orders WHERE CustomerID = 3;
@@
`);
L('idx-columnstore','Rowstore vs Columnstore Index',`
<p><b>Rowstore</b> stores data row by row in pages (classic OLTP). <b>Columnstore</b> stores each column separately:</p>
<ol><li><b>Row groups</b> — split rows into groups of ~1 million (for parallelism).</li>
<li><b>Column segments</b> — within each row group, separate each column.</li>
<li><b>Compression</b> — build a <i>dictionary</i> (e.g. 'Active'→1, 'Inactive'→2) and store a compact data stream of IDs.</li>
<li><b>Store</b> in LOB pages: header, segment header (segment/row group/column IDs, dictionary ID), data stream; plus dictionary pages.</li></ol>
<p>Query <code>SELECT COUNT(*) FROM customers WHERE status='Active'</code>: rowstore reads every page with every column; columnstore reads only the status segment — far less I/O.</p>
<div class="tw"><table class="t"><tr><th></th><th>Rowstore</th><th>Columnstore</th></tr>
<tr><td>Organized</td><td>Row by row</td><td>Column by column</td></tr><tr><td>Storage</td><td>Larger</td><td>Smaller — compressed (course demo: 9 MB → 1 MB)</td></tr><tr><td>Reads</td><td>Balanced</td><td>Fast for aggregations / scans</td></tr><tr><td>Writes</td><td>Balanced</td><td>Slower</td></tr><tr><td>I/O</td><td>Reads all columns</td><td>Reads only needed columns</td></tr><tr><td>Best for</td><td>OLTP (banking, e-commerce)</td><td>OLAP (warehouses, BI, big fact tables)</td></tr></table></div>
@@tsql
CREATE CLUSTERED COLUMNSTORE INDEX idx_DBCustomers_CS ON Sales.DBCustomers;  -- no column list!
CREATE NONCLUSTERED COLUMNSTORE INDEX idx_DBCustomers_CS_FirstName ON Sales.DBCustomers (FirstName);
@@
<p>Rules: a clustered columnstore converts the whole table (no column list). In SQL Server only one columnstore index per table, and only one clustered index of any kind.</p>
`);
L('idx-unique-filtered','Unique & Filtered Indexes',`
<h2>Unique index</h2><p>Guarantees no duplicates (data integrity) and slightly speeds reads — SQL stops searching after the first match. Writes are slightly slower. Creation fails if duplicates already exist.</p>
@@tsql
CREATE UNIQUE NONCLUSTERED INDEX idx_Products_Product ON Sales.Products (Product);
INSERT INTO Sales.Products (ProductID, Product) VALUES (106, 'Caps');  -- fails: duplicate
@@
<h2>Filtered index</h2><p>A non-clustered index that includes only rows meeting a condition — smaller, faster, less storage. Not allowed on clustered or columnstore indexes.</p>
@@tsql
CREATE NONCLUSTERED INDEX idx_Customers_Country ON Sales.Customers (Country)
WHERE Country = 'USA';    -- used only by queries filtering USA
@@
<h2>Which index when?</h2>
<div class="tw"><table class="t"><tr><th>Type</th><th>Use when</th></tr>
<tr><td>Heap (none)</td><td>Fast inserts: staging, temp tables</td></tr><tr><td>Clustered (rowstore)</td><td>Primary keys; else a date column where order matters</td></tr><tr><td>Columnstore</td><td>Big analytical queries, very large tables (OLAP)</td></tr><tr><td>Non-clustered</td><td>Foreign keys, join columns, WHERE columns</td></tr><tr><td>Filtered</td><td>Queries always target a subset</td></tr><tr><td>Unique</td><td>Enforce integrity on a naturally unique column</td></tr></table></div>
<details class="iq"><summary>Interview: What is a covering index / INCLUDE?</summary><p>A non-clustered index that contains every column a query needs, so SQL never visits the base table (no key lookup). Key columns support seeks; extra output columns go in <code>INCLUDE (col1, col2)</code> at the leaf level only: <code>CREATE INDEX ix ON orders (CustomerID) INCLUDE (OrderDate, Sales)</code>.</p></details>
`);
L('idx-maintain','Monitoring & Maintaining Indexes',`
<p>Indexes need maintenance like a car. Five tasks:</p>
<h2>1. Monitor usage — drop unused indexes</h2>
@@tsql
SELECT tbl.name AS TableName, idx.name AS IndexName, idx.type_desc AS IndexType,
       idx.is_primary_key, idx.is_unique, idx.is_disabled,
       s.user_seeks, s.user_scans, s.user_lookups, s.user_updates,
       COALESCE(s.last_user_seek, s.last_user_scan) AS LastUpdate
FROM sys.indexes idx
JOIN sys.tables tbl ON idx.object_id = tbl.object_id
LEFT JOIN sys.dm_db_index_usage_stats s
       ON s.object_id = idx.object_id AND s.index_id = idx.index_id
ORDER BY tbl.name, idx.name;
@@
<div class="box tip"><b class="lbl">The author's day-one trick</b>Around 90% of indexes in many projects are never used. Find them, discuss with the team, drop them: you save storage and speed up every write. (DMV stats reset when the server restarts.)</div>
<h2>2. Missing indexes — the optimizer's recommendations</h2>
@@tsql
SELECT * FROM sys.dm_db_missing_index_details;   -- evaluate, don't create blindly
@@
<h2>3. Duplicate indexes</h2>
@@tsql
SELECT tbl.name AS TableName, col.name AS IndexColumn, idx.name AS IndexName, idx.type_desc,
       COUNT(*) OVER (PARTITION BY tbl.name, col.name) AS ColumnCount  -- > 1 = duplicate
FROM sys.indexes idx
JOIN sys.tables tbl ON idx.object_id = tbl.object_id
JOIN sys.index_columns ic ON idx.object_id = ic.object_id AND idx.index_id = ic.index_id
JOIN sys.columns col ON ic.object_id = col.object_id AND ic.column_id = col.column_id
ORDER BY ColumnCount DESC;
@@
<h2>4. Update statistics</h2>
<p>The optimizer picks a plan from <b>statistics</b> (row counts, value distribution, histograms). After inserting 1M rows into a table whose stats say 50 rows, it makes bad choices.</p>
@@tsql
-- check staleness: sys.stats + sys.dm_db_stats_properties (last_updated, rows, modification_counter)
UPDATE STATISTICS Sales.DBCustomers _WA_Sys_00000001_6EF57B66;  -- one statistic
UPDATE STATISTICS Sales.DBCustomers;                              -- whole table
EXEC sp_updatestats;                                              -- whole database (weekend job)
@@
<h2>5. Fragmentation</h2>
<p>Over time pages get out of logical order and partly empty. Check <code>sys.dm_db_index_physical_stats(DB_ID(), NULL, NULL, NULL, 'LIMITED')</code>, column <code>avg_fragmentation_in_percent</code>:</p>
<div class="tw"><table class="t"><tr><th>Fragmentation</th><th>Action</th></tr><tr><td>0–10%</td><td>Nothing</td></tr><tr><td>10–30%</td><td><code>ALTER INDEX idx ON tbl REORGANIZE;</code> — light, defragments leaf level, online</td></tr><tr><td>&gt; 30%</td><td><code>ALTER INDEX idx ON tbl REBUILD;</code> — drops and recreates, heavier</td></tr></table></div>
`);
L('exec-plan','Execution Plans',`
<p>Before running a query the optimizer builds an <b>execution plan</b> — the roadmap of how it will read tables, join and aggregate — using statistics. Plans are cached and reused for identical queries. In SSMS:</p>
<ul><li><b>Estimated</b> plan — the optimizer's guess, without running.</li><li><b>Actual</b> plan — what was really used (enable, then run).</li><li><b>Live query statistics</b> — watch it during execution.</li></ul>
<p>Read plans <b>right to left</b>. Check each operator's properties: number of rows read, estimated CPU and I/O cost, which index was used.</p>
<h2>Scan types (worst → best)</h2>
<div class="tw"><table class="t"><tr><th>Operator</th><th>Meaning</th></tr>
<tr><td>Table Scan</td><td>Heap: reads the entire table</td></tr><tr><td>Index Scan / Clustered Index Scan</td><td>Reads all or a range of an index</td></tr><tr><td>Index Seek</td><td>Navigates the B-tree straight to the rows — the good sign (course demo: 12 rows read instead of 60,000)</td></tr><tr><td>Key Lookup</td><td>After a non-clustered seek, fetches other columns from the base table (fix with INCLUDE/covering index)</td></tr><tr><td>Sort</td><td>Expensive; disappears when an index already provides the order</td></tr></table></div>
<h2>Join algorithms</h2>
<div class="tw"><table class="t"><tr><th>Physical join</th><th>Good for</th></tr><tr><td>Nested Loops</td><td>Small inputs; one side small and indexed. Bad on big tables</td></tr><tr><td>Merge Join</td><td>Two inputs already sorted on the join key</td></tr><tr><td>Hash Match</td><td>Large unsorted inputs; big table joined with a small one (small side hashed in memory)</td></tr></table></div>
<p>Course demo: the same aggregation on a fact table cost 71% of the plan with a rowstore clustered index and 6% with a clustered columnstore.</p>
<h2>SQL hints</h2>
@@tsql
SELECT o.Sales, c.Country
FROM Sales.Orders o
LEFT JOIN Sales.Customers c WITH (FORCESEEK)        -- or WITH (INDEX(PK_Customers))
  ON o.CustomerID = c.CustomerID
OPTION (HASH JOIN);                                 -- force the join algorithm
@@
<div class="box warn"><b class="lbl">Use hints carefully</b>A hint that helps on dev can hurt on production (different data volume). Test in every environment, and treat hints as a temporary workaround — find the root cause (stale statistics, wrong indexes).</div>
@@run SQLite plan: SCAN before an index, SEARCH after
EXPLAIN QUERY PLAN SELECT * FROM orders WHERE OrderStatus = 'Shipped';
CREATE INDEX idx_orders_status ON orders (OrderStatus);
EXPLAIN QUERY PLAN SELECT * FROM orders WHERE OrderStatus = 'Shipped';
@@
`);
L('idx-strategy','Indexing Strategy',`
<div class="box warn"><b class="lbl">Golden rule: avoid over-indexing</b>Every index slows INSERT/UPDATE/DELETE and confuses the optimizer with too many choices. Less is more.</div>
<h2>Phase 1 — Initial strategy: define the goal</h2>
<p>Understand the system. <b>OLAP</b> (warehouse): pain is usually <i>read</i> performance → make big fact tables <b>clustered columnstore</b>. <b>OLTP</b> (application): pain is usually <i>write</i> performance → clustered index on each primary key, add others sparingly.</p>
<h2>Phase 2 — Usage-pattern indexing</h2>
<p>Identify frequently used tables and columns from your queries (an AI assistant can produce usage stats per table/column: filtering, joining, grouping). Choose the right index type for each pattern, then test it.</p>
<h2>Phase 3 — Scenario-based indexing</h2>
<p>Find slow queries (user reports, logs) → read their execution plans (full scans, nested loops on big tables) → choose an index → compare plans before and after.</p>
<h2>Phase 4 — Monitoring &amp; maintenance</h2>
<p>Monitor usage, missing indexes, duplicates; update statistics; handle fragmentation. Automate a dashboard. Repeat the cycle.</p>
`);
L('partitioning','Partitioning',`
<p><b>Partitioning</b> divides one large table into smaller pieces (partitions) — users still see one table. Typically by date: old years are rarely touched, the current year gets most reads and writes.</p>
<ul><li><b>Partition elimination</b>: a query for 2025 reads only that partition.</li><li><b>Parallel processing</b> across partitions.</li><li><b>Smaller indexes</b>: each partition has its own; inserting into 2025 touches only its index.</li></ul>
<h2>Four steps in SQL Server</h2>
@@tsql
-- 1. Partition FUNCTION: the logic (boundaries)
CREATE PARTITION FUNCTION PartitionByYear (DATE)
AS RANGE LEFT FOR VALUES ('2023-12-31', '2024-12-31', '2025-12-31');
-- 3 boundaries → 4 partitions; LEFT = the boundary value belongs to the left partition

-- 2. FILEGROUPS: logical containers (folders) — one per partition
ALTER DATABASE SalesDB ADD FILEGROUP FG_2023;   -- … FG_2024, FG_2025, FG_2026
-- (ALTER DATABASE SalesDB REMOVE FILEGROUP FG_2023; to undo)

-- 3. DATA FILES (.ndf): physical files inside each filegroup
ALTER DATABASE SalesDB ADD FILE (
    NAME = P_2023,
    FILENAME = 'C:\\Program Files\\Microsoft SQL Server\\MSSQL16.SQLEXPRESS\\MSSQL\\DATA\\P_2023.ndf'
) TO FILEGROUP FG_2023;                          -- … repeat per year

-- 4. Partition SCHEME: map partitions → filegroups (order matters! count = partitions)
CREATE PARTITION SCHEME SchemePartitionByYear
AS PARTITION PartitionByYear TO (FG_2023, FG_2024, FG_2025, FG_2026);

-- Partitioned table
CREATE TABLE Sales.Orders_Partitioned (OrderID INT, OrderDate DATE, Sales INT)
ON SchemePartitionByYear (OrderDate);
@@
<div class="flow"><span>Table</span><i>→</i><span>Partition scheme</span><i>→</i><span>Partition function (which partition)</span><i>+</i><span>Filegroup</span><i>→</i><span>Data file</span></div>
<p>Inserting '2025-12-31' (a boundary, RANGE LEFT) → partition 3 → FG_2025 → P_2025.ndf. Verify with <code>sys.partitions</code> / <code>sys.destination_data_spaces</code>; the execution plan of a query on one year shows <b>Actual Partition Count = 1</b> and fewer rows read.</p>
<div class="box tip"><b class="lbl">Data-lake equivalent</b>In Athena/Glue/Spark/Iceberg the same idea is directory or hidden partitioning (<code>s3://…/year=2025/month=02/</code>). Filtering on the partition column prunes files; too many tiny partitions hurts.</div>
`);
L('best-practices','30 Performance Best Practices',`
<div class="box note"><b class="lbl">Golden rule: always test</b>The optimizer behaves differently for small and huge tables. On hundreds of thousands of rows you won't see a difference; on hundreds of millions you will. Compare execution plans before and after. If two versions perform the same, choose the more readable one.</div>
<h2>Fetching data</h2>
<ol><li><b>Select only what you need</b> — no <code>SELECT *</code>.</li>
<li><b>Avoid unnecessary DISTINCT and ORDER BY</b> — both are expensive habits.</li>
<li><b>Limit rows when exploring</b> — <code>TOP 10</code>.</li></ol>
<h2>Filtering</h2>
<ol start="4"><li>Create non-clustered indexes on columns frequently used in WHERE.</li>
<li><b>Don't wrap filtered columns in functions</b> — <code>LOWER(status)='delivered'</code>, <code>SUBSTRING(name,1,1)='A'</code>, <code>YEAR(date)=2025</code> block index use. Write <code>status='Delivered'</code>, <code>name LIKE 'A%'</code>, <code>date BETWEEN '2025-01-01' AND '2025-12-31'</code>.</li>
<li>Avoid leading wildcards (<code>'%gold'</code>).</li>
<li>Use IN instead of many ORs.</li></ol>
<h2>Joins</h2>
<ol start="8"><li>Know join speed: INNER &gt; LEFT/RIGHT &gt; FULL. Use INNER when matching rows are enough.</li>
<li>Use explicit ANSI joins (<code>INNER JOIN … ON</code>), not implicit comma joins with WHERE.</li>
<li>Index columns used in ON (both sides; add non-clustered indexes on foreign keys).</li>
<li>Big tables: filter before joining (subquery/CTE); small tables: a plain WHERE is fine — the optimizer handles it.</li>
<li>Big tables: aggregate before joining. Avoid correlated subqueries for aggregation — the worst option.</li>
<li>Use UNION instead of OR in join conditions (<code>ON a=b OR a=c</code> kills performance).</li>
<li>Watch for nested loops on big tables in the plan; consider <code>OPTION (HASH JOIN)</code>.</li></ol>
<h2>UNION</h2>
<ol start="15"><li>UNION ALL instead of UNION when duplicates are acceptable or impossible.</li>
<li>Big tables needing dedup: UNION ALL + DISTINCT can beat UNION — test it.</li></ol>
<h2>Aggregation</h2>
<ol start="17"><li>Clustered columnstore for aggregations on large (fact) tables.</li>
<li>Pre-aggregate slow report queries into a table (CTAS) and refresh it on schedule.</li></ol>
<h2>Subqueries &amp; logic</h2>
<ol start="19"><li>Filtering one table by another: avoid IN on big tables; JOIN or EXISTS — EXISTS often wins because it only checks existence.</li>
<li>Avoid redundant logic — reading the same table four times or repeating the same subquery. Use window functions or a CTE.</li></ol>
@@run Redundancy fix: one pass with a window function instead of four scans
SELECT EmployeeID, FirstName,
  CASE WHEN Salary > AVG(Salary) OVER () THEN 'Above Average'
       WHEN Salary < AVG(Salary) OVER () THEN 'Below Average'
       ELSE 'Average' END AS status
FROM employees;
@@
<h2>DDL (table design)</h2>
<ol start="21"><li>Avoid VARCHAR/TEXT when a better type exists (score → INT, birth date → DATE).</li>
<li>Avoid MAX or oversized lengths — they mislead the optimizer into big memory grants and big indexes.</li>
<li>Use NOT NULL wherever possible — integrity, better indexes, fewer IS NOT NULL filters.</li>
<li>Every table gets a clustered primary key.</li>
<li>Add non-clustered indexes on frequently used foreign keys.</li></ol>
<h2>Indexing</h2>
<ol start="26"><li>Avoid over-indexing.</li><li>Drop unused indexes.</li><li>Update statistics weekly.</li><li>Reorganize/rebuild fragmented indexes weekly.</li><li>Partition very large tables (and combine with columnstore).</li></ol>
`);
